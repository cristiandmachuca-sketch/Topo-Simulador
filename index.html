<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador Topográfico — Niveles 1 a 6</title>
<style>html,body{margin:0;height:100%;background:#101216;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}
#barra{height:42px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#2c2418;color:#f4ecd8;box-sizing:border-box}
#barra b{margin-right:10px;font-size:13px;letter-spacing:.05em}
.tab{border:1px solid #8a7857;background:#3a3020;color:#f4ecd8;padding:6px 14px;border-radius:3px;cursor:pointer;font-size:13px}
.tab.act{background:#e8590c;border-color:#fff;color:#fff;font-weight:700}.tab:disabled{opacity:.4;cursor:not-allowed}
iframe{position:absolute;top:42px;left:0;width:100%;height:calc(100% - 42px);border:0;display:none}iframe.vis{display:block}</style></head><body>
<div id="barra"><b>SIMULADOR TOPOGRÁFICO</b><span id="tabs"></span></div>

<script>
const SRC_A="<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Simulador Topogr\u00e1fico \u2014 Por Niveles<\/title>\n<style>\n  :root{\n    --tierra-1:#f4ecd8;\n    --tierra-2:#e3d5b3;\n    --tinta:#2c2418;\n    --linea:#8a7857;\n    --naranja:#e8590c;\n    --verde-cota:#5c7a3f;\n    --verde-ok:#4a8a3a;\n    --rojo-aviso:#b23a2e;\n    --panel-borde:#c9b98c;\n    --hud-fondo:rgba(18,20,24,.82);\n    --mono: 'Courier New', ui-monospace, monospace;\n    --sans: 'Segoe UI', Arial, sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;background:#101216;font-family:var(--sans);overflow:hidden;}\n  #app{position:relative;width:100vw;height:100vh;display:flex;}\n  #canvas-wrap{flex:1;position:relative;}\n  canvas{display:block;width:100%;height:100%;}\n  canvas.modo-orbitar{cursor:grab;}\n  canvas.modo-levantar{cursor:crosshair;}\n  canvas.modo-obstaculos{cursor:pointer;}\n  canvas.modo-nivelar{cursor:cell;}\n  canvas.modo-lote{cursor:grab;}\n\n  #hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;pointer-events:none;}\n  #titulo h1{margin:0;font-size:15px;letter-spacing:.02em;font-weight:600;color:var(--tierra-1);}\n  #titulo p{margin:2px 0 0;font-size:12px;color:#a9a08a;font-family:var(--mono);}\n  #badge-nivel{background:var(--naranja);color:#fff;font-family:var(--mono);font-size:12px;padding:5px 10px;letter-spacing:.03em;pointer-events:none;}\n\n  #columna-izquierda{position:absolute;top:64px;left:18px;width:196px;display:flex;flex-direction:column;gap:10px;}\n  #barra-modos{display:flex;flex-direction:column;gap:5px;background:var(--hud-fondo);padding:8px;border-radius:3px;}\n  .btn-modo{padding:9px 10px;font-family:var(--sans);font-size:12.5px;font-weight:600;background:transparent;color:#dcd3bd;border:1px solid transparent;cursor:pointer;text-align:left;border-radius:2px;}\n  .btn-modo:hover{background:rgba(227,213,179,.12);}\n  .btn-modo.activo{background:var(--naranja);color:#fff;}\n\n  #banner-instrucciones{background:var(--hud-fondo);color:var(--tierra-1);padding:10px 12px;font-size:12px;font-family:var(--mono);line-height:1.45;border-radius:3px;}\n  #barra-progreso-wrap{background:var(--hud-fondo);padding:9px 12px;border-radius:3px;font-family:var(--mono);}\n  #barra-progreso-fondo{width:100%;height:8px;background:rgba(255,255,255,.15);margin-top:5px;border-radius:4px;overflow:hidden;}\n  #barra-progreso-relleno{height:100%;width:0%;background:var(--verde-ok);transition:width .25s;}\n\n  #panel{width:340px;min-width:340px;background:var(--tierra-1);border-left:1px solid var(--panel-borde);display:flex;flex-direction:column;color:var(--tinta);}\n  #panel-scroll{overflow-y:auto;padding:20px 20px 12px;flex:1;}\n  #panel h2{font-size:13px;margin:0 0 4px;font-weight:700;border-bottom:2px solid var(--tinta);padding-bottom:8px;}\n  #panel .sub{font-size:11px;color:var(--linea);font-family:var(--mono);margin:0 0 16px;}\n\n  .seccion{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--panel-borde);}\n  .seccion:last-child{border-bottom:none;}\n  .seccion h3{font-size:11px;font-weight:700;margin:0 0 8px;color:var(--verde-cota);display:flex;justify-content:space-between;align-items:center;}\n\n  .dato{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:13px;padding:4px 0;border-bottom:1px dotted var(--panel-borde);}\n  .dato span:first-child{color:var(--linea);font-size:11px;}\n  .dato span:last-child{font-weight:700;}\n\n  #lista-puntos, #lista-lados, #lista-calle{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12px;max-height:140px;overflow-y:auto;}\n  #lista-calle li{padding:3px 0;border-bottom:1px dotted #ddd0ac;}\n  #lista-puntos li{padding:3px 0;border-bottom:1px dotted #ddd0ac;}\n  #lista-puntos li b{color:var(--naranja);}\n  #lista-lados li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dotted #ddd0ac;}\n  #lista-lados li span:first-child{flex:1;color:var(--tinta);}\n  .valor-lado{min-width:64px;text-align:right;font-weight:700;}\n\n  .btn{width:100%;padding:9px 10px;margin-top:6px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;}\n  .btn:hover{background:var(--tinta);color:var(--tierra-1);}\n  .btn.principal{background:var(--naranja);border-color:var(--naranja);color:#fff;}\n  .btn.principal:hover{background:#c94a08;border-color:#c94a08;}\n  .btn.exito{background:var(--verde-ok);border-color:var(--verde-ok);color:#fff;}\n  .btn.exito:hover{background:#3d7530;border-color:#3d7530;}\n  .btn:disabled{opacity:.35;cursor:not-allowed;}\n  .btn:disabled:hover{background:transparent;color:var(--tinta);}\n  .btn-medir{padding:4px 9px;border:1px solid var(--tinta);background:transparent;font-family:var(--sans);font-size:11px;font-weight:700;cursor:pointer;}\n  .btn-medir:hover{background:var(--tinta);color:#fff;}\n  .btn-medir:disabled{background:var(--verde-cota);border-color:var(--verde-cota);color:#fff;opacity:1;cursor:default;}\n\n  .fila-pasos{display:flex;gap:5px;}\n  .btn-paso{flex:1;padding:8px 4px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;}\n  .btn-paso:hover{background:rgba(44,36,24,.12);}\n  .btn-paso.activo{background:var(--tinta);color:var(--tierra-1);}\n  .fila-herramientas{display:flex;gap:5px;}\n  .btn-herr{flex:1;padding:9px 4px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;}\n  .btn-herr:hover{background:rgba(44,36,24,.12);}\n  .btn-herr.activo{background:var(--naranja);border-color:var(--naranja);color:#fff;}\n  #btn-herr-aplanar.activo{background:var(--verde-cota);border-color:var(--verde-cota);color:#fff;}\n  .fila-categoria{display:flex;gap:5px;margin-bottom:8px;}\n  .btn-cat{flex:1;padding:9px 4px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;}\n  .btn-cat:hover{background:rgba(44,36,24,.12);}\n  .btn-cat.activo{background:var(--tinta);color:var(--tierra-1);}\n\n  .modal-overlay{position:fixed;inset:0;background:rgba(10,10,12,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}\n  .modal-card{background:var(--tierra-1);max-width:560px;width:100%;max-height:82vh;overflow-y:auto;padding:20px 22px;border:1px solid var(--panel-borde);color:var(--tinta);}\n  .modal-card pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:#fff;border:1px solid var(--panel-borde);padding:12px;max-height:50vh;overflow-y:auto;}\n\n  .fila-medidas{display:flex;gap:8px;margin-bottom:8px;}\n  .fila-medidas div{flex:1;}\n  .fila-medidas label{font-size:10.5px;color:var(--linea);display:block;margin-bottom:3px;}\n  .fila-medidas input{width:100%;padding:7px;font-family:var(--mono);font-size:13px;border:1px solid var(--panel-borde);background:#fff;}\n\n  #panel input[type=range],#panel input[type=number]{width:100%;margin:4px 0 10px;}\n  #panel input[type=number]{padding:6px;font-family:var(--mono);border:1px solid var(--panel-borde);background:#fff;}\n  .etiqueta-rango{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--linea);}\n\n  #instrucciones-fijas{font-size:12px;line-height:1.5;color:var(--linea);background:var(--tierra-2);border:1px solid var(--panel-borde);padding:10px 12px;margin-bottom:16px;}\n  #instrucciones-fijas b{color:var(--tinta);}\n  .nota-mini{font-size:11.5px;color:var(--linea);margin:8px 0;}\n  .aviso{font-size:12px;color:#fff;background:var(--rojo-aviso);padding:8px 10px;margin:8px 0;display:none;}\n\n  #footer-panel{padding:12px 20px;border-top:1px solid var(--panel-borde);font-size:10.5px;color:var(--linea);font-family:var(--mono);}\n\n  #leyenda{position:absolute;bottom:18px;left:18px;display:flex;align-items:center;gap:8px;background:var(--hud-fondo);padding:8px 12px;color:var(--tierra-1);font-size:11px;font-family:var(--mono);pointer-events:none;}\n  #barra-cota{width:130px;height:10px;background:linear-gradient(90deg,#24391a,#4b6b2c,#8a7a2e,#6b4423,#cbb98a);}\n\n  @media (max-width:760px){\n    #app{flex-direction:column;}\n    #panel{width:100%;min-width:0;max-height:50vh;order:2;border-left:none;border-top:1px solid var(--panel-borde);}\n    #canvas-wrap{order:1;height:50vh;}\n    #columna-izquierda{top:56px;left:8px;width:150px;}\n    .btn-modo{font-size:11px;padding:7px 8px;}\n    #banner-instrucciones{font-size:10.5px;padding:8px 9px;}\n    #leyenda{display:none;}\n  }\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n  <div id=\"canvas-wrap\">\n    <canvas id=\"c\" class=\"modo-orbitar\"><\/canvas>\n    <div id=\"hud-top\">\n      <div id=\"titulo\">\n        <h1 id=\"titulo-nivel\">SIMULADOR TOPOGR\u00c1FICO \u2014 NIVEL 1<\/h1>\n        <p id=\"subtitulo-nivel\">Terreno \"El Bajo\" \u00b7 relevamiento de campo<\/p>\n      <\/div>\n      <div id=\"badge-nivel\">N.1<\/div>\n    <\/div>\n    <div id=\"columna-izquierda\">\n      <div id=\"barra-modos\">\n        <button class=\"btn-modo activo\" data-modo=\"orbitar\">\ud83e\udded Orbitar<\/button>\n        <button class=\"btn-modo\" data-modo=\"levantar\">\ud83d\udccd Levantar<\/button>\n        <button class=\"btn-modo\" data-modo=\"obstaculos\">\ud83c\udf32 Quitar obst\u00e1culos<\/button>\n        <button class=\"btn-modo\" data-modo=\"lote\">\ud83d\udcd0 Ubicar lote<\/button>\n        <button class=\"btn-modo\" data-modo=\"nivelar\">\u26cf\ufe0f Nivelar terreno<\/button>\n        <button class=\"btn-modo\" data-modo=\"calle\" id=\"btn-modo-calle\" style=\"display:none\">\ud83d\udee3\ufe0f Trazar calle<\/button>\n      <\/div>\n      <div id=\"banner-instrucciones\">Arrastr\u00e1 para rotar la vista \u00b7 rueda para acercar/alejar.<\/div>\n      <div id=\"barra-progreso-wrap\" style=\"display:none\">\n        <div class=\"etiqueta-rango\" style=\"color:var(--tierra-1);opacity:.85\"><span>Nivelaci\u00f3n de lotes<\/span><span id=\"txt-progreso-nivel\">0%<\/span><\/div>\n        <div id=\"barra-progreso-fondo\"><div id=\"barra-progreso-relleno\"><\/div><\/div>\n      <\/div>\n    <\/div>\n    <div id=\"leyenda\"><span>cota baja<\/span><div id=\"barra-cota\"><\/div><span>cota alta<\/span><\/div>\n  <\/div>\n\n  <div id=\"panel\">\n    <div id=\"panel-scroll\">\n      <h2>Libreta de c\u00e1lculo<\/h2>\n      <p class=\"sub\">poligonal levantada por v\u00e9rtices<\/p>\n\n      <div id=\"instrucciones-fijas\">\n        <b>Consigna:<\/b> despej\u00e1 los obst\u00e1culos que estorben, ubic\u00e1 el/los lote(s) en la mejor parte del terreno, med\u00ed cada lado a mano y nivel\u00e1 moviendo el m\u00ednimo volumen de tierra posible.\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>1 \u00b7 V\u00c9RTICES<\/h3>\n        <ol id=\"lista-puntos\"><li style=\"color:#a99a6f\">\u2014 sin estacas clavadas \u2014<\/li><\/ol>\n        <div class=\"dato\" id=\"fila-area-parcial\" style=\"display:none\"><span>\u00c1rea parcial (aprox.)<\/span><span id=\"d-area-parcial\">\u2014<\/span><\/div>\n        <button class=\"btn\" id=\"btn-deshacer\" disabled>Deshacer \u00faltima estaca<\/button>\n        <button class=\"btn\" id=\"btn-cerrar\" disabled>Cerrar poligonal<\/button>\n        <button class=\"btn\" id=\"btn-reiniciar\">Reiniciar levantamiento actual<\/button>\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>LOTE A UBICAR <span id=\"d-lote-contador\" style=\"font-family:var(--mono);color:var(--linea)\">0/1<\/span><\/h3>\n        <div id=\"lista-lotes-guardados\"><\/div>\n        <div class=\"fila-categoria\" id=\"fila-modo-lote\" style=\"display:none\">\n          <button class=\"btn-cat activo\" data-modolote=\"medidas\">\ud83d\udccf Medidas fijas<\/button>\n          <button class=\"btn-cat\" data-modolote=\"area\">\ud83c\udfaf \u00c1rea objetivo<\/button>\n        <\/div>\n        <div id=\"lote-medidas-fijas\">\n          <div class=\"fila-medidas\">\n            <div><label>Ancho (m)<\/label><input type=\"number\" id=\"input-ancho-lote\" value=\"10\" min=\"1\"><\/div>\n            <div><label>Largo (m)<\/label><input type=\"number\" id=\"input-largo-lote\" value=\"30\" min=\"1\"><\/div>\n          <\/div>\n          <button class=\"btn principal\" id=\"btn-crear-lote\">Crear lote<\/button>\n          <p class=\"nota-mini\">Cambi\u00e1 a modo \"\ud83d\udcd0 Ubicar lote\" arriba y arrastr\u00e1 el rect\u00e1ngulo naranja hasta la mejor posici\u00f3n.<\/p>\n          <button class=\"btn\" id=\"btn-fijar-lote\" disabled>Fijar posici\u00f3n y levantar poligonal<\/button>\n          <button class=\"btn\" id=\"btn-quitar-lote\" disabled>Quitar lote<\/button>\n        <\/div>\n        <div id=\"lote-area-objetivo\" style=\"display:none\">\n          <label style=\"font-size:10.5px;color:var(--linea);display:block;margin-bottom:4px\">\u00c1rea objetivo (m\u00b2)<\/label>\n          <input type=\"number\" id=\"input-area-objetivo\" value=\"250\" min=\"1\">\n          <p class=\"nota-mini\">No hay rect\u00e1ngulo prearmado: cambi\u00e1 a modo \"\ud83d\udccd Levantar\" y clav\u00e1 vos las estacas hasta formar un pol\u00edgono cuya \u00e1rea quede dentro del \u00b18% del objetivo.<\/p>\n          <button class=\"btn principal\" id=\"btn-empezar-area\">Fijar objetivo y empezar a levantar<\/button>\n        <\/div>\n        <div class=\"aviso\" id=\"aviso-lote\"><\/div>\n      <\/div>\n\n      <div class=\"seccion\" id=\"seccion-calle\" style=\"display:none\">\n        <h3>CALLE DE ACCESO<\/h3>\n        <p class=\"nota-mini\">Traz\u00e1 el recorrido con clics sobre el terreno, uniendo los lotes. Pendiente m\u00e1xima admitida: <b id=\"d-pendiente-max-calle\">10%<\/b> por tramo.<\/p>\n        <ol id=\"lista-calle\"><li style=\"color:#a99a6f\">\u2014 sin puntos trazados \u2014<\/li><\/ol>\n        <button class=\"btn\" id=\"btn-deshacer-calle\" disabled>Deshacer \u00faltimo punto<\/button>\n        <button class=\"btn\" id=\"btn-reiniciar-calle\">Reiniciar calle<\/button>\n        <div class=\"dato\"><span>Tramos dentro de norma<\/span><span id=\"d-calle-estado\">0/0<\/span><\/div>\n      <\/div>\n\n      <div class=\"seccion\" id=\"seccion-lados\" style=\"display:none\">\n        <h3>2 \u00b7 MEDIR LADOS (en el terreno)<\/h3>\n        <ol id=\"lista-lados\"><\/ol>\n        <div class=\"dato\"><span>Per\u00edmetro<\/span><span id=\"d-perim\">0/0 lados medidos<\/span><\/div>\n      <\/div>\n\n      <div class=\"seccion\" id=\"seccion-area\" style=\"display:none\">\n        <h3>3 \u00b7 \u00c1REA Y PENDIENTES<\/h3>\n        <button class=\"btn principal\" id=\"btn-calc-area\" disabled>Calcular \u00e1rea (f\u00f3rmula de Gauss)<\/button>\n        <div class=\"dato\"><span>\u00c1rea encerrada<\/span><span id=\"d-area\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Cota m\u00ednima<\/span><span id=\"d-cotamin\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Cota m\u00e1xima<\/span><span id=\"d-cotamax\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Desnivel total<\/span><span id=\"d-desnivel\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Pendiente media<\/span><span id=\"d-pend\">\u2014<\/span><\/div>\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>OBST\u00c1CULOS <span id=\"d-obst-contador\" style=\"font-family:var(--mono);color:var(--linea)\">\u2014<\/span><\/h3>\n        <p class=\"nota-mini\">En modo \"Quitar obst\u00e1culos\", arrastr\u00e1 un \u00e1rbol o roca fuera del l\u00edmite del terreno para retirarlo.<\/p>\n        <button class=\"btn\" id=\"btn-restaurar-obst\">Restaurar obst\u00e1culos originales<\/button>\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>MOVIMIENTO DE SUELO<\/h3>\n        <div id=\"controles-pasos\">\n          <div class=\"fila-categoria\" id=\"fila-categoria\">\n            <button class=\"btn-cat activo\" data-cat=\"gruesa\">\u26cf\ufe0f Pala gruesa<\/button>\n            <button class=\"btn-cat\" data-cat=\"fina\">\ud83e\ude9b Afinadora fina<\/button>\n          <\/div>\n          <p class=\"nota-mini\" id=\"nota-categoria\">La pala gruesa mueve mucho por pasada pero es <b>imprecisa<\/b> (\u00b115%) \u2014 ideal para el desbaste grueso. Pas\u00e1 a la afinadora para el ajuste fino y exacto.<\/p>\n          <label style=\"font-size:10.5px;color:var(--linea);display:block;margin-bottom:4px\">Profundidad / altura por pasada<\/label>\n          <div class=\"fila-pasos\" id=\"fila-pasos\"><\/div>\n          <label style=\"font-size:10.5px;color:var(--linea);display:block;margin:10px 0 4px\">Herramienta<\/label>\n          <div class=\"fila-herramientas\">\n            <button class=\"btn-herr\" data-herr=\"cavar\">\u26cf\ufe0f Cavar<\/button>\n            <button class=\"btn-herr\" data-herr=\"rellenar\">\ud83e\uddf1 Rellenar<\/button>\n          <\/div>\n        <\/div>\n        <p class=\"nota-mini\" id=\"nota-nivel1-simple\" style=\"display:none\">En este nivel trabaj\u00e1s solo con \"Aplanar\" \u2014 es la forma m\u00e1s f\u00e1cil de emparejar sin cavar pozos ni apilar de m\u00e1s. Las herramientas de cavar/rellenar por pasos se habilitan desde el Nivel 2.<\/p>\n        <button class=\"btn activo\" id=\"btn-herr-aplanar\">\ud83e\ude9a Aplanar hacia cota objetivo (terminado fino)<\/button>\n        <p class=\"nota-mini\">El aplanado se usa manteniendo presionado y arrastrando: empareja suave hacia la cota objetivo, ideal para el acabado final.<\/p>\n        <div class=\"etiqueta-rango\" style=\"margin-top:8px\"><span>Radio de pincel<\/span><span id=\"d-radio\">7 m<\/span><\/div>\n        <input type=\"range\" id=\"rango-pincel\" min=\"3\" max=\"16\" value=\"7\">\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>NIVELACI\u00d3N (cota objetivo)<\/h3>\n        <button class=\"btn\" id=\"btn-toggle-curvas\">Ocultar curvas de nivel<\/button>\n        <p class=\"nota-mini\"><b>Cada lote tiene su propia cota objetivo.<\/b> Eleg\u00ed a cu\u00e1l le est\u00e1s editando la cota antes de tocar los botones de abajo:<\/p>\n        <div class=\"fila-categoria\" id=\"selector-lotes\"><\/div>\n        <label style=\"font-size:10.5px;color:var(--linea);display:block;margin:8px 0 3px\">Cota objetivo del lote seleccionado (m) \u2014 la curva naranja marca ese nivel<\/label>\n        <input type=\"number\" id=\"input-cota-objetivo\" value=\"0\" step=\"0.1\">\n        <div style=\"display:flex;gap:6px;margin:0 0 8px\">\n          <button class=\"btn\" id=\"btn-bajar-curva\" style=\"margin-top:0\">\u25bc Bajar 1 curva<\/button>\n          <button class=\"btn\" id=\"btn-subir-curva\" style=\"margin-top:0\">\u25b2 Subir 1 curva<\/button>\n        <\/div>\n        <button class=\"btn\" id=\"btn-usar-cota-proyecto\">Usar cota de proyecto calculada<\/button>\n        <div class=\"dato\"><span>Tierra cortada (acum.)<\/span><span id=\"d-acorte\">0.0 m\u00b3<\/span><\/div>\n        <div class=\"dato\"><span>Tierra rellenada (acum.)<\/span><span id=\"d-arelleno\">0.0 m\u00b3<\/span><\/div>\n        <button class=\"btn\" id=\"btn-calc-objetivo\" disabled>Calcular corte/relleno objetivo<\/button>\n        <div class=\"dato\"><span>Cota de proyecto<\/span><span id=\"d-cotaproy\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Corte requerido<\/span><span id=\"d-corte\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Relleno requerido<\/span><span id=\"d-relleno\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Balance de tierra<\/span><span id=\"d-balance\">\u2014<\/span><\/div>\n        <button class=\"btn\" id=\"btn-reset-terreno\">Reiniciar terreno (deshacer nivelaci\u00f3n)<\/button>\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>PROGRESO DEL NIVEL<\/h3>\n        <div class=\"aviso\" id=\"aviso-restriccion\"><\/div>\n        <div class=\"dato\"><span>Obst\u00e1culos en los lotes<\/span><span id=\"chk-obst\">\u2014<\/span><\/div>\n        <div class=\"dato\" id=\"fila-compensacion\" style=\"display:none\"><span>Suelo compensado (corte\u2248relleno)<\/span><span id=\"chk-comp\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Lotes ubicados<\/span><span id=\"chk-lotes\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Lotes nivelados<\/span><span id=\"chk-nivel\">\u2014<\/span><\/div>\n        <button class=\"btn principal\" id=\"btn-verificar\">Verificar progreso del nivel<\/button>\n        <p class=\"nota-mini\" id=\"msg-nivel\" style=\"font-weight:700\"><\/p>\n        <button class=\"btn exito\" id=\"btn-siguiente-nivel\" style=\"display:none\">Ir al Nivel 2 \u2192<\/button>\n        <button class=\"btn\" id=\"btn-ver-informe\">\ud83d\udccb Ver informe final<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"footer-panel\">coordenadas locales (x,z) en metros \u00b7 cota \"y\" en metros<\/div>\n  <\/div>\n\n  <div id=\"modal-informe\" class=\"modal-overlay\" style=\"display:none\">\n    <div class=\"modal-card\">\n      <h3 style=\"margin-top:0\">Informe de levantamiento<\/h3>\n      <pre id=\"texto-informe\"><\/pre>\n      <div style=\"display:flex;gap:8px;margin-top:10px\">\n        <button class=\"btn\" id=\"btn-cerrar-informe\">Cerrar<\/button>\n        <button class=\"btn principal\" id=\"btn-descargar-informe\">Descargar (.txt)<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n/* ===================== ESCENA BASE (fondo neutro oscuro) ===================== */\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio,2));\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(0x14161b);\nscene.fog = new THREE.Fog(0x14161b, 100, 270);\nconst camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);\n\nscene.add(new THREE.HemisphereLight(0xdfe6ef, 0x101216, 0.7));\nconst sol = new THREE.DirectionalLight(0xfff2d9, 1.2);\nsol.position.set(60,90,40);\nscene.add(sol);\n\n/* ===================== GRILLA DE TERRENO (topolog\u00eda fija, altura variable por nivel) ===================== */\nconst SIZE = 90, RES = 70;\nconst cellSize = SIZE/RES;\nconst areaCelda = cellSize*cellSize;\n\nconst geo = new THREE.PlaneGeometry(SIZE, SIZE, RES, RES);\ngeo.rotateX(-Math.PI/2);\nconst pos = geo.attributes.position;\n\nfunction alturaNivel1(x,z){\n  const bultos = [\n    {x:-18, z:-10, h: 6.5, r:14},\n    {x: 14, z: 16, h: 5.0, r:11},\n    {x:  0, z: -26,h:-4.2, r:10},\n    {x: 24, z: -14,h: 3.0, r:6},\n  ];\n  let h = Math.sin(x*0.045)*1.4 + Math.cos(z*0.05)*1.1 + Math.sin((x+z)*0.03)*0.8;\n  for(const b of bultos) h += b.h * Math.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  return h;\n}\nfunction alturaNivel2(x,z){\n  const bultos = [\n    {x:-22, z:-14, h: 8.0, r:12},\n    {x: 20, z: 12, h: 6.5, r:10},\n    {x: -6, z: 18, h: 5.0, r:9},\n    {x:  8, z:-22, h:-5.5, r:11},\n    {x: 26, z: -6, h: 4.0, r:7},\n  ];\n  let h = Math.sin(x*0.06)*2.2 + Math.cos(z*0.07)*1.8 + Math.sin((x+z)*0.04)*1.3;\n  for(const b of bultos) h += b.h * Math.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  return h;\n}\n\nfunction alturaNivel3(x,z){\n  const bultos = [\n    {x:-26, z:-18, h: 9.0, r:12},\n    {x:-20, z: 16, h: 7.0, r:10},\n    {x: 24, z: 14, h: 8.0, r:11},\n    {x: 28, z:-16, h: 6.0, r:9},\n    {x: 16, z: -2, h: 4.5, r:8},\n  ];\n  let h = Math.sin(x*0.07)*2.4 + Math.cos(z*0.08)*2.0 + Math.sin((x+z)*0.05)*1.5;\n  for(const b of bultos) h += b.h * Math.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  // vaguada del arroyo: depresi\u00f3n longitudinal en la franja central\n  h -= 5.5 * Math.exp(-(x*x)/(2*7*7));\n  return h;\n}\n\nconst idxGrid = [];\nfor(let gz=0; gz<=RES; gz++) idxGrid.push(new Int32Array(RES+1));\nfunction coordAGrilla(x,z){\n  let gx = Math.round((x+SIZE/2)/cellSize);\n  let gz = Math.round((z+SIZE/2)/cellSize);\n  gx = Math.min(RES, Math.max(0,gx));\n  gz = Math.min(RES, Math.max(0,gz));\n  return [gx,gz];\n}\n\nconst heights = new Float32Array(pos.count);\nfor(let i=0;i<pos.count;i++){\n  const x = pos.getX(i), z = pos.getZ(i);\n  heights[i] = alturaNivel1(x,z);\n  pos.setY(i, heights[i]);\n  const [gx,gz] = coordAGrilla(x,z);\n  idxGrid[gz][gx] = i;\n}\nconst heightsIniciales = heights.slice();\ngeo.computeVertexNormals();\n\nfunction alturaActual(x,z){\n  const [gx,gz] = coordAGrilla(x,z);\n  return heights[idxGrid[gz][gx]];\n}\nfunction rangoAlturaActual(){\n  let mn=Infinity,mx=-Infinity;\n  for(let i=0;i<heights.length;i++){ if(heights[i]<mn)mn=heights[i]; if(heights[i]>mx)mx=heights[i]; }\n  return [mn,mx];\n}\n\nlet hMin=0, hMax=1;\nconst rampa = [\n  {t:0.00, c:new THREE.Color(0x24391a)},\n  {t:0.32, c:new THREE.Color(0x4b6b2c)},\n  {t:0.58, c:new THREE.Color(0x8a7a2e)},\n  {t:0.80, c:new THREE.Color(0x6b4423)},\n  {t:1.00, c:new THREE.Color(0xcbb98a)},\n];\nfunction colorPorCota(h){\n  const t = Math.min(1,Math.max(0,(h-hMin)/(hMax-hMin)));\n  for(let i=0;i<rampa.length-1;i++){\n    if(t>=rampa[i].t && t<=rampa[i+1].t){\n      const local = (t-rampa[i].t)/(rampa[i+1].t-rampa[i].t || 1);\n      return rampa[i].c.clone().lerp(rampa[i+1].c, local);\n    }\n  }\n  return rampa[rampa.length-1].c;\n}\nconst colores = new Float32Array(pos.count*3);\ngeo.setAttribute('color', new THREE.BufferAttribute(colores,3));\n\nconst mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.95, metalness:0, flatShading:true});\nconst terreno = new THREE.Mesh(geo, mat);\nscene.add(terreno);\n\n/* ---- curvas de nivel (marching squares sobre grilla m\u00e1s gruesa) ---- */\nconst RES_C = 36;\nconst cellC = SIZE/RES_C;\nconst intervaloCurvas = 1.5;\nconst curvasGrupo = new THREE.Group(); scene.add(curvasGrupo);\nconst curvaObjetivoGrupo = new THREE.Group(); scene.add(curvaObjetivoGrupo);\nlet muestraActual = null;\nlet curvasVisibles = true;\nlet cotaObjetivo = 0;\n\nfunction calcularMuestra(){\n  const m=[];\n  for(let gz=0; gz<=RES_C; gz++){\n    const fila=[];\n    for(let gx=0; gx<=RES_C; gx++) fila.push(alturaActual(-SIZE/2+cellC*gx, -SIZE/2+cellC*gz));\n    m.push(fila);\n  }\n  return m;\n}\nfunction segmentosParaNivel(nivel, muestra){\n  const posiciones=[];\n  for(let gz=0; gz<RES_C; gz++){\n    for(let gx=0; gx<RES_C; gx++){\n      const x0=-SIZE/2+cellC*gx, x1=x0+cellC, z0=-SIZE/2+cellC*gz, z1=z0+cellC;\n      const h00=muestra[gz][gx], h10=muestra[gz][gx+1], h01=muestra[gz+1][gx], h11=muestra[gz+1][gx+1];\n      const pts=[];\n      const cruce=(ha,hb,pa,pb)=>{ if((ha<nivel)!==(hb<nivel)){ const t=(nivel-ha)/(hb-ha); pts.push([pa[0]+(pb[0]-pa[0])*t, pa[1]+(pb[1]-pa[1])*t]); } };\n      cruce(h00,h10,[x0,z0],[x1,z0]);\n      cruce(h10,h11,[x1,z0],[x1,z1]);\n      cruce(h11,h01,[x1,z1],[x0,z1]);\n      cruce(h01,h00,[x0,z1],[x0,z0]);\n      if(pts.length>=2) posiciones.push(pts[0][0], nivel+0.08, pts[0][1], pts[1][0], nivel+0.08, pts[1][1]);\n    }\n  }\n  return posiciones;\n}\nfunction generarCurvasNivel(){\n  muestraActual = calcularMuestra();\n  curvasGrupo.clear();\n  const [mn,mx] = rangoAlturaActual();\n  const nivelIni = Math.ceil(mn/intervaloCurvas)*intervaloCurvas;\n  let posiciones = [];\n  for(let nivel=nivelIni; nivel<mx; nivel+=intervaloCurvas) posiciones = posiciones.concat(segmentosParaNivel(nivel, muestraActual));\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(posiciones,3));\n  curvasGrupo.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0xe8e2cf, transparent:true, opacity:0.4})));\n  actualizarCurvaObjetivo();\n}\nfunction actualizarCurvaObjetivo(){\n  curvaObjetivoGrupo.clear();\n  if(!muestraActual) return;\n  const nivel = Math.round(cotaObjetivo/intervaloCurvas)*intervaloCurvas;\n  const posiciones = segmentosParaNivel(nivel, muestraActual);\n  if(posiciones.length){\n    const g = new THREE.BufferGeometry();\n    g.setAttribute('position', new THREE.Float32BufferAttribute(posiciones,3));\n    curvaObjetivoGrupo.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0xe8590c})));\n  }\n}\n\n// plano invisible auxiliar para arrastres\nconst planoArrastre = new THREE.Mesh(new THREE.PlaneGeometry(700,700), new THREE.MeshBasicMaterial({visible:false}));\nplanoArrastre.rotation.x = -Math.PI/2;\nscene.add(planoArrastre);\n\n/* ---- obst\u00e1culos interactivos (\u00e1rboles / rocas) ---- */\nconst obstaculosArbolesNivel1 = [\n  {tipo:'arbol', x:-20, z:-12},{tipo:'arbol', x:-16, z:-6},{tipo:'arbol', x:-24, z:-14},\n  {tipo:'arbol', x:12, z:18},{tipo:'arbol', x:16, z:14},{tipo:'arbol', x:10, z:22},\n  {tipo:'arbol', x:-8, z:20},{tipo:'arbol', x:26, z:-16},{tipo:'arbol', x:22, z:-10},\n  {tipo:'roca', x:24, z:-14, s:1.4},{tipo:'roca', x:26, z:-12, s:0.9},\n  {tipo:'roca', x:-2, z:-25, s:1.1},{tipo:'roca', x:2, z:-27, s:0.7},\n];\nconst obstaculosArbolesNivel2 = [\n  {tipo:'arbol', x:-22,z:-16},{tipo:'arbol', x:-18,z:-8},{tipo:'arbol', x:-26,z:-18},\n  {tipo:'arbol', x:-10,z:20},{tipo:'arbol', x:-4,z:16},{tipo:'arbol', x:2,z:22},\n  {tipo:'arbol', x:20,z:14},{tipo:'arbol', x:24,z:10},{tipo:'arbol', x:18,z:18},\n  {tipo:'arbol', x:10,z:-24},{tipo:'arbol', x:4,z:-20},\n  {tipo:'roca', x:26,z:-8,s:1.5},{tipo:'roca', x:24,z:-4,s:1.0},\n  {tipo:'roca', x:-8,z:-22,s:1.2},{tipo:'roca', x:-2,z:-24,s:0.8},\n  {tipo:'roca', x:14,z:22,s:1.0},\n];\nconst obstaculosArbolesNivel3 = [\n  {tipo:'arbol', x:-26,z:-20},{tipo:'arbol', x:-22,z:-14},{tipo:'arbol', x:-30,z:-16},\n  {tipo:'arbol', x:-22,z:14},{tipo:'arbol', x:-18,z:20},{tipo:'arbol', x:-26,z:18},\n  {tipo:'arbol', x:22,z:16},{tipo:'arbol', x:26,z:12},{tipo:'arbol', x:20,z:22},\n  {tipo:'arbol', x:28,z:-18},{tipo:'arbol', x:24,z:-12},{tipo:'arbol', x:32,z:-14},\n  {tipo:'arbol', x:16,z:0},{tipo:'arbol', x:20,z:-4},\n  {tipo:'roca', x:-24,z:-10,s:1.5},{tipo:'roca', x:-20,z:-6,s:1.0},\n  {tipo:'roca', x:26,z:4,s:1.3},{tipo:'roca', x:30,z:0,s:0.9},\n  {tipo:'roca', x:-16,z:24,s:1.1},{tipo:'roca', x:18,z:-24,s:1.2},\n];\n\nfunction alturaNivel4(x,z){\n  const bultos = [\n    {x:-24, z:-8,  h: 7.5, r:11},\n    {x: 18, z: 20, h: 6.0, r:10},\n    {x: -8, z: 24, h: 5.5, r:9},\n    {x: 22, z:-20, h:-5.0, r:10},\n    {x:-20, z: 22, h: 4.0, r:7},\n  ];\n  let h = Math.sin(x*0.065)*2.0 + Math.cos(z*0.075)*1.9 + Math.sin((x+z)*0.045)*1.4;\n  for(const b of bultos) h += b.h * Math.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  return h;\n}\nconst obstaculosArbolesNivel4 = [\n  {tipo:'arbol', x:-26,z:-10},{tipo:'arbol', x:-22,z:-4},{tipo:'arbol', x:-28,z:-12},\n  {tipo:'arbol', x:16,z:22},{tipo:'arbol', x:20,z:18},{tipo:'arbol', x:12,z:24},\n  {tipo:'arbol', x:-10,z:26},{tipo:'arbol', x:-6,z:22},\n  {tipo:'arbol', x:24,z:-18},{tipo:'arbol', x:20,z:-22},\n  {tipo:'arbol', x:-22,z:24},{tipo:'arbol', x:-18,z:20},\n  {tipo:'roca', x:-24,z:-6,s:1.3},{tipo:'roca', x:18,z:20,s:1.1},\n  {tipo:'roca', x:22,z:-20,s:1.4},{tipo:'roca', x:-20,z:22,s:1.0},\n];\n\nfunction alturaNivel5(x,z){\n  const bultos = [\n    {x:-28, z:-20, h: 10.0, r:12},\n    {x:-22, z: 18, h:  8.0, r:10},\n    {x: 26, z: 16, h:  9.0, r:11},\n    {x: 30, z:-18, h:  7.0, r:9},\n    {x: 18, z: -2, h:  5.0, r:8},\n    {x: -6, z:-30, h: -6.0, r:9},\n  ];\n  let h = Math.sin(x*0.08)*2.6 + Math.cos(z*0.09)*2.2 + Math.sin((x+z)*0.055)*1.6;\n  for(const b of bultos) h += b.h * Math.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  h -= 5.0 * Math.exp(-(x*x)/(2*6*6)); // vaguada de arroyo, como en el nivel 3\n  return h;\n}\nconst obstaculosArbolesNivel5 = [\n  {tipo:'arbol', x:-30,z:-22},{tipo:'arbol', x:-26,z:-16},{tipo:'arbol', x:-32,z:-18},{tipo:'arbol', x:-28,z:-24},\n  {tipo:'arbol', x:-24,z:16},{tipo:'arbol', x:-20,z:22},{tipo:'arbol', x:-26,z:20},\n  {tipo:'arbol', x:24,z:14},{tipo:'arbol', x:28,z:10},{tipo:'arbol', x:22,z:20},{tipo:'arbol', x:30,z:14},\n  {tipo:'arbol', x:32,z:-16},{tipo:'arbol', x:28,z:-20},{tipo:'arbol', x:34,z:-14},\n  {tipo:'arbol', x:16,z:-4},{tipo:'arbol', x:20,z:0},\n  {tipo:'roca', x:-26,z:-14,s:1.6},{tipo:'roca', x:-22,z:-10,s:1.1},\n  {tipo:'roca', x:28,z:6,s:1.4},{tipo:'roca', x:32,z:2,s:1.0},\n];\nlet obstaculosDefIniciales = obstaculosArbolesNivel1;\nlet obstaculosObjetos = [];\nfunction crearArbol(){\n  const g = new THREE.Group();\n  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.32,2.4,6), new THREE.MeshStandardMaterial({color:0x5a4128}));\n  tronco.position.y = 1.2;\n  const copa = new THREE.Mesh(new THREE.ConeGeometry(1.6,3.2,7), new THREE.MeshStandardMaterial({color:0x3f6b2e}));\n  copa.position.y = 3.6;\n  g.add(tronco,copa); g.userData.tipo='arbol'; return g;\n}\nfunction crearRoca(s){\n  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s,0), new THREE.MeshStandardMaterial({color:0x7d7466, flatShading:true}));\n  m.position.y = s*0.5; m.rotation.set(Math.random(),Math.random(),Math.random());\n  const g = new THREE.Group(); g.add(m); g.userData.tipo='roca'; return g;\n}\nfunction generarObstaculos(){\n  obstaculosObjetos.forEach(g=>scene.remove(g));\n  obstaculosObjetos = [];\n  obstaculosDefIniciales.forEach(def=>{\n    const g = def.tipo==='arbol' ? crearArbol() : crearRoca(def.s);\n    g.position.set(def.x, alturaActual(def.x,def.z), def.z);\n    scene.add(g); obstaculosObjetos.push(g);\n  });\n  actualizarPanelObstaculos();\n}\n\nconst estanque = new THREE.Mesh(new THREE.CircleGeometry(7,32), new THREE.MeshStandardMaterial({color:0x2e5570, transparent:true, opacity:0.85, roughness:0.15}));\nestanque.rotation.x = -Math.PI/2;\nscene.add(estanque);\n\n/* ===================== NIVELES ===================== */\nconst NIVELES = {\n  1: { nombre:'Terreno \"El Bajo\" \u2014 parcela \u00fanica', lotesRequeridos:1, obstaculosDef:obstaculosArbolesNivel1, terrenoFn:alturaNivel1, restriccion:null, compensar:false, soloAplanar:true, modoLoteForzado:'medidas', calleRequerida:false },\n  2: { nombre:'Terreno \"Las Lomas\" \u2014 subdivisi\u00f3n en 2 lotes', lotesRequeridos:2, obstaculosDef:obstaculosArbolesNivel2, terrenoFn:alturaNivel2, restriccion:null, compensar:false, soloAplanar:false, modoLoteForzado:'medidas', calleRequerida:false },\n  3: { nombre:'Terreno \"El Arroyo\" \u2014 3 lotes, servidumbre y suelo compensado', lotesRequeridos:3, obstaculosDef:obstaculosArbolesNivel3, terrenoFn:alturaNivel3,\n       restriccion:{minX:-8, maxX:8, minZ:-45, maxZ:45, etiqueta:'Servidumbre de arroyo \u2014 prohibido ocupar y mover suelo'},\n       compensar:true, soloAplanar:false, modoLoteForzado:'medidas', calleRequerida:false },\n  4: { nombre:'Terreno \"Los Aromos\" \u2014 loteo por superficie', lotesRequeridos:2, obstaculosDef:obstaculosArbolesNivel4, terrenoFn:alturaNivel4,\n       restriccion:null, compensar:false, soloAplanar:false, modoLoteForzado:'area', calleRequerida:true },\n};\nconst toleranciaCompensacion = 0.12; // 12% de desbalance admitido entre corte y relleno\nlet nivelActual = 1;\nlet lotesFijados = [];\nconst toleranciaNivel = 0.35; // metros de desviaci\u00f3n m\u00e1xima admitida para considerar \"nivelado\"\n\nconst restriccionGrupo = new THREE.Group(); scene.add(restriccionGrupo);\nfunction dibujarRestriccion(r){\n  restriccionGrupo.clear();\n  if(!r) return;\n  const paso = 2.5;\n  const puntosFranja = [];\n  for(let z=r.minZ; z<=r.maxZ; z+=paso){\n    for(const x of [r.minX, r.maxX]){\n      const xa = Math.max(-SIZE/2, Math.min(SIZE/2, x));\n      const za = Math.max(-SIZE/2, Math.min(SIZE/2, z));\n      puntosFranja.push(new THREE.Vector3(xa, alturaActual(xa,za)+0.3, za));\n    }\n  }\n  // dos l\u00edneas rojas de borde\n  for(const x of [r.minX, r.maxX]){\n    const pts=[];\n    for(let z=Math.max(-SIZE/2,r.minZ); z<=Math.min(SIZE/2,r.maxZ); z+=paso){\n      pts.push(new THREE.Vector3(x, alturaActual(x,z)+0.3, z));\n    }\n    if(pts.length>1){\n      const g = new THREE.BufferGeometry().setFromPoints(pts);\n      restriccionGrupo.add(new THREE.Line(g, new THREE.LineBasicMaterial({color:0xff4b3a})));\n    }\n  }\n  // relleno transl\u00facido rojo\n  const ancho = r.maxX-r.minX;\n  const largo = Math.min(SIZE, r.maxZ-r.minZ);\n  const planoR = new THREE.Mesh(\n    new THREE.PlaneGeometry(ancho, largo),\n    new THREE.MeshBasicMaterial({color:0xff4b3a, transparent:true, opacity:0.18, side:THREE.DoubleSide, depthWrite:false})\n  );\n  planoR.rotation.x = -Math.PI/2;\n  const cx=(r.minX+r.maxX)/2, cz=Math.max(-SIZE/2,Math.min(SIZE/2,(r.minZ+r.maxZ)/2));\n  planoR.position.set(cx, alturaActual(cx,cz)+0.2, cz);\n  restriccionGrupo.add(planoR);\n}\nfunction dentroRestriccion(x,z){\n  const r = NIVELES[nivelActual].restriccion;\n  if(!r) return false;\n  return x>=r.minX && x<=r.maxX && z>=r.minZ && z<=r.maxZ;\n}\nfunction bboxTocaRestriccion(bbox){\n  const r = NIVELES[nivelActual].restriccion;\n  if(!r) return false;\n  return bbox.minX < r.maxX && bbox.maxX > r.minX && bbox.minZ < r.maxZ && bbox.maxZ > r.minZ;\n}\n\nfunction cargarNivel(n){\n  nivelActual = n;\n  const cfg = NIVELES[n];\n  for(let i=0;i<pos.count;i++){\n    const x=pos.getX(i), z=pos.getZ(i);\n    const h = cfg.terrenoFn(x,z);\n    heights[i]=h; pos.setY(i,h);\n  }\n  heightsIniciales.set(heights);\n  let mn=Infinity, mx=-Infinity;\n  for(let i=0;i<heights.length;i++){ if(heights[i]<mn)mn=heights[i]; if(heights[i]>mx)mx=heights[i]; }\n  hMin = mn-6; hMax = mx+6;\n  for(let i=0;i<pos.count;i++){\n    const c = colorPorCota(heights[i]);\n    colores[i*3]=c.r; colores[i*3+1]=c.g; colores[i*3+2]=c.b;\n  }\n  pos.needsUpdate=true; geo.attributes.color.needsUpdate=true;\n  geo.computeVertexNormals(); geo.computeBoundingSphere();\n\n  obstaculosDefIniciales = cfg.obstaculosDef;\n  generarObstaculos();\n  estanque.position.set(0, alturaActual(0,-26)+0.05, -26);\n\n  lotesFijados.forEach(l=>scene.remove(l.grupoVisual));\n  lotesFijados = [];\n  loteSeleccionadoIdx = -1;\n  document.getElementById('lista-lotes-guardados').innerHTML = '';\n  document.getElementById('selector-lotes').innerHTML = '';\n  reiniciarLevantamiento();\n  if(loteMesh){ scene.remove(loteMesh); scene.remove(loteBorde); loteMesh=null; loteBorde=null; }\n  document.getElementById('btn-fijar-lote').disabled=true;\n  document.getElementById('btn-quitar-lote').disabled=true;\n\n  acumCorte=0; acumRelleno=0;\n  document.getElementById('d-acorte').textContent='0.0 m\u00b3';\n  document.getElementById('d-arelleno').textContent='0.0 m\u00b3';\n  cotaObjetivo = 0;\n  document.getElementById('input-cota-objetivo').value = '0';\n\n  document.getElementById('controles-pasos').style.display = cfg.soloAplanar ? 'none' : 'block';\n  document.getElementById('nota-nivel1-simple').style.display = cfg.soloAplanar ? 'block' : 'none';\n  herramienta = 'aplanar';\n  document.querySelectorAll('.btn-herr').forEach(x=>x.classList.remove('activo'));\n  document.getElementById('btn-herr-aplanar').classList.add('activo');\n  categoriaHerramienta = 'gruesa';\n  document.querySelectorAll('#fila-categoria .btn-cat').forEach(x=>x.classList.remove('activo'));\n  document.querySelector('#fila-categoria .btn-cat[data-cat=\"gruesa\"]').classList.add('activo');\n  renderPasos();\n  colorAnilloSegunHerramienta();\n  mapaCalorGrupo.clear();\n  document.getElementById('barra-progreso-wrap').style.display='none';\n\n  modoLote = cfg.modoLoteForzado;\n  areaObjetivoActiva = false;\n  document.getElementById('lote-medidas-fijas').style.display = modoLote==='medidas' ? 'block' : 'none';\n  document.getElementById('lote-area-objetivo').style.display = modoLote==='area' ? 'block' : 'none';\n\n  reiniciarCalle();\n  document.getElementById('btn-modo-calle').style.display = cfg.calleRequerida ? 'block' : 'none';\n  document.getElementById('seccion-calle').style.display = cfg.calleRequerida ? 'block' : 'none';\n\n  generarCurvasNivel();\n  dibujarRestriccion(cfg.restriccion);\n  actualizarContadorLotes();\n\n  const avisoR = document.getElementById('aviso-restriccion');\n  if(cfg.restriccion){\n    avisoR.textContent = '\u26a0 ' + cfg.restriccion.etiqueta;\n    avisoR.style.display='block';\n  } else {\n    avisoR.style.display='none';\n  }\n  document.getElementById('fila-compensacion').style.display = cfg.compensar ? 'flex' : 'none';\n\n  document.getElementById('titulo-nivel').textContent = `SIMULADOR TOPOGR\u00c1FICO \u2014 NIVEL ${n}`;\n  document.getElementById('subtitulo-nivel').textContent = cfg.nombre;\n  document.getElementById('badge-nivel').textContent = `N.${n}`;\n  try{parent.postMessage({tipo:'nivelActual',n},'*');}catch(e){}\n\n  document.getElementById('chk-obst').textContent = '\u2014';\n  document.getElementById('chk-lotes').textContent = `0/${cfg.lotesRequeridos}`;\n  document.getElementById('chk-nivel').textContent = '\u2014';\n  document.getElementById('msg-nivel').textContent = '';\n  document.getElementById('btn-siguiente-nivel').style.display = 'none';\n}\n\n/* ===================== LOTE ARRASTRABLE (dimensiones definidas por el usuario) ===================== */\nlet loteMesh=null, loteBorde=null, loteAncho=10, loteLargo=30, loteCentro={x:0,z:0};\nlet loteEnProgreso = false;\nlet modoLote = 'medidas';         // 'medidas' | 'area'\nlet areaObjetivoActiva = false;\nlet areaObjetivoValor = 250;\nconst toleranciaArea = 0.08;      // \u00b18% de tolerancia sobre el \u00e1rea pedida\n\ndocument.querySelectorAll('.btn-cat[data-modolote]').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    modoLote = b.dataset.modolote;\n    document.querySelectorAll('#fila-modo-lote .btn-cat').forEach(x=>x.classList.remove('activo'));\n    b.classList.add('activo');\n    document.getElementById('lote-medidas-fijas').style.display = modoLote==='medidas' ? 'block' : 'none';\n    document.getElementById('lote-area-objetivo').style.display = modoLote==='area' ? 'block' : 'none';\n  });\n});\ndocument.getElementById('btn-empezar-area').addEventListener('click', ()=>{\n  if(lotesFijados.length >= NIVELES[nivelActual].lotesRequeridos){\n    const aviso = document.getElementById('aviso-lote');\n    aviso.textContent = `Ya ubicaste los ${NIVELES[nivelActual].lotesRequeridos} lote(s) requeridos para este nivel.`;\n    aviso.style.display='block';\n    return;\n  }\n  areaObjetivoValor = Math.max(1, parseFloat(document.getElementById('input-area-objetivo').value)||250);\n  reiniciarLevantamiento();\n  areaObjetivoActiva = true;\n  loteEnProgreso = true;\n  document.getElementById('aviso-lote').style.display='none';\n  document.querySelector('.btn-modo[data-modo=\"levantar\"]').click();\n});\n\nfunction actualizarGeometriaLote(){\n  const hw=loteAncho/2, hl=loteLargo/2;\n  const esquinas = [\n    {x:loteCentro.x-hw, z:loteCentro.z-hl},\n    {x:loteCentro.x+hw, z:loteCentro.z-hl},\n    {x:loteCentro.x+hw, z:loteCentro.z+hl},\n    {x:loteCentro.x-hw, z:loteCentro.z+hl},\n  ];\n  const arrPos = loteMesh.geometry.attributes.position.array;\n  const arrBorde = loteBorde.geometry.attributes.position.array;\n  esquinas.forEach((p,i)=>{\n    const y = alturaActual(p.x,p.z)+0.15;\n    arrPos[i*3]=p.x; arrPos[i*3+1]=y; arrPos[i*3+2]=p.z;\n    arrBorde[i*3]=p.x; arrBorde[i*3+1]=y+0.03; arrBorde[i*3+2]=p.z;\n  });\n  loteMesh.geometry.attributes.position.needsUpdate=true;\n  loteMesh.geometry.computeBoundingSphere();\n  loteBorde.geometry.attributes.position.needsUpdate=true;\n  return esquinas;\n}\nfunction bboxDeLote(esquinas){\n  const xs=esquinas.map(p=>p.x), zs=esquinas.map(p=>p.z);\n  return {minX:Math.min(...xs), maxX:Math.max(...xs), minZ:Math.min(...zs), maxZ:Math.max(...zs)};\n}\nfunction seSuperponen(a,b){\n  return a.minX < b.maxX && a.maxX > b.minX && a.minZ < b.maxZ && a.maxZ > b.minZ;\n}\nlet loteSeleccionadoIdx = -1; // \u00edndice en lotesFijados cuya cota objetivo se est\u00e1 editando/visualizando\n\nfunction actualizarContadorLotes(){\n  document.getElementById('d-lote-contador').textContent = `${lotesFijados.length}/${NIVELES[nivelActual].lotesRequeridos}`;\n  renderListaLotesGuardados();\n  renderSelectorLotes();\n}\nfunction renderListaLotesGuardados(){\n  const cont = document.getElementById('lista-lotes-guardados');\n  if(lotesFijados.length===0){ cont.innerHTML=''; return; }\n  cont.innerHTML = lotesFijados.map((l,i)=>\n    `<div class=\"dato\"><span>Lote ${i+1} (${l.area.toFixed(0)} m\u00b2)<\/span><button class=\"btn-medir\" data-del=\"${i}\">\ud83d\uddd1\ufe0f Reiniciar este lote<\/button><\/div>`\n  ).join('');\n  cont.querySelectorAll('button[data-del]').forEach(b=>{\n    b.addEventListener('click', ()=> eliminarLote(parseInt(b.dataset.del)) );\n  });\n}\nfunction eliminarLote(idx){\n  const l = lotesFijados[idx];\n  if(!l) return;\n  scene.remove(l.grupoVisual);\n  lotesFijados.splice(idx,1);\n  if(loteSeleccionadoIdx===idx) loteSeleccionadoIdx=-1;\n  else if(loteSeleccionadoIdx>idx) loteSeleccionadoIdx--;\n  actualizarContadorLotes();\n  if(loteSeleccionadoIdx>=0 && lotesFijados[loteSeleccionadoIdx]){\n    cotaObjetivo = lotesFijados[loteSeleccionadoIdx].cotaObjetivo;\n    document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n    actualizarCurvaObjetivo();\n  }\n  refrescarAyudasNivelacion();\n}\nfunction renderSelectorLotes(){\n  const cont = document.getElementById('selector-lotes');\n  if(lotesFijados.length===0){ cont.innerHTML=''; return; }\n  cont.innerHTML = lotesFijados.map((l,i)=>\n    `<button class=\"btn-cat ${i===loteSeleccionadoIdx?'activo':''}\" data-loteidx=\"${i}\">Lote ${i+1}<\/button>`\n  ).join('');\n  cont.querySelectorAll('button').forEach(b=>{\n    b.addEventListener('click', ()=>{\n      loteSeleccionadoIdx = parseInt(b.dataset.loteidx);\n      cotaObjetivo = lotesFijados[loteSeleccionadoIdx].cotaObjetivo;\n      document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n      actualizarCurvaObjetivo();\n      renderSelectorLotes();\n      refrescarAyudasNivelacion();\n    });\n  });\n}\ndocument.getElementById('btn-crear-lote').addEventListener('click', ()=>{\n  if(lotesFijados.length >= NIVELES[nivelActual].lotesRequeridos){\n    const aviso = document.getElementById('aviso-lote');\n    aviso.textContent = `Ya ubicaste los ${NIVELES[nivelActual].lotesRequeridos} lote(s) requeridos para este nivel.`;\n    aviso.style.display='block';\n    return;\n  }\n  loteAncho = Math.max(1, parseFloat(document.getElementById('input-ancho-lote').value)||10);\n  loteLargo = Math.max(1, parseFloat(document.getElementById('input-largo-lote').value)||30);\n  loteCentro = {x:0,z:0};\n  if(loteMesh){ scene.remove(loteMesh); scene.remove(loteBorde); }\n  const gMesh = new THREE.BufferGeometry();\n  gMesh.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12),3));\n  gMesh.setIndex([0,1,2, 0,2,3]);\n  loteMesh = new THREE.Mesh(gMesh, new THREE.MeshBasicMaterial({color:0xe8590c, transparent:true, opacity:0.4, side:THREE.DoubleSide, depthWrite:false}));\n  const gBorde = new THREE.BufferGeometry();\n  gBorde.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12),3));\n  loteBorde = new THREE.LineLoop(gBorde, new THREE.LineBasicMaterial({color:0xe8590c}));\n  scene.add(loteMesh); scene.add(loteBorde);\n  actualizarGeometriaLote();\n  document.getElementById('btn-fijar-lote').disabled=false;\n  document.getElementById('btn-quitar-lote').disabled=false;\n  document.getElementById('aviso-lote').style.display='none';\n});\ndocument.getElementById('btn-quitar-lote').addEventListener('click', ()=>{\n  if(loteMesh){ scene.remove(loteMesh); scene.remove(loteBorde); loteMesh=null; loteBorde=null; }\n  document.getElementById('btn-fijar-lote').disabled=true;\n  document.getElementById('btn-quitar-lote').disabled=true;\n});\ndocument.getElementById('btn-fijar-lote').addEventListener('click', ()=>{\n  if(!loteMesh) return;\n  const esquinas = actualizarGeometriaLote();\n  const bboxNuevo = bboxDeLote(esquinas);\n  const aviso = document.getElementById('aviso-lote');\n  if(bboxTocaRestriccion(bboxNuevo)){\n    aviso.textContent = 'Ese lote invade la servidumbre (franja roja). No se puede ocupar esa zona.';\n    aviso.style.display='block';\n    return;\n  }\n  const choque = lotesFijados.find(l=>seSuperponen(l.bbox,bboxNuevo));\n  if(choque){\n    aviso.textContent = 'Ese lote se superpone con uno ya ubicado. Arrastralo a otra posici\u00f3n antes de fijarlo.';\n    aviso.style.display='block';\n    return;\n  }\n  aviso.style.display='none';\n  reiniciarLevantamiento();\n  esquinas.forEach(p=> agregarPunto({x:p.x, y:alturaActual(p.x,p.z), z:p.z}) );\n  cerrarPoligonal();\n  loteEnProgreso = true;\n  cotaObjetivo = esquinas.reduce((s,p)=> s + alturaActual(p.x,p.z), 0) / esquinas.length;\n  document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n  actualizarCurvaObjetivo();\n  scene.remove(loteMesh); scene.remove(loteBorde); loteMesh=null; loteBorde=null;\n  document.getElementById('btn-fijar-lote').disabled=true;\n  document.getElementById('btn-quitar-lote').disabled=true;\n  document.querySelector('.btn-modo[data-modo=\"levantar\"]').click();\n});\nfunction guardarLoteActual(){\n  const area = calcularAreaGauss(puntos);\n  const corners = puntos.map(p=>({x:p.x,y:p.y,z:p.z}));\n  const bbox = bboxDeLote(corners);\n  const aviso = document.getElementById('aviso-lote');\n  if(bboxTocaRestriccion(bbox)){\n    aviso.textContent = 'Esa parcela invade la servidumbre (franja roja). Reinici\u00e1 el levantamiento y ajust\u00e1 el pol\u00edgono.';\n    aviso.style.display='block';\n    return false;\n  }\n  const choque = lotesFijados.find(l=>seSuperponen(l.bbox,bbox));\n  if(choque){\n    aviso.textContent = 'Esa parcela se superpone con un lote ya ubicado. Reinici\u00e1 el levantamiento y ajust\u00e1 el pol\u00edgono.';\n    aviso.style.display='block';\n    return false;\n  }\n  aviso.style.display='none';\n  const grupoVisual = new THREE.Group();\n  const pts3 = corners.map(p=>new THREE.Vector3(p.x,p.y+0.22,p.z)); pts3.push(pts3[0].clone());\n  const gLinea = new THREE.BufferGeometry().setFromPoints(pts3);\n  grupoVisual.add(new THREE.Line(gLinea, new THREE.LineBasicMaterial({color:0x5c9e4a})));\n  corners.forEach(p=>{\n    const m = new THREE.Mesh(new THREE.SphereGeometry(0.4,10,10), new THREE.MeshStandardMaterial({color:0x5c9e4a}));\n    m.position.set(p.x,p.y+0.2,p.z);\n    grupoVisual.add(m);\n  });\n  scene.add(grupoVisual);\n  // cada lote guarda SU PROPIA cota objetivo (la que estaba activa al momento de guardarlo)\n  lotesFijados.push({corners, area, bbox, grupoVisual, nivelado:false, cotaObjetivo});\n  loteSeleccionadoIdx = lotesFijados.length-1;\n  actualizarContadorLotes();\n  areaObjetivoActiva = false;\n  reiniciarLevantamiento();\n  return true;\n}\n\n/* ===================== C\u00c1MARA ORBITAL ===================== */\nlet radio = 95, azimut = 0.9, polar = 1.0;\nconst objetivo = new THREE.Vector3(0,0,0);\nfunction actualizarCamara(){\n  camera.position.x = objetivo.x + radio*Math.sin(polar)*Math.sin(azimut);\n  camera.position.y = objetivo.y + radio*Math.cos(polar);\n  camera.position.z = objetivo.z + radio*Math.sin(polar)*Math.cos(azimut);\n  camera.lookAt(objetivo);\n}\nactualizarCamara();\ncanvas.addEventListener('wheel', e=>{\n  e.preventDefault();\n  radio = Math.min(180, Math.max(28, radio + e.deltaY*0.06));\n  actualizarCamara();\n},{passive:false});\n\n/* ===================== MODOS DE TRABAJO ===================== */\nlet modo = 'orbitar';\nconst textosModo = () => ({\n  orbitar: 'Arrastr\u00e1 para rotar la vista \u00b7 rueda para acercar/alejar.',\n  levantar: cerrado ? 'Poligonal cerrada. Med\u00ed cada lado en la libreta \u2192' : 'Clic sobre el terreno para clavar una estaca. Arrastr\u00e1 una estaca ya clavada para reubicarla.',\n  obstaculos: 'Arrastr\u00e1 un \u00e1rbol o roca fuera del l\u00edmite del terreno para retirarlo del levantamiento.',\n  lote: 'Arrastr\u00e1 el rect\u00e1ngulo naranja para elegir d\u00f3nde ubicar el lote. Cuando est\u00e9s conforme, fijalo desde el panel.',\n  nivelar: herramienta==='aplanar'\n    ? 'APLANAR: manten\u00e9 presionado y arrastr\u00e1 para emparejar hacia la cota objetivo.'\n    : `${herramienta==='cavar'?'CAVAR':'RELLENAR'} ${pasoMetros} m (${categoriaHerramienta==='gruesa'?'pala gruesa, imprecisa':'afinadora fina, exacta'}): un clic = una pasada.`,\n  calle: 'Clic sobre el terreno para agregar un punto de la calle. Verde = pendiente OK, rojo = supera el m\u00e1ximo permitido.'\n});\ndocument.querySelectorAll('.btn-modo').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    estado = null;\n    modo = b.dataset.modo;\n    document.querySelectorAll('.btn-modo').forEach(x=>x.classList.remove('activo'));\n    b.classList.add('activo');\n    canvas.className = 'modo-'+modo;\n    document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n    if(modo==='nivelar'){\n      document.getElementById('barra-progreso-wrap').style.display='block';\n      refrescarAyudasNivelacion();\n    } else {\n      document.getElementById('barra-progreso-wrap').style.display='none';\n      mapaCalorGrupo.clear();\n    }\n  });\n});\n\n/* ===================== LEVANTAMIENTO DE LA POLIGONAL ===================== */\nconst raycaster = new THREE.Raycaster();\nconst puntero = new THREE.Vector2();\nlet puntos = [], marcadores = [];\nconst lineaGrupo = new THREE.Group(); scene.add(lineaGrupo);\nlet cerrado = false;\nlet ladosMedidos = new Set();\n\nfunction coordsNormalizadas(e){\n  const rect = canvas.getBoundingClientRect();\n  puntero.x = ((e.clientX-rect.left)/rect.width)*2-1;\n  puntero.y = -((e.clientY-rect.top)/rect.height)*2+1;\n}\nfunction agregarPunto(p){\n  puntos.push(p);\n  const marc = new THREE.Mesh(new THREE.SphereGeometry(0.55,12,12), new THREE.MeshStandardMaterial({color:0xe8590c}));\n  marc.position.set(p.x, p.y+0.15, p.z);\n  scene.add(marc); marcadores.push(marc);\n  redibujarLineas();\n  actualizarPanel();\n}\nfunction redibujarLineas(){\n  lineaGrupo.clear();\n  const pts = puntos.map(p=>new THREE.Vector3(p.x,p.y+0.2,p.z));\n  if(cerrado && pts.length>2) pts.push(pts[0].clone());\n  if(pts.length>=2){\n    const g = new THREE.BufferGeometry().setFromPoints(pts);\n    lineaGrupo.add(new THREE.Line(g, new THREE.LineBasicMaterial({color:0xe8590c})));\n  }\n}\nfunction deshacer(){\n  if(cerrado || puntos.length===0) return;\n  puntos.pop();\n  scene.remove(marcadores.pop());\n  redibujarLineas();\n  actualizarPanel();\n}\nfunction reiniciarLevantamiento(){\n  puntos=[]; cerrado=false; ladosMedidos=new Set(); loteEnProgreso=false;\n  marcadores.forEach(m=>scene.remove(m)); marcadores=[];\n  lineaGrupo.clear();\n  document.getElementById('seccion-lados').style.display='none';\n  document.getElementById('seccion-area').style.display='none';\n  document.getElementById('btn-calc-objetivo').disabled = true;\n  document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n  actualizarPanel();\n}\nfunction cerrarPoligonal(){\n  if(puntos.length<3) return;\n  cerrado = true;\n  redibujarLineas();\n  generarTablaLados();\n  document.getElementById('seccion-lados').style.display='block';\n  document.getElementById('seccion-area').style.display='block';\n  document.getElementById('btn-calc-objetivo').disabled = false;\n  document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n  actualizarPanel();\n}\n\nfunction distanciaHorizontal(a,b){ return Math.hypot(a.x-b.x, a.z-b.z); }\nfunction calcularPerimetro(){\n  let per=0; const n=puntos.length;\n  for(let i=0;i<n;i++) per += distanciaHorizontal(puntos[i], puntos[(i+1)%n]);\n  return per;\n}\nfunction calcularAreaGauss(pts){\n  let suma=0; const n=pts.length;\n  for(let i=0;i<n;i++){ const a=pts[i], b=pts[(i+1)%n]; suma += (a.x*b.z - b.x*a.z); }\n  return Math.abs(suma)/2;\n}\nfunction pendienteMedia(){\n  const n = puntos.length; if(n<2) return 0;\n  let suma=0, tramos=0;\n  for(let i=0;i<n;i++){\n    const a=puntos[i], b=puntos[(i+1)%n];\n    const dist = distanciaHorizontal(a,b);\n    if(dist>0.01){ suma += (Math.abs(b.y-a.y)/dist)*100; tramos++; }\n  }\n  return tramos? suma/tramos : 0;\n}\nfunction dentroPoligono(x,z,poly){\n  let dentro=false;\n  for(let i=0,j=poly.length-1;i<poly.length;j=i++){\n    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;\n    if(((zi>z)!==(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) dentro=!dentro;\n  }\n  return dentro;\n}\n\nfunction generarTablaLados(){\n  const n = puntos.length;\n  let html='';\n  for(let i=0;i<n;i++){\n    const j=(i+1)%n;\n    html += `<li><span>P${i+1} \u2192 P${j+1}<\/span><button class=\"btn-medir\" data-i=\"${i}\">Medir<\/button><span class=\"valor-lado\" id=\"lado-${i}\">\u2014<\/span><\/li>`;\n  }\n  document.getElementById('lista-lados').innerHTML = html;\n  document.querySelectorAll('.btn-medir').forEach(b=>{\n    b.addEventListener('click', ()=>medirLado(parseInt(b.dataset.i)));\n  });\n}\nfunction medirLado(i){\n  if(ladosMedidos.has(i)) return;\n  const n=puntos.length, j=(i+1)%n;\n  const d = distanciaHorizontal(puntos[i],puntos[j]);\n  document.getElementById('lado-'+i).textContent = d.toFixed(2)+' m';\n  ladosMedidos.add(i);\n  const btn = document.querySelector(`.btn-medir[data-i=\"${i}\"]`);\n  if(btn){ btn.disabled=true; btn.textContent='\u2713'; }\n  document.getElementById('d-perim').textContent = ladosMedidos.size===n ? calcularPerimetro().toFixed(2)+' m' : `${ladosMedidos.size}/${n} lados medidos`;\n  document.getElementById('btn-calc-area').disabled = ladosMedidos.size<n;\n}\ndocument.getElementById('btn-calc-area').addEventListener('click', ()=>{\n  const area = calcularAreaGauss(puntos);\n  document.getElementById('d-area').textContent = area.toFixed(2)+' m\u00b2';\n  const cotas = puntos.map(p=>p.y);\n  const min=Math.min(...cotas), max=Math.max(...cotas);\n  document.getElementById('d-cotamin').textContent = min.toFixed(2)+' m';\n  document.getElementById('d-cotamax').textContent = max.toFixed(2)+' m';\n  document.getElementById('d-desnivel').textContent = (max-min).toFixed(2)+' m';\n  document.getElementById('d-pend').textContent = pendienteMedia().toFixed(1)+' %';\n  if(loteEnProgreso){\n    if(areaObjetivoActiva){\n      const desvio = Math.abs(area-areaObjetivoValor)/areaObjetivoValor;\n      if(desvio > toleranciaArea){\n        const aviso = document.getElementById('aviso-lote');\n        aviso.textContent = `El \u00e1rea qued\u00f3 en ${area.toFixed(1)} m\u00b2, pero el objetivo era ${areaObjetivoValor} m\u00b2 (\u00b1${(toleranciaArea*100).toFixed(0)}%). Reinici\u00e1 el levantamiento (secci\u00f3n V\u00c9RTICES) y ajust\u00e1 el pol\u00edgono.`;\n        aviso.style.display='block';\n        return;\n      }\n    }\n    guardarLoteActual();\n  }\n});\n\nlet ultimaCotaProyecto = null;\ndocument.getElementById('btn-calc-objetivo').addEventListener('click', ()=>{\n  if(!cerrado || puntos.length<3) return;\n  const cotaProyecto = puntos.reduce((s,p)=>s+p.y,0)/puntos.length;\n  ultimaCotaProyecto = cotaProyecto;\n  let corte=0, relleno=0;\n  for(let gx=0; gx<RES; gx++){\n    for(let gz=0; gz<RES; gz++){\n      const x = -SIZE/2 + cellSize*(gx+0.5);\n      const z = -SIZE/2 + cellSize*(gz+0.5);\n      if(!dentroPoligono(x,z,puntos)) continue;\n      const diff = alturaActual(x,z) - cotaProyecto;\n      if(diff>0) corte += diff*areaCelda; else relleno += -diff*areaCelda;\n    }\n  }\n  document.getElementById('d-cotaproy').textContent = cotaProyecto.toFixed(2)+' m';\n  document.getElementById('d-corte').textContent = corte.toFixed(1)+' m\u00b3';\n  document.getElementById('d-relleno').textContent = relleno.toFixed(1)+' m\u00b3';\n  const balance = corte-relleno;\n  document.getElementById('d-balance').textContent = Math.abs(balance)<1 ? 'compensado \u2248 0 m\u00b3' : (balance>0? `sobra ${balance.toFixed(1)} m\u00b3 (retirar)` : `falta ${(-balance).toFixed(1)} m\u00b3 (aportar)`);\n});\ndocument.getElementById('btn-usar-cota-proyecto').addEventListener('click', ()=>{\n  if(ultimaCotaProyecto===null) return;\n  cotaObjetivo = ultimaCotaProyecto;\n  document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n  actualizarCurvaObjetivo();\n  sincronizarCotaConLoteSeleccionado();\n});\n// si est\u00e1s editando la cota de un lote YA guardado (no uno nuevo en curso), guarda el cambio en ese lote\nfunction sincronizarCotaConLoteSeleccionado(){\n  if(!loteEnProgreso && loteSeleccionadoIdx>=0 && lotesFijados[loteSeleccionadoIdx]){\n    lotesFijados[loteSeleccionadoIdx].cotaObjetivo = cotaObjetivo;\n    refrescarAyudasNivelacion();\n  }\n}\n\nfunction actualizarPanel(){\n  const lista = document.getElementById('lista-puntos');\n  lista.innerHTML = puntos.length===0\n    ? '<li style=\"color:#a99a6f\">\u2014 sin estacas clavadas \u2014<\/li>'\n    : puntos.map((p,i)=>`<li><b>P${i+1}<\/b> &nbsp;x=${p.x.toFixed(1)}  z=${p.z.toFixed(1)}  cota=${p.y.toFixed(2)}<\/li>`).join('');\n  document.getElementById('btn-deshacer').disabled = cerrado || puntos.length===0;\n  document.getElementById('btn-cerrar').disabled = cerrado || puntos.length<3;\n  const filaArea = document.getElementById('fila-area-parcial');\n  if(areaObjetivoActiva && puntos.length>=3 && !cerrado){\n    filaArea.style.display='flex';\n    document.getElementById('d-area-parcial').textContent = `${calcularAreaGauss(puntos).toFixed(1)} / ${areaObjetivoValor} m\u00b2`;\n  } else {\n    filaArea.style.display='none';\n  }\n}\ndocument.getElementById('btn-deshacer').addEventListener('click', deshacer);\ndocument.getElementById('btn-cerrar').addEventListener('click', cerrarPoligonal);\ndocument.getElementById('btn-reiniciar').addEventListener('click', reiniciarLevantamiento);\n\nfunction actualizarPanelObstaculos(){\n  document.getElementById('d-obst-contador').textContent = `${obstaculosObjetos.length}/${obstaculosDefIniciales.length} en el predio`;\n}\ndocument.getElementById('btn-restaurar-obst').addEventListener('click', generarObstaculos);\n\nfunction dentroDeAlgunLote(x,z){\n  return lotesFijados.some(l=>dentroPoligono(x,z,l.corners));\n}\n\n/* ===================== MAPA DE CALOR + PROGRESO DE NIVELACI\u00d3N EN VIVO ===================== */\nconst mapaCalorGrupo = new THREE.Group(); scene.add(mapaCalorGrupo);\nfunction generarMapaCalor(){\n  mapaCalorGrupo.clear();\n  lotesFijados.forEach(l=>{\n    const b = l.bbox;\n    const anchoB = b.maxX-b.minX, largoB = b.maxZ-b.minZ;\n    if(anchoB<=0 || largoB<=0) return;\n    const resU = 22;\n    const resV = Math.min(60, Math.max(6, Math.round(resU*(largoB/anchoB))));\n    const verts=[], colors=[], indices=[];\n    for(let j=0;j<=resV;j++){\n      for(let i=0;i<=resU;i++){\n        const x = b.minX + anchoB*(i/resU);\n        const z = b.minZ + largoB*(j/resV);\n        const h = alturaActual(x,z);\n        verts.push(x, h+0.12, z);\n        const diff = h - l.cotaObjetivo;\n        const mag = Math.min(1, Math.abs(diff)/2.5);\n        if(diff>0){ colors.push(1, 1-mag*0.85, 1-mag*0.85); }       // rojo = hay que cortar\n        else { colors.push(1-mag*0.85, 1-mag*0.55, 1); }             // azul = hay que rellenar\n      }\n    }\n    for(let j=0;j<resV;j++){\n      for(let i=0;i<resU;i++){\n        const a=j*(resU+1)+i, bI=a+1, c=a+resU+1, d=c+1;\n        indices.push(a,c,bI, bI,c,d);\n      }\n    }\n    const g = new THREE.BufferGeometry();\n    g.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));\n    g.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));\n    g.setIndex(indices);\n    mapaCalorGrupo.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity:0.55, side:THREE.DoubleSide, depthWrite:false})));\n  });\n}\nfunction calcularProgresoNivelacion(){\n  if(lotesFijados.length===0) return null;\n  let totalCeldas=0, totalOk=0;\n  lotesFijados.forEach(l=>{\n    for(let gx=0; gx<=RES; gx++){\n      for(let gz=0; gz<=RES; gz++){\n        const i = idxGrid[gz][gx];\n        const x = pos.getX(i), z = pos.getZ(i);\n        if(!dentroPoligono(x,z,l.corners)) continue;\n        totalCeldas++;\n        if(Math.abs(heights[i]-l.cotaObjetivo)<=toleranciaNivel) totalOk++;\n      }\n    }\n  });\n  return totalCeldas>0 ? totalOk/totalCeldas : null;\n}\nfunction refrescarAyudasNivelacion(){\n  if(modo!=='nivelar') return;\n  generarMapaCalor();\n  const p = calcularProgresoNivelacion();\n  const wrap = document.getElementById('barra-progreso-wrap');\n  if(p===null){\n    document.getElementById('txt-progreso-nivel').textContent = 'fij\u00e1 un lote primero';\n    document.getElementById('barra-progreso-relleno').style.width='0%';\n  } else {\n    document.getElementById('txt-progreso-nivel').textContent = Math.round(p*100)+'%';\n    document.getElementById('barra-progreso-relleno').style.width = (p*100)+'%';\n  }\n}\nconst pincel = {radio:7, fuerza:0.45};\nlet acumCorte=0, acumRelleno=0;\nlet herramienta = 'aplanar';   // 'cavar' | 'rellenar' | 'aplanar'\nlet pasoMetros = 1;          // metros que mueve cada pasada de cavar/rellenar\n\n/* anillo que muestra el \u00e1rea que abarca el pincel */\nconst anilloPincel = new THREE.Mesh(\n  new THREE.RingGeometry(pincel.radio-0.25, pincel.radio, 48),\n  new THREE.MeshBasicMaterial({color:0xffe9c9, transparent:true, opacity:0.75, side:THREE.DoubleSide, depthTest:false})\n);\nanilloPincel.rotation.x = -Math.PI/2;\nanilloPincel.renderOrder = 999;\nanilloPincel.visible = false;\nscene.add(anilloPincel);\n\nconst discoPincel = new THREE.Mesh(\n  new THREE.CircleGeometry(pincel.radio, 48),\n  new THREE.MeshBasicMaterial({color:0xffe9c9, transparent:true, opacity:0.16, side:THREE.DoubleSide, depthTest:false})\n);\ndiscoPincel.rotation.x = -Math.PI/2;\ndiscoPincel.renderOrder = 998;\ndiscoPincel.visible = false;\nscene.add(discoPincel);\n\nfunction refrescarGeometriaAnillo(){\n  anilloPincel.geometry.dispose();\n  anilloPincel.geometry = new THREE.RingGeometry(pincel.radio-0.25, pincel.radio, 48);\n  discoPincel.geometry.dispose();\n  discoPincel.geometry = new THREE.CircleGeometry(pincel.radio, 48);\n}\nfunction colorAnilloSegunHerramienta(){\n  const c = herramienta==='cavar' ? 0x7fc4ff : (herramienta==='rellenar' ? 0xffb86b : 0x9be88a);\n  anilloPincel.material.color.setHex(c);\n  discoPincel.material.color.setHex(c);\n}\nfunction moverAnillo(x,z){\n  const y = alturaActual(x,z)+0.25;\n  anilloPincel.position.set(x,y,z);\n  discoPincel.position.set(x,y,z);\n  anilloPincel.visible = true;\n  discoPincel.visible = true;\n}\nfunction ocultarAnillo(){\n  anilloPincel.visible = false;\n  discoPincel.visible = false;\n}\n\nconst pasosPorCategoria = { gruesa:[2,5,10], fina:[0.1,0.25,0.5,1] };\nlet categoriaHerramienta = 'gruesa';\nfunction renderPasos(){\n  const cont = document.getElementById('fila-pasos');\n  const pasos = pasosPorCategoria[categoriaHerramienta];\n  cont.innerHTML = pasos.map((p,i)=>`<button class=\"btn-paso ${i===0?'activo':''}\" data-paso=\"${p}\">${p} m<\/button>`).join('');\n  pasoMetros = pasos[0];\n  cont.querySelectorAll('.btn-paso').forEach(b=>{\n    b.addEventListener('click', ()=>{\n      pasoMetros = parseFloat(b.dataset.paso);\n      cont.querySelectorAll('.btn-paso').forEach(x=>x.classList.remove('activo'));\n      b.classList.add('activo');\n    });\n  });\n}\ndocument.querySelectorAll('.btn-cat[data-cat]').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    categoriaHerramienta = b.dataset.cat;\n    document.querySelectorAll('#fila-categoria .btn-cat').forEach(x=>x.classList.remove('activo'));\n    b.classList.add('activo');\n    renderPasos();\n    const rango = document.getElementById('rango-pincel');\n    if(categoriaHerramienta==='gruesa'){\n      rango.min=6; rango.max=16;\n      if(pincel.radio<6){ pincel.radio=8; rango.value=8; }\n    } else {\n      rango.min=2; rango.max=8;\n      if(pincel.radio>8){ pincel.radio=5; rango.value=5; }\n    }\n    document.getElementById('d-radio').textContent = pincel.radio+' m';\n    refrescarGeometriaAnillo();\n    document.getElementById('nota-categoria').innerHTML = categoriaHerramienta==='gruesa'\n      ? 'La pala gruesa mueve mucho por pasada pero es <b>imprecisa<\/b> (\u00b115%) \u2014 ideal para el desbaste grueso. Pas\u00e1 a la afinadora para el ajuste fino y exacto.'\n      : 'La afinadora mueve poco por pasada pero es <b>exacta<\/b> \u2014 ideal para el terminado fino despu\u00e9s del desbaste grueso.';\n  });\n});\nrenderPasos();\ndocument.querySelectorAll('.btn-herr').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    herramienta = b.dataset.herr;\n    document.querySelectorAll('.btn-herr').forEach(x=>x.classList.remove('activo'));\n    document.getElementById('btn-herr-aplanar').classList.remove('activo');\n    b.classList.add('activo');\n    colorAnilloSegunHerramienta();\n    document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n  });\n});\ndocument.getElementById('btn-herr-aplanar').addEventListener('click', e=>{\n  herramienta = 'aplanar';\n  document.querySelectorAll('.btn-herr').forEach(x=>x.classList.remove('activo'));\n  e.target.classList.add('activo');\n  colorAnilloSegunHerramienta();\n  document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n});\n\ndocument.getElementById('input-cota-objetivo').addEventListener('input', e=>{\n  cotaObjetivo = parseFloat(e.target.value)||0;\n  actualizarCurvaObjetivo();\n  refrescarAyudasNivelacion();\n  sincronizarCotaConLoteSeleccionado();\n});\ndocument.getElementById('btn-subir-curva').addEventListener('click', ()=>{\n  cotaObjetivo += intervaloCurvas;\n  document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n  actualizarCurvaObjetivo();\n  refrescarAyudasNivelacion();\n  sincronizarCotaConLoteSeleccionado();\n});\ndocument.getElementById('btn-bajar-curva').addEventListener('click', ()=>{\n  cotaObjetivo -= intervaloCurvas;\n  document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n  actualizarCurvaObjetivo();\n  refrescarAyudasNivelacion();\n  sincronizarCotaConLoteSeleccionado();\n});\ndocument.getElementById('btn-toggle-curvas').addEventListener('click', e=>{\n  curvasVisibles = !curvasVisibles;\n  curvasGrupo.visible = curvasVisibles;\n  curvaObjetivoGrupo.visible = curvasVisibles;\n  e.target.textContent = curvasVisibles ? 'Ocultar curvas de nivel' : 'Mostrar curvas de nivel';\n});\ndocument.getElementById('rango-pincel').addEventListener('input', e=>{\n  pincel.radio = parseFloat(e.target.value);\n  document.getElementById('d-radio').textContent = pincel.radio+' m';\n  refrescarGeometriaAnillo();\n});\ndocument.getElementById('btn-reset-terreno').addEventListener('click', ()=>{\n  heights.set(heightsIniciales);\n  for(let i=0;i<pos.count;i++){\n    pos.setY(i, heights[i]);\n    const c = colorPorCota(heights[i]);\n    colores[i*3]=c.r; colores[i*3+1]=c.g; colores[i*3+2]=c.b;\n  }\n  pos.needsUpdate=true; geo.attributes.color.needsUpdate=true;\n  geo.computeVertexNormals(); geo.computeBoundingSphere();\n  acumCorte=0; acumRelleno=0;\n  document.getElementById('d-acorte').textContent='0.0 m\u00b3';\n  document.getElementById('d-arelleno').textContent='0.0 m\u00b3';\n  generarCurvasNivel();\n});\n\nfunction pintarTerreno(cx,cz){\n  const [cgx,cgz] = coordAGrilla(cx,cz);\n  const radioCeldas = Math.ceil(pincel.radio/cellSize)+1;\n  let algunaAplicada = false;\n  for(let gz=Math.max(0,cgz-radioCeldas); gz<=Math.min(RES,cgz+radioCeldas); gz++){\n    for(let gx=Math.max(0,cgx-radioCeldas); gx<=Math.min(RES,cgx+radioCeldas); gx++){\n      const i = idxGrid[gz][gx];\n      const vx = pos.getX(i), vz = pos.getZ(i);\n      const loteDelPunto = lotesFijados.find(l=>dentroPoligono(vx,vz,l.corners));\n      if(!loteDelPunto) continue;\n      const d = Math.hypot(vx-cx, vz-cz);\n      if(d>pincel.radio) continue;\n      algunaAplicada = true;\n      const t = 1 - d/pincel.radio;\n      const falloff = 0.2 + 0.8*(t*t*(3-2*t));\n      let nuevo;\n      if(herramienta==='aplanar'){\n        const objetivoLocal = loteDelPunto.cotaObjetivo;\n        const diff = objetivoLocal - heights[i];\n        nuevo = Math.abs(diff) < 0.04 ? objetivoLocal : heights[i] + diff*pincel.fuerza*falloff;\n      } else {\n        const signo = herramienta==='cavar' ? -1 : 1;\n        const ruido = categoriaHerramienta==='gruesa' ? (0.85 + Math.random()*0.3) : 1;\n        nuevo = heights[i] + signo*pasoMetros*falloff*ruido;\n      }\n      const real = nuevo - heights[i];\n      heights[i] = nuevo;\n      pos.setY(i, nuevo);\n      if(real<0) acumCorte += -real*areaCelda; else acumRelleno += real*areaCelda;\n      const c = colorPorCota(nuevo);\n      colores[i*3]=c.r; colores[i*3+1]=c.g; colores[i*3+2]=c.b;\n    }\n  }\n  pos.needsUpdate=true; geo.attributes.color.needsUpdate=true;\n  geo.computeVertexNormals(); geo.computeBoundingSphere();\n  document.getElementById('d-acorte').textContent = acumCorte.toFixed(1)+' m\u00b3';\n  document.getElementById('d-arelleno').textContent = acumRelleno.toFixed(1)+' m\u00b3';\n  if(!algunaAplicada){\n    document.getElementById('banner-instrucciones').textContent = lotesFijados.length===0\n      ? 'Primero fij\u00e1 un lote \u2014 solo se puede nivelar dentro de un lote ya ubicado.'\n      : 'Ah\u00ed afuera no hay ning\u00fan lote fijado. Movete sobre la zona del lote para nivelar.';\n  }\n}\nfunction aplicarPincelDesdeEvento(e){\n  coordsNormalizadas(e);\n  raycaster.setFromCamera(puntero,camera);\n  const hit = raycaster.intersectObject(terreno)[0];\n  if(!hit) return;\n  if(dentroRestriccion(hit.point.x, hit.point.z)){\n    document.getElementById('banner-instrucciones').textContent = '\u26d4 No se puede mover suelo dentro de la servidumbre.';\n    return;\n  }\n  pintarTerreno(hit.point.x, hit.point.z);\n}\n\n/* ===================== CALLE DE ACCESO ===================== */\nlet callePuntos = [];\nlet calleMarcadores = [];\nconst calleLineaGrupo = new THREE.Group(); scene.add(calleLineaGrupo);\nconst pendienteMaximaCalle = 10; // % m\u00e1ximo admitido por tramo\nlet calleOk = false;\ndocument.getElementById('d-pendiente-max-calle').textContent = pendienteMaximaCalle+'%';\n\nfunction redibujarCalle(){\n  calleLineaGrupo.clear();\n  if(callePuntos.length<2){ calleOk=false; document.getElementById('d-calle-estado').textContent='0/0'; return; }\n  const posiciones=[], colores2=[];\n  let tramosOk=0;\n  for(let i=0;i<callePuntos.length-1;i++){\n    const a=callePuntos[i], b=callePuntos[i+1];\n    const dist = distanciaHorizontal(a,b);\n    const pend = dist>0.01 ? (Math.abs(b.y-a.y)/dist)*100 : 0;\n    const ok = pend<=pendienteMaximaCalle;\n    if(ok) tramosOk++;\n    const c = ok ? [0.36,0.62,0.29] : [0.85,0.23,0.18];\n    posiciones.push(a.x,a.y+0.25,a.z, b.x,b.y+0.25,b.z);\n    colores2.push(...c, ...c);\n  }\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(posiciones,3));\n  g.setAttribute('color', new THREE.Float32BufferAttribute(colores2,3));\n  calleLineaGrupo.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({vertexColors:true})));\n  calleOk = tramosOk === (callePuntos.length-1);\n  document.getElementById('d-calle-estado').textContent = `${tramosOk}/${callePuntos.length-1}`;\n}\nfunction actualizarPanelCalle(){\n  const lista = document.getElementById('lista-calle');\n  lista.innerHTML = callePuntos.length===0\n    ? '<li style=\"color:#a99a6f\">\u2014 sin puntos trazados \u2014<\/li>'\n    : callePuntos.map((p,i)=>`<li>P${i+1}: x=${p.x.toFixed(1)} z=${p.z.toFixed(1)} cota=${p.y.toFixed(2)}<\/li>`).join('');\n  document.getElementById('btn-deshacer-calle').disabled = callePuntos.length===0;\n}\nfunction agregarPuntoCalle(p){\n  callePuntos.push(p);\n  const marc = new THREE.Mesh(new THREE.SphereGeometry(0.5,10,10), new THREE.MeshStandardMaterial({color:0x3f6f8f}));\n  marc.position.set(p.x, p.y+0.25, p.z);\n  scene.add(marc); calleMarcadores.push(marc);\n  redibujarCalle();\n  actualizarPanelCalle();\n}\nfunction deshacerCalle(){\n  if(callePuntos.length===0) return;\n  callePuntos.pop();\n  scene.remove(calleMarcadores.pop());\n  redibujarCalle();\n  actualizarPanelCalle();\n}\nfunction reiniciarCalle(){\n  callePuntos=[];\n  calleMarcadores.forEach(m=>scene.remove(m)); calleMarcadores=[];\n  calleLineaGrupo.clear();\n  calleOk=false;\n  actualizarPanelCalle();\n  document.getElementById('d-calle-estado').textContent='0/0';\n}\ndocument.getElementById('btn-deshacer-calle').addEventListener('click', deshacerCalle);\ndocument.getElementById('btn-reiniciar-calle').addEventListener('click', reiniciarCalle);\n\n/* ===================== PROGRESO DEL NIVEL ===================== */\nlet ultimoResultadoCompleto = false;\nfunction generarTextoInforme(){\n  const cfg = NIVELES[nivelActual];\n  let t = 'INFORME DE LEVANTAMIENTO TOPOGR\u00c1FICO\\n';\n  t += `Nivel ${nivelActual} \u2014 ${cfg.nombre}\\n`;\n  t += `Fecha: ${new Date().toLocaleDateString()}\\n`;\n  t += '='.repeat(50)+'\\n\\n';\n  if(lotesFijados.length===0) t += '(Todav\u00eda no se fij\u00f3 ning\u00fan lote.)\\n\\n';\n  lotesFijados.forEach((l,i)=>{\n    t += `LOTE ${i+1}\\n`;\n    l.corners.forEach((p,j)=> t += `  P${j+1}: x=${p.x.toFixed(2)}  z=${p.z.toFixed(2)}  cota=${p.y.toFixed(2)} m\\n`);\n    let per=0;\n    for(let k=0;k<l.corners.length;k++) per += distanciaHorizontal(l.corners[k], l.corners[(k+1)%l.corners.length]);\n    t += `  Per\u00edmetro: ${per.toFixed(2)} m\\n`;\n    t += `  \u00c1rea: ${l.area.toFixed(2)} m\u00b2\\n`;\n    t += `  Nivelado dentro de tolerancia: ${l.nivelado ? 'S\u00cd' : 'NO (o no verificado a\u00fan \u2014 us\u00e1 \"Verificar progreso\")'}\\n\\n`;\n  });\n  t += `Obst\u00e1culos que a\u00fan estorban dentro de los lotes: ${obstaculosDentroDeLotes()}\\n`;\n  t += `Tierra cortada acumulada: ${acumCorte.toFixed(1)} m\u00b3\\n`;\n  t += `Tierra rellenada acumulada: ${acumRelleno.toFixed(1)} m\u00b3
