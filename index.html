\\n`;\n  if(cfg.compensar){\n    const total = acumCorte+acumRelleno;\n    const desb = total>0 ? Math.abs(acumCorte-acumRelleno)/total : 0;\n    t += `Desbalance corte/relleno: ${(desb*100).toFixed(1)}% (m\u00e1ximo admitido 12%)\\n`;\n  }\n  if(cfg.calleRequerida){\n    t += `Calle de acceso: ${callePuntos.length<2 ? 'no trazada' : (calleOk?'CUMPLE la pendiente m\u00e1xima':'NO CUMPLE la pendiente m\u00e1xima')}\\n`;\n  }\n  t += `\\nResultado del nivel: ${ultimoResultadoCompleto ? 'APROBADO \u2713' : 'A\u00daN NO APROBADO'}\\n`;\n  return t;\n}\ndocument.getElementById('btn-ver-informe').addEventListener('click', ()=>{\n  document.getElementById('texto-informe').textContent = generarTextoInforme();\n  document.getElementById('modal-informe').style.display='flex';\n});\ndocument.getElementById('btn-cerrar-informe').addEventListener('click', ()=>{\n  document.getElementById('modal-informe').style.display='none';\n});\ndocument.getElementById('btn-descargar-informe').addEventListener('click', ()=>{\n  const blob = new Blob([generarTextoInforme()], {type:'text/plain'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = `informe_nivel${nivelActual}.txt`;\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n});\nfunction verificarNivelacionLote(lote){\n  let n=0, ok=0;\n  for(let gx=0; gx<=RES; gx++){\n    for(let gz=0; gz<=RES; gz++){\n      const i = idxGrid[gz][gx];\n      const x = pos.getX(i), z = pos.getZ(i);\n      if(!dentroPoligono(x,z,lote.corners)) continue;\n      n++;\n      if(Math.abs(heights[i]-lote.cotaObjetivo)<=toleranciaNivel) ok++;\n    }\n  }\n  return {nivelado: n>0 && ok===n};\n}\nfunction obstaculosDentroDeLotes(){\n  // s\u00f3lo importan los obst\u00e1culos que caen dentro de alguna parcela ya fijada\n  let dentro = 0;\n  obstaculosObjetos.forEach(o=>{\n    const x=o.position.x, z=o.position.z;\n    if(lotesFijados.some(l=>dentroPoligono(x,z,l.corners))) dentro++;\n  });\n  return dentro;\n}\nfunction verificarProgreso(){\n  const cfg = NIVELES[nivelActual];\n  const estorbando = obstaculosDentroDeLotes();\n  document.getElementById('chk-obst').textContent = estorbando===0 ? 'sin obst\u00e1culos \u2713' : `${estorbando} estorbando`;\n  document.getElementById('chk-lotes').textContent = `${lotesFijados.length}/${cfg.lotesRequeridos}`;\n  let nivelados=0;\n  lotesFijados.forEach(l=>{ const r=verificarNivelacionLote(l); l.nivelado=r.nivelado; if(r.nivelado) nivelados++; });\n  document.getElementById('chk-nivel').textContent = `${nivelados}/${cfg.lotesRequeridos}`;\n\n  const obstOk = estorbando===0;\n  const lotesOk = lotesFijados.length>=cfg.lotesRequeridos;\n  const nivelOk = lotesOk && nivelados===cfg.lotesRequeridos;\n\n  let compOk = true;\n  if(cfg.compensar){\n    const total = acumCorte + acumRelleno;\n    const desbalance = total>0 ? Math.abs(acumCorte-acumRelleno)/total : 0;\n    compOk = total>0 && desbalance<=toleranciaCompensacion;\n    document.getElementById('chk-comp').textContent = total>0\n      ? `desbalance ${(desbalance*100).toFixed(0)}% ${compOk?'\u2713':'(m\u00e1x 12%)'}`\n      : 'sin movimiento a\u00fan';\n  }\n\n  let calleCheckOk = true;\n  if(cfg.calleRequerida){\n    calleCheckOk = callePuntos.length>=2 && calleOk;\n  }\n\n  const completo = obstOk && lotesOk && nivelOk && compOk && calleCheckOk;\n  ultimoResultadoCompleto = completo;\n  const msg = document.getElementById('msg-nivel');\n  const btnSig = document.getElementById('btn-siguiente-nivel');\n  if(completo){\n    try{parent.postMessage({tipo:'completo',nivel:nivelActual},'*');}catch(e){}\n    if(NIVELES[nivelActual+1]){\n      msg.textContent = '\u2705 \u00a1Nivel completo! Ya pod\u00e9s pasar de nivel.';\n      btnSig.style.display='block';\n      btnSig.textContent = `Ir al Nivel ${nivelActual+1} \u2192`;\n    } else {\n      msg.textContent = '\u2705 \u00a1Nivel 4 completo! Ya pod\u00e9s pasar al Nivel 5 (estaci\u00f3n total).';\n      btnSig.style.display='block'; btnSig.textContent='Ir al Nivel 5 \u2192';\n    }\n  } else {\n    const faltantes = [];\n    if(!lotesOk) faltantes.push('ubicar todos los lotes');\n    if(!obstOk) faltantes.push('despejar los obst\u00e1culos que caen dentro de los lotes');\n    if(!nivelOk) faltantes.push('nivelar los lotes dentro de la tolerancia');\n    if(!compOk) faltantes.push('compensar el suelo (corte \u2248 relleno)');\n    if(!calleCheckOk) faltantes.push('trazar la calle de acceso cumpliendo la pendiente m\u00e1xima');\n    msg.textContent = 'Todav\u00eda falta: ' + faltantes.join(' \u00b7 ');\n    btnSig.style.display='none';\n  }\n}\ndocument.getElementById('btn-verificar').addEventListener('click', verificarProgreso);\ndocument.getElementById('btn-siguiente-nivel').addEventListener('click', ()=>{\n  if(NIVELES[nivelActual+1]) cargarNivel(nivelActual+1);\n  else parent.postMessage({tipo:'siguiente',desde:nivelActual},'*');\n});\n\n/* ===================== ENTRADA UNIFICADA (mouse/touch) ===================== */\nlet estado = null;\n\ncanvas.addEventListener('pointerdown', e=>{\n  if(e.button!==0) return;\n  coordsNormalizadas(e);\n  if(modo==='orbitar'){\n    estado = {tipo:'camara', x:e.clientX, y:e.clientY, movio:false};\n    return;\n  }\n  if(modo==='levantar' && !cerrado){\n    raycaster.setFromCamera(puntero,camera);\n    const hitM = raycaster.intersectObjects(marcadores)[0];\n    if(hitM){ estado = {tipo:'vertice', idx: marcadores.indexOf(hitM.object)}; return; }\n    estado = {tipo:'click-terreno', x:e.clientX, y:e.clientY, movio:false};\n    return;\n  }\n  if(modo==='obstaculos'){\n    raycaster.setFromCamera(puntero,camera);\n    const hits = raycaster.intersectObjects(obstaculosObjetos, true);\n    if(hits.length){\n      let o = hits[0].object;\n      while(o && !o.userData.tipo) o = o.parent;\n      if(o) estado = {tipo:'obstaculo', grupo:o};\n    }\n    return;\n  }\n  if(modo==='lote'){\n    if(!loteMesh) return;\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(loteMesh)[0];\n    if(hit) estado = {tipo:'lote'};\n    return;\n  }\n  if(modo==='nivelar'){\n    estado = {tipo:'nivelar'};\n    aplicarPincelDesdeEvento(e);\n    if(herramienta!=='aplanar'){\n      // cavar/rellenar: una sola aplicaci\u00f3n por clic, para que el paso sea exacto\n      generarCurvasNivel();\n      refrescarAyudasNivelacion();\n      estado = {tipo:'nivelar-hecho'};\n    }\n    return;\n  }\n  if(modo==='calle'){\n    estado = {tipo:'click-calle', x:e.clientX, y:e.clientY, movio:false};\n    return;\n  }\n});\n\ncanvas.addEventListener('pointermove', e=>{\n  if(modo!=='nivelar'){ ocultarAnillo(); return; }\n  coordsNormalizadas(e);\n  raycaster.setFromCamera(puntero,camera);\n  const hit = raycaster.intersectObject(terreno)[0];\n  if(hit) moverAnillo(hit.point.x, hit.point.z); else ocultarAnillo();\n});\ncanvas.addEventListener('pointerleave', ocultarAnillo);\n\nwindow.addEventListener('pointermove', e=>{\n  if(!estado) return;\n  if(estado.tipo==='camara'){\n    const dx=e.clientX-estado.x, dy=e.clientY-estado.y;\n    if(Math.abs(dx)>3||Math.abs(dy)>3) estado.movio=true;\n    if(!estado.movio) return;\n    azimut -= dx*0.006;\n    polar = Math.min(1.45, Math.max(0.25, polar-dy*0.005));\n    estado.x=e.clientX; estado.y=e.clientY;\n    actualizarCamara();\n  } else if(estado.tipo==='click-terreno'){\n    const dx=e.clientX-estado.x, dy=e.clientY-estado.y;\n    if(Math.abs(dx)>3||Math.abs(dy)>3) estado.movio=true;\n  } else if(estado.tipo==='click-calle'){\n    const dx=e.clientX-estado.x, dy=e.clientY-estado.y;\n    if(Math.abs(dx)>3||Math.abs(dy)>3) estado.movio=true;\n  } else if(estado.tipo==='vertice'){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(planoArrastre)[0];\n    if(!hit) return;\n    const x=hit.point.x, z=hit.point.z, y=alturaActual(x,z);\n    puntos[estado.idx] = {x,y,z};\n    marcadores[estado.idx].position.set(x,y+0.15,z);\n    redibujarLineas(); actualizarPanel();\n  } else if(estado.tipo==='obstaculo'){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(planoArrastre)[0];\n    if(!hit) return;\n    estado.grupo.position.set(hit.point.x, hit.point.y, hit.point.z);\n  } else if(estado.tipo==='lote'){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(planoArrastre)[0];\n    if(!hit) return;\n    loteCentro.x = hit.point.x; loteCentro.z = hit.point.z;\n    actualizarGeometriaLote();\n  } else if(estado.tipo==='nivelar'){\n    aplicarPincelDesdeEvento(e);\n  }\n});\n\nwindow.addEventListener('pointerup', e=>{\n  if(!estado) return;\n  if(estado.tipo==='click-terreno' && !estado.movio){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(terreno)[0];\n    if(hit) agregarPunto({x:hit.point.x, y:hit.point.y, z:hit.point.z});\n  }\n  if(estado.tipo==='click-calle' && !estado.movio){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(terreno)[0];\n    if(hit) agregarPuntoCalle({x:hit.point.x, y:hit.point.y, z:hit.point.z});\n  }\n  if(estado.tipo==='obstaculo'){\n    const g = estado.grupo;\n    if(Math.abs(g.position.x)>SIZE/2+2 || Math.abs(g.position.z)>SIZE/2+2){\n      scene.remove(g);\n      obstaculosObjetos = obstaculosObjetos.filter(o=>o!==g);\n      actualizarPanelObstaculos();\n    } else {\n      g.position.y = alturaActual(g.position.x, g.position.z);\n    }\n  }\n  if(estado.tipo==='nivelar'){\n    generarCurvasNivel();\n    refrescarAyudasNivelacion();\n  }\n  estado = null;\n});\n\n/* ===================== RESIZE + LOOP ===================== */\nfunction resize(){\n  const w = canvas.parentElement.clientWidth, h = canvas.parentElement.clientHeight;\n  renderer.setSize(w,h,false);\n  camera.aspect = w/h;\n  camera.updateProjectionMatrix();\n}\nwindow.addEventListener('resize', resize);\nresize();\nfunction animar(){ requestAnimationFrame(animar); renderer.render(scene, camera); }\nanimar();\n\n/* ===================== ARRANQUE ===================== */\nwindow.addEventListener('message',e=>{const d=e.data; if(d&&d.tipo==='cargar'&&NIVELES[d.nivel]&&d.nivel!==nivelActual) cargarNivel(d.nivel);});\ncargarNivel(1);\n<\/script>\n<\/body>\n<\/html>\n", SRC_S="<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Simulador Topogr\u00e1fico - Levantamiento<\/title>\n<style>\n  :root{\n    --tierra-1:#f4ecd8; --tierra-2:#e3d5b3; --tinta:#2c2418; --linea:#8a7857;\n    --naranja:#e8590c; --verde-ok:#4a8a3a; --panel-borde:#c9b98c;\n    --lcd-bg:#829e71; --lcd-text:#1a2b13;\n    --hud-fondo:rgba(18,20,24,.88);\n    --mono: 'Courier New', ui-monospace, monospace; --sans: 'Segoe UI', Arial, sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;background:#101216;font-family:var(--sans);overflow:hidden;}\n  #app{position:relative;width:100vw;height:100vh;display:flex;}\n  \n  /* Lienzo 3D */\n  #visor-wrap{flex:1;position:relative;overflow:hidden;}\n  canvas{display:block;width:100%;height:100%;}\n  \n  /* M\u00e1scara del Ocular */\n  #mascara-lente{\n    position:absolute; top:0; left:0; width:100%; height:100%;\n    background: radial-gradient(circle at center, transparent 38%, #000 42%);\n    pointer-events:none; z-index:5; display:none;\n  }\n  \n  /* Ret\u00edcula */\n  #reticula{\n    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);\n    width:100px;height:100px;pointer-events:none;z-index:6;display:none;\n  }\n  .linea-r{position:absolute;background:rgba(255,30,30,0.9);box-shadow:0 0 2px rgba(0,0,0,0.8);}\n  #r-h{top:50%;left:0;width:100%;height:1.5px;transform:translateY(-50%);}\n  #r-v{left:50%;top:0;height:100%;width:1.5px;transform:translateX(-50%);}\n  .r-centro{position:absolute;top:50%;left:50%;width:10px;height:10px;border:1.5px solid rgba(255,30,30,0.9);border-radius:50%;transform:translate(-50%,-50%);}\n  #visor-wrap.fijado .linea-r, #visor-wrap.fijado .r-centro { background:#4a8a3a; border-color:#4a8a3a; }\n\n  /* Minimapa */\n  #minimapa{\n    position:absolute; top:20px; right:20px; width:180px; height:180px;\n    background: rgba(18,20,24,0.85); border: 2px solid var(--naranja);\n    border-radius: 50%; z-index: 15; display: none; overflow: hidden;\n    box-shadow: 0 0 15px rgba(0,0,0,0.8);\n  }\n  #canvas-mini { width: 100%; height: 100%; display: block; }\n\n  /* HUD Top */\n  #hud-top{\n    position:absolute;top:20px;left:50%;transform:translateX(-50%);\n    background:var(--hud-fondo);color:var(--tierra-1);padding:12px 20px;\n    font-family:var(--mono);font-size:13px;border-radius:4px;border:1px solid #333;\n    pointer-events:none; z-index:10; text-align:center; display:none;\n  }\n\n  /* Controles Fase */\n  #controles-fase{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:10; display:none; }\n  .btn-fase{ background:#4a8a3a; color:#fff; border:none; padding:12px 24px; font-size:14px; font-weight:bold; cursor:pointer; border-radius:3px; border:2px solid #fff; }\n  .btn-fase:disabled{background:#555; border-color:#777; cursor:not-allowed; opacity:0.8;}\n\n  /* Panel Derecho */\n  #panel{width:360px;min-width:360px;background:var(--tierra-1);border-left:1px solid var(--panel-borde);display:flex;flex-direction:column;color:var(--tinta);z-index:20;}\n  #panel-scroll{overflow-y:auto;padding:20px;flex:1;}\n  h2{font-size:14px;margin:0 0 4px;font-weight:700;border-bottom:2px solid var(--tinta);padding-bottom:8px;}\n  .sub{font-size:11px;color:var(--linea);font-family:var(--mono);margin:0 0 16px;}\n\n  /* Elementos UI compartidos */\n  .btn{width:100%;padding:12px;margin-top:8px;border:none;background:var(--naranja);color:#fff;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;border-radius:3px;text-transform:uppercase;}\n  .btn:hover{background:#c94a08;}\n  .btn:disabled{background:#ccc; cursor:not-allowed; color:#666;}\n  .btn.guardar{background:var(--tinta);margin-bottom:20px;}\n  .btn.guardar:hover{background:#111;}\n  .seccion{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--panel-borde);}\n  .seccion h3{font-size:11px;font-weight:700;margin:0 0 8px;color:var(--verde-cota);}\n  .dato{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:13px;padding:4px 0;border-bottom:1px dotted var(--panel-borde);}\n  .dato span:first-child{color:var(--linea);font-size:11px;}\n  .dato span:last-child{font-weight:700;}\n\n  /* Modulo Relevamiento */\n  #pantalla-lcd{background:var(--lcd-bg);border:3px solid #4a5445;border-radius:4px;padding:12px;font-family:var(--mono);color:var(--lcd-text);box-shadow:inset 0 0 8px rgba(0,0,0,0.2);margin-bottom:16px;}\n  .lcd-fila{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px;font-weight:bold;}\n  .lcd-etiqueta{font-size:11px;opacity:0.8;}\n  .lcd-valor{font-size:16px;letter-spacing:1px;}\n  .lcd-valor.vacio{opacity:0.3;}\n  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;margin-top:10px;}\n  th,td{border:1px solid var(--panel-borde);padding:6px;text-align:right;}\n  th{background:var(--tierra-2);color:var(--tinta);text-align:center;}\n  td:first-child{text-align:center;font-weight:bold;}\n\n  /* Modulo Nivelaci\u00f3n */\n  .fila-pasos, .fila-herramientas{display:flex;gap:5px;margin-bottom:10px;}\n  .btn-paso, .btn-herr{flex:1;padding:8px 4px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;}\n  .btn-paso.activo, .btn-herr.activo{background:var(--naranja);border-color:var(--naranja);color:#fff;}\n  #panel input[type=range], #panel input[type=number]{width:100%;margin:4px 0 10px;padding:6px;font-family:var(--mono);border:1px solid var(--panel-borde);}\n<\/style>\n<\/head>\n<body>\n\n<div id=\"app\">\n  <div id=\"visor-wrap\">\n    <canvas id=\"c\"><\/canvas>\n    <div id=\"mascara-lente\"><\/div>\n    <div id=\"reticula\"><div class=\"linea-r\" id=\"r-h\"><\/div><div class=\"linea-r\" id=\"r-v\"><\/div><div class=\"r-centro\"><\/div><\/div>\n    <div id=\"minimapa\"><canvas id=\"canvas-mini\"><\/canvas><\/div>\n    <div id=\"hud-top\">Arrastra el mouse para orbitar. Us\u00e1 el bot\u00f3n \ud83d\udccd Colocar estaci\u00f3n y hac\u00e9 clic en el terreno. Con el mouse libre orbit\u00e1s la c\u00e1mara.<\/div>\n    <div id=\"controles-fase\">\n      <button class=\"btn-fase\" id=\"btn-colocar\" style=\"background:#e8590c;margin-right:10px;\">\ud83d\udccd Colocar estaci\u00f3n<\/button>\n      <button class=\"btn-fase\" id=\"btn-entrar-ocular\" disabled>\ud83d\udd2d Entrar al Ocular<\/button>\n      <button class=\"btn-fase\" id=\"btn-salir-ocular\" style=\"display:none; background:#b23a2e;\">Desarmar equipo<\/button>\n    <\/div>\n  <\/div>\n\n  <div id=\"panel\">\n    <div id=\"panel-scroll\">\n      <h2 id=\"h-nivel\"><\/h2>\n      <p class=\"sub\" id=\"subtitulo-fase\">Fase 1: Levantamiento Poligonal<\/p>\n\n      <!-- PANEL DE RELEVAMIENTO -->\n      <div id=\"panel-relevamiento\">\n        <div id=\"pantalla-lcd\">\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">AZ<\/span><span class=\"lcd-valor\" id=\"lcd-az\">000\u00b0 00' 00\"<\/span><\/div>\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">V<\/span><span class=\"lcd-valor\" id=\"lcd-v\">090\u00b0 00' 00\"<\/span><\/div>\n          <div style=\"border-bottom:1px solid rgba(0,0,0,0.2);margin:8px 0;\"><\/div>\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">SD<\/span><span class=\"lcd-valor vacio\" id=\"lcd-sd\">----.--- m<\/span><\/div>\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">HD<\/span><span class=\"lcd-valor vacio\" id=\"lcd-hd\">----.--- m<\/span><\/div>\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">VD<\/span><span class=\"lcd-valor vacio\" id=\"lcd-vd\">----.--- m<\/span><\/div>\n        <\/div>\n\n        <button class=\"btn\" id=\"btn-medir\" disabled>\ud83d\udce1 Disparar L\u00e1ser<\/button>\n        <button class=\"btn guardar\" id=\"btn-guardar\" style=\"display:none;\">Guardar V\u00e9rtice<\/button>\n\n        <div class=\"seccion\">\n          <h3>LIBRETA DE CAMPO (<span id=\"contador-libreta\">0<\/span>/<span id=\"tot-lib\"><\/span>)<\/h3>\n          <table id=\"tabla-libreta\">\n            <thead><tr><th>Pto<\/th><th>Azimut<\/th><th>DH(m)<\/th><\/tr><\/thead>\n            <tbody><tr><td colspan=\"3\" style=\"text-align:center;color:#8a7857;\">Sin mediciones<\/td><\/tr><\/tbody>\n          <\/table>\n        <\/div>\n      <div class=\"seccion\"><h3>SUPERFICIE Y PER\u00cdMETRO<\/h3><div class=\"dato\"><span>Per\u00edmetro<\/span><span class=\"g-per\">\u2014<\/span><\/div><div class=\"dato\"><span>Superficie<\/span><span class=\"g-area\">\u2014<\/span><\/div><div class=\"dato\"><span>Superficie (ha)<\/span><span class=\"g-ha\">\u2014<\/span><\/div><\/div>\n      <\/div>\n\n      <!-- PANEL DE NIVELACI\u00d3N -->\n      <div id=\"panel-nivelacion\" style=\"display:none;\">\n<div class=\"seccion\"><h3>SUPERFICIE Y PER\u00cdMETRO<\/h3><div class=\"dato\"><span>Per\u00edmetro<\/span><span class=\"g-per\">\u2014<\/span><\/div><div class=\"dato\"><span>Superficie<\/span><span class=\"g-area\">\u2014<\/span><\/div><div class=\"dato\"><span>Superficie (ha)<\/span><span class=\"g-ha\">\u2014<\/span><\/div><\/div>\n        <button class=\"btn\" id=\"btn-despejar-arboles\" style=\"background:#b23a2e; margin-bottom:15px; font-size:12px;\">\ud83e\ude93 Despejar \u00c1rboles del Pol\u00edgono<\/button>\n        \n        <div class=\"seccion\">\n          <h3>MAQUINARIA (CAVAR / RELLENAR)<\/h3>\n          <div class=\"fila-herramientas\" style=\"margin-bottom:8px;\">\n            <button class=\"btn-herr activo\" data-herr=\"orbitar\" id=\"btn-herr-orbitar\">\ud83e\udded Orbitar<\/button>\n          <\/div>\n          <div class=\"fila-pasos\">\n            <button class=\"btn-paso activo\" data-paso=\"1\">1 m<\/button>\n            <button class=\"btn-paso\" data-paso=\"2\">2 m<\/button>\n            <button class=\"btn-paso\" data-paso=\"5\">5 m<\/button>\n          <\/div>\n          <div class=\"fila-herramientas\">\n            <button class=\"btn-herr\" data-herr=\"cavar\">\u26cf\ufe0f Cavar<\/button>\n            <button class=\"btn-herr\" data-herr=\"rellenar\">\ud83e\uddf1 Relleno<\/button>\n          <\/div>\n          <button class=\"btn-herr\" id=\"btn-herr-aplanar\" data-herr=\"aplanar\" style=\"width:100%;margin-bottom:10px;\">\ud83e\ude9a Motoniveladora (Suavizar)<\/button>\n          \n          <div style=\"display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px;\">\n            <span>Radio de Pincel<\/span><span id=\"d-radio\">7 m<\/span>\n          <\/div>\n          <input type=\"range\" id=\"rango-pincel\" min=\"3\" max=\"15\" value=\"7\">\n          <p style=\"font-size:11px; color:var(--linea); margin-top:10px;\"><b>Tip:<\/b> Usa Click Izquierdo para nivelar. Usa Click Derecho para girar la c\u00e1mara en cualquier momento.<\/p>\n        <\/div>\n\n        <div class=\"seccion\">\n          <h3>CONTROL DE COTA Y VOL\u00daMENES<\/h3>\n          <label style=\"font-size:11px; font-family:var(--mono); color:var(--linea);\">Cota Objetivo (m)<\/label>\n          <input type=\"number\" id=\"input-cota-objetivo\" value=\"0\" step=\"0.5\">\n          <div class=\"dato\"><span>Tierra Extra\u00edda<\/span><span id=\"d-acorte\">0.0 m\u00b3<\/span><\/div>\n          <div class=\"dato\"><span>Tierra Aportada<\/span><span id=\"d-arelleno\">0.0 m\u00b3<\/span><\/div>\n          <div class=\"dato\" style=\"margin-top:10px; border-top:2px solid var(--tinta); padding-top:8px;\">\n            <span style=\"color:var(--tinta); font-weight:bold;\">PRESUPUESTO USADO<\/span><span id=\"d-presupuesto\" style=\"color:var(--naranja); font-weight:bold;\">$0<\/span>\n          <\/div>\n          <p style=\"font-size:10px; color:var(--linea); margin-top:4px;\">(Corte: $1000/m\u00b3 | Relleno: $3500/m\u00b3)<\/p>\n          \n          <button class=\"btn\" id=\"btn-reset-terreno\" style=\"background:#555; margin-top:15px; font-size:12px;\">\u21bb Reiniciar Nivelaci\u00f3n<\/button>\n          <button class=\"btn principal\" id=\"btn-verificar\" style=\"margin-top:10px;\">\u2705 Verificar nivelaci\u00f3n<\/button>\n          <p id=\"msg-nivel\" style=\"font-size:12px;font-weight:700;margin:6px 0;\"><\/p>\n          <button class=\"btn guardar\" id=\"btn-siguiente\" style=\"display:none;\"><\/button>\n        <\/div>\n      <\/div>\n\n    <\/div>\n  <\/div>\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n/* ===================== ESTADO GENERAL ===================== */\nconst NV = window.NIVEL||6;\nlet fase = 'ESTRATEGIA'; \ndocument.getElementById('h-nivel').textContent = NV===5 ? 'NIVEL 5: Levantamiento con Estaci\u00f3n Total' : 'NIVEL 6: Proyecto Integral';\n\n/* ===================== CONFIGURACI\u00d3N 3D Y TERRENO ===================== */\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true});\nrenderer.setPixelRatio(window.devicePixelRatio);\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(0x87CEEB);\n\nconst camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000); \nscene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));\nconst sol = new THREE.DirectionalLight(0xffffff, 0.8);\nsol.position.set(50, 100, 20); scene.add(sol);\n\nconst SIZE = 140, RES = 70;\nconst cellSize = SIZE/RES;\nconst areaCelda = cellSize*cellSize;\nconst geo = new THREE.PlaneGeometry(SIZE, SIZE, RES, RES);\ngeo.rotateX(-Math.PI/2);\nconst pos = geo.attributes.position;\n\nconst idxGrid = [];\nfor(let gz=0; gz<=RES; gz++) idxGrid.push(new Int32Array(RES+1));\nfunction coordAGrilla(x,z){ \n  return [Math.min(RES, Math.max(0,Math.round((x+SIZE/2)/cellSize))), Math.min(RES, Math.max(0,Math.round((z+SIZE/2)/cellSize)))]; \n}\n\nconst heights = new Float32Array(pos.count);\nconst heightsIniciales = new Float32Array(pos.count); \nfunction getAlturaInicial(x,z){ return NV===5 ? Math.sin(x*0.025)*2 + Math.cos(z*0.03)*1.5 : Math.sin(x*0.03)*3 + Math.cos(z*0.04)*2 + Math.sin((x+z)*0.02)*1.5; }\n\nfor(let i=0; i<pos.count; i++){ \n  const x = pos.getX(i), z = pos.getZ(i);\n  heights[i] = getAlturaInicial(x,z);\n  heightsIniciales[i] = heights[i];\n  pos.setY(i, heights[i]);\n  const [gx,gz] = coordAGrilla(x,z);\n  idxGrid[gz][gx] = i;\n}\ngeo.computeVertexNormals();\n\nconst colores = new Float32Array(pos.count*3);\ngeo.setAttribute('color', new THREE.BufferAttribute(colores,3));\nconst rampa = [{t:0.0, c:new THREE.Color(0x24391a)},{t:0.3, c:new THREE.Color(0x4b6b2c)},{t:0.6, c:new THREE.Color(0x8a7a2e)},{t:1.0, c:new THREE.Color(0xcbb98a)}];\nlet hMin = -4, hMax = 6;\nfunction colorPorCota(h){\n  const t = Math.min(1,Math.max(0,(h-hMin)/(hMax-hMin)));\n  for(let i=0;i<rampa.length-1;i++){ \n    if(t>=rampa[i].t && t<=rampa[i+1].t) return rampa[i].c.clone().lerp(rampa[i+1].c, (t-rampa[i].t)/(rampa[i+1].t-rampa[i].t || 1)); \n  }\n  return rampa[rampa.length-1].c;\n}\nfunction actualizarColores(){\n  for(let i=0;i<pos.count;i++){ const c = colorPorCota(heights[i]); colores[i*3]=c.r; colores[i*3+1]=c.g; colores[i*3+2]=c.b; }\n  geo.attributes.color.needsUpdate = true;\n}\nactualizarColores();\nconst terreno = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.9, flatShading:true}));\nscene.add(terreno);\n\nfunction alturaActual(x,z){ const [gx,gz] = coordAGrilla(x,z); return heights[idxGrid[gz][gx]]; }\n\n/* ===================== \u00c1RBOLES Y PRISMAS ===================== */\nconst obstaculosVisuales = [];\nconst arbolesGrupos = [];\nconst posicionesArboles = NV===5 ? [{x:-8,z:-12},{x:14,z:8},{x:-24,z:-2}] : [{x:-15, z:-15}, {x:20, z:5}, {x:5, z:25}, {x:30, z:-20}, {x:0, z:-35}, {x:-25, z:15}, {x:10, z:-10}];\n\nfunction crearArbol(x, z){\n  const y = alturaActual(x,z);\n  const g = new THREE.Group(); g.position.set(x,y,z);\n  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,2.5,6), new THREE.MeshStandardMaterial({color:0x5a4128})); tronco.position.y=1.25;\n  const copa = new THREE.Mesh(new THREE.SphereGeometry(2.5,7,7), new THREE.MeshStandardMaterial({color:0x3f6b2e})); copa.position.y=4;\n  tronco.userData = { tipo: 'obstaculo' }; copa.userData = { tipo: 'obstaculo' };\n  g.add(tronco, copa); scene.add(g);\n  obstaculosVisuales.push(tronco, copa);\n  arbolesGrupos.push(g);\n}\nposicionesArboles.forEach(p => crearArbol(p.x, p.z));\n\nconst altJalon = 1.5;\nconst prismasHitboxes = [];\nconst PRISMAS_6 = [\n  {id: \"P1\", x: -25, z: -35}, {id: \"P2\", x: 15, z: -40}, {id: \"P3\", x: 40, z: -15}, {id: \"P4\", x: 45, z: 15},\n  {id: \"P5\", x: 20, z: 40},   {id: \"P6\", x: -15, z: 35}, {id: \"P7\", x: -40, z: 10}, {id: \"P8\", x: -35, z: -15}\n];\nconst PRISMAS_5 = [{id:\"P1\",x:-22,z:-28},{id:\"P2\",x:26,z:-22},{id:\"P3\",x:30,z:16},{id:\"P4\",x:-4,z:30},{id:\"P5\",x:-30,z:6}];\nconst posicionesPrismas = NV===5 ? PRISMAS_5 : PRISMAS_6;\ndocument.getElementById('tot-lib').textContent = posicionesPrismas.length;\nconst prismasGrupos = [];\nconst MN=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c},o||{}));\nfunction crearPrisma(id, x, z){\n  const y = alturaActual(x,z);\n  const g = new THREE.Group(); g.position.set(x,y,z);\n  const hJ = altJalon-0.23;\n  const jalon = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,hJ,8), MN(0xcc0000)); jalon.position.y = hJ/2; g.add(jalon);\n  const v = new THREE.Group(); v.position.y = altJalon; v.scale.setScalar(2.5); g.add(v);\n  const sh = new THREE.Shape(); [[-.1,.08],[.1,.08],[.1,-.02],[.05,-.08],[-.05,-.08],[-.1,-.02]].forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));\n  v.add(new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.006,bevelEnabled:false}), MN(0xe8400c,{roughness:.5})));\n  const tri=(pts,c,z)=>{ const s=new THREE.Shape(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); const m=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide})); m.position.z=z; v.add(m); };\n  [-1,1].forEach(k=>{ tri([[k*.095,.065],[k*.095,-.03],[k*.052,.017]],0xf3e3e3,.0075); tri([[k*.088,.045],[k*.088,-.012],[k*.062,.017]],0x111111,.0085); });\n  const cil = new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.03,24), MN(0xe8400c,{roughness:.4})); cil.rotation.x=Math.PI/2; cil.position.set(0,.005,.021); v.add(cil);\n  const aro = new THREE.Mesh(new THREE.TorusGeometry(.043,.007,10,32), MN(0xe8400c,{roughness:.4})); aro.position.set(0,.005,.036); v.add(aro);\n  const vid = new THREE.Mesh(new THREE.CircleGeometry(.037,32), MN(0xf4f7fa,{metalness:.7,roughness:.12})); vid.position.set(0,.005,.0355); v.add(vid);\n  [[.074,.0015],[.0015,.074]].forEach(d=>{ const l=new THREE.Mesh(new THREE.BoxGeometry(d[0],d[1],.001),new THREE.MeshBasicMaterial({color:0x333333})); l.position.set(0,.005,.037); v.add(l); });\n  const u = new THREE.Mesh(new THREE.TorusGeometry(.056,.008,8,24,Math.PI), MN(0x151515,{roughness:.6})); u.rotation.z=Math.PI; u.position.set(0,.005,.02); v.add(u);\n  const base = new THREE.Mesh(new THREE.BoxGeometry(.04,.012,.03), MN(0x151515)); base.position.set(0,-.062,.02); v.add(base);\n  const perno = new THREE.Mesh(new THREE.CylinderGeometry(.014,.014,.035,12), MN(0xc9ccd1,{metalness:.9,roughness:.3})); perno.position.set(0,-.079,.02); v.add(perno);\n  const hitbox = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), new THREE.MeshBasicMaterial({visible:false})); hitbox.position.y = altJalon;\n  hitbox.userData = { tipo: 'prisma', id, realX: x, realY: y+altJalon, realZ: z };\n  g.add(hitbox); scene.add(g); prismasHitboxes.push(hitbox); prismasGrupos.push(g);\n}\nfunction orientarPrismas(){ prismasGrupos.forEach(g=>g.lookAt(estX,g.position.y,estZ)); }\nposicionesPrismas.forEach(p => crearPrisma(p.id, p.x, p.z));\n\n/* ===================== TR\u00cdPODE ===================== */\nconst altInstrumento = 1.5;\nconst estacionMarker = new THREE.Group();\nconst pataMat = new THREE.MeshStandardMaterial({color:0xddaa00});\nconst p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.6), pataMat); p1.rotation.z = 0.3; p1.position.set(0.3, 0.7, 0);\nconst p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.6), pataMat); p2.rotation.z = -0.3; p2.position.set(-0.3, 0.7, 0);\nconst p3 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.6), pataMat); p3.rotation.x = 0.3; p3.position.set(0, 0.7, 0.3);\nconst cuerpoET = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({color:0xaaaaaa})); cuerpoET.position.y = 1.4;\nestacionMarker.add(p1, p2, p3, cuerpoET); estacionMarker.visible = false; scene.add(estacionMarker);\nlet estX = 0, estY = 0, estZ = 0;\n\n/* ===================== CONTROLES DE C\u00c1MARA ===================== */\nlet orbRadio = 90, orbAzimut = 0.5, orbPolar = 1.0;\nlet camYaw = 0, camPitch = 0;\nlet isOrbiting = false, isPainting = false;\nlet prevX = 0, prevY = 0;\nconst visorWrap = document.getElementById('visor-wrap');\n\nvisorWrap.addEventListener('contextmenu', e => e.preventDefault());\n\nfunction actualizarCamara(){\n  if(fase === 'ESTRATEGIA' || fase === 'NIVELAR'){\n    camera.position.set(orbRadio*Math.sin(orbPolar)*Math.sin(orbAzimut), orbRadio*Math.cos(orbPolar), orbRadio*Math.sin(orbPolar)*Math.cos(orbAzimut));\n    camera.lookAt(0,0,0);\n  } else if(fase === 'OCULAR'){\n    camera.rotation.set(camPitch, camYaw, 0, 'YXZ');\n  }\n}\n\nvisorWrap.addEventListener('pointe .PI/4, camPitch));\n      actualizarCamara();\n    }\n  }\n\n  if(fase === 'NIVELAR'){\n    const rect = canvas.getBoundingClientRect(); puntero.x = ((e.clientX - rect.left) / rect.width) * 2 - 1; puntero.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;\n    raycaster.setFromCamera(puntero, camera); const hit = raycaster.intersectObject(terreno)[0];\n    \n    if(hit && herramienta !== 'orbitar'){\n      moverAnillo(hit.point.x, hit.point.z);\n      if(isPainting && herramienta === 'aplanar') pintarTerreno(hit.point.x, hit.point.z);\n    } else {\n      if(typeof anilloPincel !== 'undefined') anilloPincel.visible = false;\n    }\n  }\n});\n\nvisorWrap.addEventListener('wheel', e => {\n  if(fase === 'ESTRATEGIA' || fase === 'NIVELAR'){ e.preventDefault(); orbRadio = Math.min(130, Math.max(30, orbRadio + e.deltaY*0.05)); actualizarCamara(); }\n});\n\nconst raycaster = new THREE.Raycaster(); const puntero = new THREE.Vector2();\n\n/* ===================== CAMBIOS DE FASE Y UI ===================== */\ndocument.getElementById('hud-top').style.display = 'block';\ndocument.getElementById('controles-fase').style.display = 'block';\nactualizarCamara();\n\ndocument.getElementById('btn-entrar-ocular').addEventListener('click', () => {\n  fase = 'OCULAR';\n  document.getElementById('hud-top').style.display = 'none';\n  document.getElementById('btn-entrar-ocular').style.display = 'none'; document.getElementById('btn-salir-ocular').style.display = 'inline-block';\n  document.getElementById('btn-medir').disabled = false;\n  estacionMarker.visible = false;\n  camera.fov = 6; camera.updateProjectionMatrix(); camera.position.set(estX, estY + altInstrumento, estZ); camYaw = 0; camPitch = 0; actualizarCamara();\n  document.getElementById('mascara-lente').style.display = 'block'; document.getElementById('reticula').style.display = 'block'; document.getElementById('minimapa').style.display = 'block';\n  visorWrap.style.cursor = 'crosshair';\n});\n\ndocument.getElementById('btn-salir deg){\n  let d = Math.abs(deg); let g = Math.floor(d); let mFloat = (d - g) * 60; let m = Math.floor(mFloat); let s = Math.round((mFloat - m) * 60);\n  if(s === 60){ s = 0; m++; } if(m === 60){ m = 0; g++; }\n  return `${g.toString().padStart(3,'0')}\u00b0 ${m.toString().padStart(2,'0')}' ${s.toString().padStart(2,'0')}\"`;\n}\nfunction actualizarLCD(){\n  if(fase !== 'OCULAR') return;\n  let az = (camYaw * -180 / Math.PI) % 360; if(az < 0) az += 360;\n  let cenit = 90 - (camPitch * 180 / Math.PI);\n  document.getElementById('lcd-az').textContent = formatoGMS(az); document.getElementById('lcd-v').textContent = formatoGMS(cenit);\n}\n\n/* ===================== MINIMAPA RADAR ===================== */\nconst canvasMini = document.getElementById('canvas-mini'); const ctxMini = canvasMini.getContext('2d');\ncanvasMini.width = 180; canvasMini.height = 180;\n\nfunction dibujarMinimapa(){\n  ctxMini.clearRect(0,0,180,180);\n  const scale = 180 / SIZE; const offset = 180 / 2;\n  const toX = (x) => x * scale + offset; const toY = (z) => z * scale + offset;\n\n  ctxMini.strokeStyle = 'rgba(255,255,255,0.1)'; ctxMini.beginPath(); ctxMini.moveTo(90,0); ctxMini.lineTo(90,180); ctxMini.stroke();\n  ctxMini.beginPath(); ctxMini.moveTo(0,90); ctxMini.lineTo(180,90); ctxMini.stroke();\n\n  if(libreta.length === posicionesPrismas.length){\n    ctxMini.fillStyle = 'rgba(92,158,74,0.3)'; ctxMini.strokeStyle = '#5c9e4a'; ctxMini.lineWidth = 2;\n    ctxMini.beginPath();\n    posicionesPrismas.forEach((p, i) => { if(i===0) ctxMini.moveTo(toX(p.x), toY(p.z)); else ctxMini.lineTo(toX(p.x), toY(p.z)); });\n    ctxMini.closePath(); ctxMini.fill(); ctxMini.stroke();\n  }\n\n  ctxMini.fillStyle = '#3f6b2e'; posicionesArboles.forEach(p => { ctxMini.beginPath(); ctxMini.arc(toX(p.x), toY(p.z), 3, 0, Math.PI*2); ctxMini.fill(); });\n\n  posicionesPrismas.forEach(p => {\n    const medido = libreta.find(m => m.id === p.id);\n    ctxMini.fillStyle = medido ? '#5c9e4a' : '#ffd700';\n    ctxMini.beginPath(); ctxMini.arc(toX(p.x), toY(p.z), 4, 0, Math.PI*2); ctxMini.fill();\n    ctxMini.fillStyle = '#fff'; ctxMini.font = '9px monospace'; ctxMini.fillText(p.id, toX(p.x)+5, toY(p.z)+3);\n  });\n\n  ctxMini.fillStyle = '#e8590c'; ctxMini.beginPath(); ctxMini.arc(toX(estX), toY(estZ), 4.5, 0, Math.PI*2); ctxMini.fill();\n  \n  // CORRECCI\u00d3N DEL ESPEJO EN EL MINIMAPA: Usamos -camYaw\n  const myYaw = -camYaw;\n  ctxMini.strokeStyle = 'rgba(255, 50, 50, 0.9)'; ctxMini.lineWidth = 1.5; ctxMini.beginPath(); ctxMini.moveTo(toX(estX), toY(estZ));\n  ctxMini.lineTo(toX(estX + Math.sin(myYaw)*60), toY(estZ - Math.cos(myYaw)*60)); ctxMini.stroke();\n  \n  ctxMini.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctxMini.beginPath(); ctxMini.moveTo(toX(estX), toY(estZ));\n  ctxMini.lineTo(toX(estX + Math.sin(myYaw-0.08)*60), toY(estZ - Math.cos(myYaw-0.08)*60));\n  ctxMini.lineTo(toX(estX + Math.sin(myYaw+0.08)*60), toY(estZ - Math.cos(myYaw+0.08)*60)); ctxMini.closePath(); ctxMini.fill();\n}\n\n/* ===================== MEDICI\u00d3N Y LIBRETA ===================== */\nconst centroPantalla = new THREE.Vector2(0,0);\nlet objetivoEnMira = null, ultimaMedicion = null, libreta = [];\n\nfunction animar(){\n  requestAnimationFrame(animar); actualizarLCD();\n  document.getElementById('btn-colocar').style.display = fase==='ESTRATEGIA' ? 'inline-block' : 'none';\n  if(fase === 'OCULAR'){\n    dibujarMinimapa(); raycaster.setFromCamera(centroPantalla, camera);\n    const intersects = raycaster.intersectObjects([...prismasHitboxes, ...obstaculosVisuales]);\n    if(intersects.length > 0){\n      objetivoEnMira = intersects[0].object;\n      if(objetivoEnMira.userData.tipo === 'prisma') visorWrap.classList.add('fijado'); else visorWrap.classList.remove('fijado');\n    } else { objetivoEnMira = null; visorWrap.classList.remove('fijado'); }\n  }\n  renderer.render(scene, camera);\n}\n\ndocument.getElementById('btn-medir').addEventListener('click', () => {\n  if(!objetivoEnMira){ alert(\"Rebote nulo. ngth){\n    dibujarMinimapa(); \n    setTimeout(()=>{\n      alert(\"\u00a1Levantamiento completado!\\nEl pol\u00edgono se ha cerrado. Procedemos a la fase de nivelaci\u00f3n de suelos.\");\n      activarNivelacion();\n    }, 500);\n  }\n});\n\n/* ===================== HERRAMIENTAS DE NIVELACI\u00d3N ===================== */\nlet herramienta = 'orbitar', pasoMetros = 1;\nlet cotaObj = 0, acumCorte = 0, acumRelleno = 0;\nconst pincel = {radio:7, fuerza:0.45};\n\nconst anilloPincel = new THREE.Mesh(new THREE.RingGeometry(pincel.radio-0.2, pincel.radio, 32), new THREE.MeshBasicMaterial({color:0x9be88a, side:THREE.DoubleSide, depthTest:false})); anilloPincel.rotation.x = -Math.PI/2; anilloPincel.visible = false; scene.add(anilloPincel);\nfunction moverAnillo(x,z){ anilloPincel.position.set(x, alturaActual(x,z)+0.3, z); anilloPincel.visible = true; }\n\ndocument.querySelectorAll('.btn-paso').forEach(b=>{ b.addEventListener('click', ()=>{ pasoMetros = parseFloat(b.dataset.paso); document.querySelectorAll('.btn-paso').forEach(x=>x.classList.remove('activo')); b.classList.add('activo'); }); });\n\ndocument.querySelectorAll('.btn-herr, #btn-herr-aplanar').forEach(b=>{ \n  b.addEventListener('click', e=>{ \n    herramienta = b.dataset.herr || 'aplanar'; \n    document.querySelectorAll('.btn-herr, #btn-herr-aplanar').forEach(x=>x.classList.remove('activo')); \n    e.target.classList.add('activo'); \n    anilloPincel.material.color.setHex(herramienta==='cavar'?0x7fc4ff:(herramienta==='rellenar'?0xffb86b:0x9be88a)); \n  }); \n});\n\ndocument.getElementById('rango-pincel').addEventListener('input', e=>{ pincel.radio = parseFloat(e.target.value); document.getElementById('d-radio').textContent = pincel.radio+' m'; anilloPincel.geometry.dispose(); anilloPincel.geometry = new THREE.RingGeometry(pincel.radio-0.2, pincel.radio, 32); });\ndocument.getElementById('input-cota-objetivo').addEventListener('input', e=>{ cotaObj = parseFloat(e.target.value)||0; });\n\n/* Despejar \u00e1rboles dentro del lote */\ndocument.getElementById('btn-despejar-arboles').addEventListener('click', () => {\n  let desmontados = 0;\n  arbolesGrupos.forEach(g => {\n    if(dentroPoligono(g.position.x, g.position.z)){\n      scene.remove(g);\n      desmontados++;\n    }\n  });\n  if(desmontados > 0) alert(\"Se han despejado \" + desmontados + \" \u00e1rboles del \u00e1rea de obra.\");\n  else alert(\"No hay \u00e1rboles estorbando dentro de las estacas medidas.\");\n});\n\n/* Resetear terreno */\ndocument.getElementById('btn-reset-terreno').addEventListener('click', () => {\n  heights.set(heightsIniciales);\n  for(let i=0; i<pos.count; i++) pos.setY(i, heights[i]);\n  pos.needsUpdate = true;\n  geo.computeVertexNormals();\n  actualizarColores();\n  \n  acumCorte = 0; acumRelleno = 0;\n  document.getElementById('d-acorte').textContent = '0.0 m\u00b3';\n  document.getElementById('d-arelleno').textContent = '0.0 m\u00b3';\n  document.getElementById('d-presupuesto').textContent = '$0';\n});\n\nfunction dentroPoligono(x,z){\n  let dentro=false; const poly = posicionesPrismas;\n  for(let i=0,j=poly.length-1;i<poly.length;j=i++){\n    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;\n    if(((zi>z)!==(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) dentro=!dentro;\n  } return dentro;\n}\n\nfunction pintarTerreno(cx,cz){\n  const [cgx,cgz] = coordAGrilla(cx,cz); const rC = Math.ceil(pincel.radio/cellSize)+1; let aplicada = false;\n  for(let gz=Math.max(0,cgz-rC); gz<=Math.min(RES,cgz+rC); gz++){\n    for(let gx=Math.max(0,cgx-rC); gx<=Math.min(RES,cgx+rC); gx++){\n      const i = idxGrid[gz][gx]; const vx = pos.getX(i), vz = pos.getZ(i);\n      if(!dentroPoligono(vx,vz)) continue; \n      const d = Math.hypot(vx-cx, vz-cz); if(d>pincel.radio) continue;\n      \n      const t = 1-d/pincel.radio, falloff = 0.2 + 0.8*(t*t*(3-2*t)); let nuevo;\n      if(herramienta==='aplanar'){ const dif = cotaObj - heights[i]; nuevo = Math.abs(dif)<0.04 ? cotaObj : heights[i] + dif*pincel.fuerza*falloff; }\n      else { nuevo = heights[i] + (herramienta==='cavar'?-1:1)*pasoMetros*falloff; }\n      \n      const real = nuevo - heights[i]; heights[i] = nuevo; pos.setY(i, nuevo);\n      if(real<0) acumCorte += -real*areaCelda; else acumRelleno += real*areaCelda;\n      aplicada = true;\n    }\n  }\n  if(aplicada){\n    pos.needsUpdate=true; geo.computeVertexNormals(); actualizarColores();\n    document.getElementById('d-acorte').textContent = acumCorte.toFixed(1)+' m\u00b3';\n    document.getElementById('d-arelleno').textContent = acumRelleno.toFixed(1)+' m\u00b3';\n    const presupuesto = (acumCorte * 1000) + (acumRelleno * 3500);\n    document.getElementById('d-presupuesto').textContent = '$'+Math.round(presupuesto).toLocaleString();\n  }\n}\n\n/* ===================== EXTRAS\n/* ===== Estaci\u00f3n: bot\u00f3n propio ===== */\nlet colocando = false;\nfunction actualizarBtnColocar(){\n  const b = document.getElementById('btn-colocar');\n  b.textContent = colocando ? '\u274c Cancelar colocaci\u00f3n' : '\ud83d\udccd Colocar estaci\u00f3n';\n  b.style.background = colocando ? '#b23a2e' : '#e8590c';\n  visorWrap.style.cursor = colocando ? 'crosshair' : 'default';\n  if(fase==='ESTRATEGIA') document.getElementById('hud-top').textContent = colocando ? 'Hac\u00e9 clic en el terreno para plantar la estaci\u00f3n.' : 'Arrastr\u00e1 para orbitar. Us\u00e1 \ud83d\udccd Colocar estaci\u00f3n para ubicar o mover el equipo.';\n}\ndocument.getElementById('btn-colocar').addEventListener('click', ()=>{ if(fase!=='ESTRATEGIA') return; colocando = !colocando; actualizarBtnColocar(); });\n\n/* ===== Superficie y per\u00edmetro (con los datos medidos) ===== */\nfunction mostrarGeom(){\n  const pts = posicionesPrismas.map(p=>libreta.find(m=>m.id===p.id)).filter(Boolean);\n  let a=0, per=0;\n  if(pts.length>=3) pts.forEach((p,i)=>{ const q=pts[(i+1)%pts.length]; a += p.dx*q.dz - q.dx*p.dz; per += Math.hypot(q.dx-p.dx, q.dz-p.dz); });\n  a = Math.abs(a)/2; const ok = pts.length>=3;\n  document.querySelectorAll('.g-per').forEach(e=>e.textContent = ok ? per.toFixed(2)+' m' : '\u2014');\n  document.querySelectorAll('.g-area').forEach(e=>e.textContent = ok ? a.toFixed(2)+' m\u00b2' : '\u2014');\n  document.querySelectorAll('.g-ha').forEach(e=>e.textContent = ok ? (a/10000).toFixed(4)+' ha' : '\u2014');\n}\n\n/* ===== Cota sugerida y verificaci\u00f3n ===== */\nfunction cotaAuto(){\n  let s=0,n=0; for(let i=0;i<pos.count;i++){ if(dentroPoligono(pos.getX(i),pos.getZ(i))){ s+=heights[i]; n++; } }\n  if(n){ cotaObj = Math.round(s/n*2)/2; document.getElementById('input-cota-objetivo').value = cotaObj; }\n}\ndocument.getElementById('btn-verificar').addEventListener('click', ()=>{\n  let mx=0,n=0; for(let i=0;i<pos.count;i++){ if(dentroPoligono(pos.getX(i),pos.getZ(i))){ mx=Math.max(mx,Math.abs(heights[i]-cotaObj)); n++; } }\n  const arb = arbolesGrupos.filter(g=>g.parent && dentroPoligono(g.position.x,g.position.z)).length;\n  const msg = document.getElementById('msg-nivel'), btn = document.getElementById('btn-siguiente');\n  if(n>0 && mx<=0.35 && arb===0){\n    msg.textContent = '\u2705 Terreno nivelado a cota '+cotaObj+' m (desv\u00edo m\u00e1x. '+mx.toFixed(2)+' m).';\n    try{ parent.postMessage({tipo:'completo',nivel:NV},'*'); }catch(e){}\n    if(NV===5){ btn.style.display='block'; btn.textContent='Ir al Nivel 6 \u2192'; btn.onclick=()=>parent.postMessage({tipo:'siguiente',desde:5},'*'); }\n    else { msg.textContent += ' \ud83c\udfc1 \u00a1Completaste los 6 niveles!'; btn.style.display='none'; }\n  } else {\n    const f=[]; if(arb) f.push('despejar '+arb+' \u00e1rbol(es) del pol\u00edgono'); if(mx>0.35) f.push('nivelar (desv\u00edo m\u00e1x. '+mx.toFixed(2)+' m, tolerancia 0.35 m)');\n    msg.textContent = 'Falta: '+f.join(' \u00b7 '); btn.style.display='none';\n  }\n});\n\n/* ===================== RESIZE ===================== */\nfunction resize(){\n  const w = visorWrap.clientWidth, h = visorWrap.clientHeight;\n  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();\n}\nwindow.addEventListener('resize', resize); resize(); animar();\n<\/script>\n<\/body>\n<\/html>";
let unl = location.hash==='#todos' ? 6 : 1, cur=1, n14=0;
const f14=document.getElementById('f14'), f5=document.getElementById('f5'), f6=document.getElementById('f6');
f14.srcdoc=SRC_A;
function tabs(){ const t=document.getElementById('tabs'); t.innerHTML='';
  for(let n=1;n<=6;n++){ const b=document.createElement('button'); b.className='tab'+(n===cur?' act':''); b.textContent=(n>unl?'🔒 ':'')+'Nivel '+n; b.disabled=n>unl; b.onclick=()=>ir(n); t.appendChild(b); } }
function ir(n){ if(n>unl) return; cur=n; tabs();
  [f14,f5,f6].forEach(f=>f.classList.remove('vis'));
  if(n<=4){ f14.classList.add('vis'); if(n14&&n14!==n) f14.contentWindow.postMessage({tipo:'cargar',nivel:n},'*'); }
  else { const f=n===5?f5:f6; if(!f.srcdoc) f.srcdoc=SRC_S.replace('<head>','<head><script>window.NIVEL='+n+'<\/script>'); f.classList.add('vis'); } }
window.addEventListener('message',e=>{ const d=e.data; if(!d||!d.tipo) return;
  if(d.tipo==='completo'&&d.nivel>=unl&&d.nivel<6){ unl=d.nivel+1; tabs(); }
  else if(d.tipo==='siguiente'){ unl=Math.max(unl,d.desde+1); ir(d.desde+1); }
  else if(d.tipo==='nivelActual'){ n14=d.n; if(cur<=4){ cur=d.n; tabs(); } } });
tabs(); ir(1);
