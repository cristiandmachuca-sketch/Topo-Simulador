rrado ? 'Poligonal cerrada. Med\u00ed cada lado en la libreta \u2192' : 'Clic sobre el terreno para clavar una estaca. Arrastr\u00e1 una estaca ya clavada para reubicarla.',\n  obstaculos: 'Arrastr\u00e1 un \u00e1rbol o roca fuera del l\u00edmite del terreno para retirarlo del levantamiento.',\n  lote: 'Arrastr\u00e1 el rect\u00e1ngulo naranja para elegir d\u00f3nde ubicar el lote. Cuando est\u00e9s conforme, fijalo desde el panel.',\n  nivelar: herramienta==='aplanar'\n    ? 'APLANAR: manten\u00e9 presionado y arrastr\u00e1 para emparejar hacia la cota objetivo.'\n    : `${herramienta==='cavar'?'CAVAR':'RELLENAR'} ${pasoMetros} m (${categoriaHerramienta==='gruesa'?'pala gruesa, imprecisa':'afinadora fina, exacta'}): un clic = una pasada.`,\n  calle: 'Clic sobre el terreno para agregar un punto de la calle. Verde = pendiente OK, rojo = supera el m\u00e1ximo permitido.'\n});\ndocument.querySelectorAll('.btn-modo').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    estado = null;\n    modo = b.dataset.modo;\n    document.querySelectorAll('.btn-modo').forEach(x=>x.classList.remove('activo'));\n    b.classList.add('activo');\n    canvas.className = 'modo-'+modo;\n    document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n    if(modo==='nivelar'){\n      document.getElementById('barra-progreso-wrap').style.display='block';\n      refrescarAyudasNivelacion();\n    } else {\n      document.getElementById('barra-progreso-wrap').style.display='none';\n      mapaCalorGrupo.clear();\n    }\n  });\n});\n\n/* ===================== LEVANTAMIENTO DE LA POLIGONAL ===================== */\nconst raycaster = new THREE.Raycaster();\nconst puntero = new THREE.Vector2();\nlet puntos = [], marcadores = [];\nconst lineaGrupo = new THREE.Group(); scene.add(lineaGrupo);\nlet cerrado = false;\nlet ladosMedidos = new Set();\n\nfunction coordsNormalizadas(e){\n  const rect = canvas.getBoundingClientRect();\n  puntero.x = ((e.clientX-rect.left)/rect.width)*2-1;\n  puntero.y = -((e.clientY-rect.top)/rect.height)*2+1;\n}\nfunction agregarPunto(p){\n  puntos.push(p);\n  const marc = new THREE.Mesh(new THREE.SphereGeometry(0.55,12,12), new THREE.MeshStandardMaterial({color:0xe8590c}));\n  marc.position.set(p.x, p.y+0.15, p.z);\n  scene.add(marc); marcadores.push(marc);\n  redibujarLineas();\n  actualizarPanel();\n}\nfunction redibujarLineas(){\n  lineaGrupo.clear();\n  const pts = puntos.map(p=>new THREE.Vector3(p.x,p.y+0.2,p.z));\n  if(cerrado && pts.length>2) pts.push(pts[0].clone());\n  if(pts.length>=2){\n    const g = new THREE.BufferGeometry().setFromPoints(pts);\n    lineaGrupo.add(new THREE.Line(g, new THREE.LineBasicMaterial({color:0xe8590c})));\n  }\n}\nfunction deshacer(){\n  if(cerrado || puntos.length===0) return;\n  puntos.pop();\n  scene.remove(marcadores.pop());\n  redibujarLineas();\n  actualizarPanel();\n}\nfunction reiniciarLevantamiento(){\n  puntos=[]; cerrado=false; ladosMedidos=new Set(); loteEnProgreso=false;\n  marcadores.forEach(m=>scene.remove(m)); marcadores=[];\n  lineaGrupo.clear();\n  document.getElementById('seccion-lados').style.display='none';\n  document.getElementById('seccion-area').style.display='none';\n  document.getElementById('btn-calc-objetivo').disabled = true;\n  document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n  actualizarPanel();\n}\nfunction cerrarPoligonal(){\n  if(puntos.length<3) return;\n  cerrado = true;\n  redibujarLineas();\n  generarTablaLados();\n  document.getElementById('seccion-lados').style.display='block';\n  document.getElementById('seccion-area').style.display='block';\n  document.getElementById('btn-calc-objetivo').disabled = false;\n  document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n  actualizarPanel();\n}\n\nfunction distanciaHorizontal(a,b){ return Math.hypot(a.x-b.x, a.z-b.z); }\nfunction calcularPerimetro(){\n  let per=0; const n=puntos.length;\n  for(let i=0;i<n;i++) per += distanciaHorizontal(puntos[i], puntos[(i+1)%n]);\n  return per;\n}\nfunction calcularAreaGauss(pts){\n  let suma=0; const n=pts.length;\n  for(let i=0;i<n;i++){ const a=pts[i], b=pts[(i+1)%n]; suma += (a.x*b.z - b.x*a.z); }\n  return Math.abs(suma)/2;\n}\nfunction pendienteMedia(){\n  const n = puntos.length; if(n<2) return 0;\n  let suma=0, tramos=0;\n  for(let i=0;i<n;i++){\n    const a=puntos[i], b=puntos[(i+1)%n];\n    const dist = distanciaHorizontal(a,b);\n    if(dist>0.01){ suma += (Math.abs(b.y-a.y)/dist)*100; tramos++; }\n  }\n  return tramos? suma/tramos : 0;\n}\nfunction dentroPoligono(x,z,poly){\n  let dentro=false;\n  for(let i=0,j=poly.length-1;i<poly.length;j=i++){\n    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;\n    if(((zi>z)!==(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) dentro=!dentro;\n  }\n  return dentro;\n}\n\nfunction generarTablaLados(){\n  const n = puntos.length;\n  let html='';\n  for(let i=0;i<n;i++){\n    const j=(i+1)%n;\n    html += `<li><span>P${i+1} \u2192 P${j+1}<\/span><button class=\"btn-medir\" data-i=\"${i}\">Medir<\/button><span class=\"valor-lado\" id=\"lado-${i}\">\u2014<\/span><\/li>`;\n  }\n  document.getElementById('lista-lados').innerHTML = html;\n  document.querySelectorAll('.btn-medir').forEach(b=>{\n    b.addEventListener('click', ()=>medirLado(parseInt(b.dataset.i)));\n  });\n}\nfunction medirLado(i){\n  if(ladosMedidos.has(i)) return;\n  const n=puntos.length, j=(i+1)%n;\n  const d = distanciaHorizontal(puntos[i],puntos[j]);\n  document.getElementById('lado-'+i).textContent = d.toFixed(2)+' m';\n  ladosMedidos.add(i);\n  const btn = document.querySelector(`.btn-medir[data-i=\"${i}\"]`);\n  if(btn){ btn.disabled=true; btn.textContent='\u2713'; }\n  document.getElementById('d-perim').textContent = ladosMedidos.size===n ? calcularPerimetro().toFixed(2)+' m' : `${ladosMedidos.size}/${n} lados medidos`;\n  document.getElementById('btn-calc-area').disabled = ladosMedidos.size<n;\n}\ndocument.getElementById('btn-calc-area').addEventListener('click', ()=>{\n  const area = calcularAreaGauss(puntos);\n  document.getElementById('d-area').textContent = area.toFixed(2)+' m\u00b2';\n  const cotas = puntos.map(p=>p.y);\n  const min=Math.min(...cotas), max=Math.max(...cotas);\n  document.getElementById('d-cotamin').textContent = min.toFixed(2)+' m';\n  document.getElementById('d-cotamax').textContent = max.toFixed(2)+' m';\n  document.getElementById('d-desnivel').textContent = (max-min).toFixed(2)+' m';\n  document.getElementById('d-pend').textContent = pendienteMedia().toFixed(1)+' %';\n  if(loteEnProgreso){\n    if(areaObjetivoActiva){\n      const desvio = Math.abs(area-areaObjetivoValor)/areaObjetivoValor;\n      if(desvio > toleranciaArea){\n        const aviso = document.getElementById('aviso-lote');\n        aviso.textContent = `El \u00e1rea qued\u00f3 en ${area.toFixed(1)} m\u00b2, pero el objetivo era ${areaObjetivoValor} m\u00b2 (\u00b1${(toleranciaArea*100).toFixed(0)}%). Reinici\u00e1 el levantamiento (secci\u00f3n V\u00c9RTICES) y ajust\u00e1 el pol\u00edgono.`;\n        aviso.style.display='block';\n        return;\n      }\n    }\n    guardarLoteActual();\n  }\n});\n\nlet ultimaCotaProyecto = null;\ndocument.getElementById('btn-calc-objetivo').addEventListener('click', ()=>{\n  if(!cerrado || puntos.length<3) return;\n  const cotaProyecto = puntos.reduce((s,p)=>s+p.y,0)/puntos.length;\n  ultimaCotaProyecto = cotaProyecto;\n  let corte=0, relleno=0;\n  for(let gx=0; gx<RES; gx++){\n    for(let gz=0; gz<RES; gz++){\n      const x = -SIZE/2 + cellSize*(gx+0.5);\n      const z = -SIZE/2 + cellSize*(gz+0.5);\n      if(!dentroPoligono(x,z,puntos)) continue;\n      const diff = alturaActual(x,z) - cotaProyecto;\n      if(diff>0) corte += diff*areaCelda; else relleno += -diff*areaCelda;\n    }\n  }\n  document.getElementById('d-cotaproy').textContent = cotaProyecto.toFixed(2)+' m';\n  document.getElementById('d-corte').textContent = corte.toFixed(1)+' m\u00b3';\n  document.getElementById('d-relleno').textContent = relleno.toFixed(1)+' m\u00b3';\n  const balance = corte-relleno;\n  document.getElementById('d-balance').textContent = Math.abs(balance)<1 ? 'compensado \u2248 0 m\u00b3' : (balance>0? `sobra ${balance.toFixed(1)} m\u00b3 (retirar)` : `falta ${(-balance).toFixed(1)} m\u00b3 (aportar)`);\n});\ndocument.getElementById('btn-usar-cota-proyecto').addEventListener('click', ()=>{\n  if(ultimaCotaProyecto===null) return;\n  cotaObjetivo = ultimaCotaProyecto;\n  document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n  actualizarCurvaObjetivo();\n  sincronizarCotaConLoteSeleccionado();\n});\n// si est\u00e1s editando la cota de un lote YA guardado (no uno nuevo en curso), guarda el cambio en ese lote\nfunction sincronizarCotaConLoteSeleccionado(){\n  if(!loteEnProgreso && loteSeleccionadoIdx>=0 && lotesFijados[loteSeleccionadoIdx]){\n    lotesFijados[loteSeleccionadoIdx].cotaObjetivo = cotaObjetivo;\n    refrescarAyudasNivelacion();\n  }\n}\n\nfunction actualizarPanel(){\n  const lista = document.getElementById('lista-puntos');\n  lista.innerHTML = puntos.length===0\n    ? '<li style=\"color:#a99a6f\">\u2014 sin estacas clavadas \u2014<\/li>'\n    : puntos.map((p,i)=>`<li><b>P${i+1}<\/b> &nbsp;x=${p.x.toFixed(1)}  z=${p.z.toFixed(1)}  cota=${p.y.toFixed(2)}<\/li>`).join('');\n  document.getElementById('btn-deshacer').disabled = cerrado || puntos.length===0;\n  document.getElementById('btn-cerrar').disabled = cerrado || puntos.length<3;\n  const filaArea = document.getElementById('fila-area-parcial');\n  if(areaObjetivoActiva && puntos.length>=3 && !cerrado){\n    filaArea.style.display='flex';\n    document.getElementById('d-area-parcial').textContent = `${calcularAreaGauss(puntos).toFixed(1)} / ${areaObjetivoValor} m\u00b2`;\n  } else {\n    filaArea.style.display='none';\n  }\n}\ndocument.getElementById('btn-deshacer').addEventListener('click', deshacer);\ndocument.getElementById('btn-cerrar').addEventListener('click', cerrarPoligonal);\ndocument.getElementById('btn-reiniciar').addEventListener('click', reiniciarLevantamiento);\n\nfunction actualizarPanelObstaculos(){\n  document.getElementById('d-obst-contador').textContent = `${obstaculosObjetos.length}/${obstaculosDefIniciales.length} en el predio`;\n}\ndocument.getElementById('btn-restaurar-obst').addEventListener('click', generarObstaculos);\n\nfunction dentroDeAlgunLote(x,z){\n  return lotesFijados.some(l=>dentroPoligono(x,z,l.corners));\n}\n\n/* ===================== MAPA DE CALOR + PROGRESO DE NIVELACI\u00d3N EN VIVO ===================== */\nconst mapaCalorGrupo = new THREE.Group(); scene.add(mapaCalorGrupo);\nfunction generarMapaCalor(){\n  mapaCalorGrupo.clear();\n  return; // sin capa de color sobre los lotes: se ve solo la tierra\n  lotesFijados.forEach(l=>{\n    const b = l.bbox;\n    const anchoB = b.maxX-b.minX, largoB = b.maxZ-b.minZ;\n    if(anchoB<=0 || largoB<=0) return;\n    const resU = 22;\n    const resV = Math.min(60, Math.max(6, Math.round(resU*(largoB/anchoB))));\n    const verts=[], colors=[], indices=[];\n    for(let j=0;j<=resV;j++){\n      for(let i=0;i<=resU;i++){\n        const x = b.minX + anchoB*(i/resU);\n        const z = b.minZ + largoB*(j/resV);\n        const h = alturaActual(x,z);\n        verts.push(x, h+0.12, z);\n        const diff = h - l.cotaObjetivo;\n        const mag = Math.min(1, Math.abs(diff)/2.5);\n        if(diff>0){ colors.push(1, 1-mag*0.85, 1-mag*0.85); }       // rojo = hay que cortar\n        else { colors.push(1-mag*0.85, 1-mag*0.55, 1); }             // azul = hay que rellenar\n      }\n    }\n    for(let j=0;j<resV;j++){\n      for(let i=0;i<resU;i++){\n        const a=j*(resU+1)+i, bI=a+1, c=a+resU+1, d=c+1;\n        indices.push(a,c,bI, bI,c,d);\n      }\n    }\n    const g = new THREE.BufferGeometry();\n    g.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));\n    g.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));\n    g.setIndex(indices);\n    mapaCalorGrupo.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity:0.55, side:THREE.DoubleSide, depthWrite:false})));\n  });\n}\nfunction calcularProgresoNivelacion(){\n  if(lotesFijados.length===0) return null;\n  let totalCeldas=0, totalOk=0;\n  lotesFijados.forEach(l=>{\n    for(let gx=0; gx<=RES; gx++){\n      for(let gz=0; gz<=RES; gz++){\n        const i = idxGrid[gz][gx];\n        const x = pos.getX(i), z = pos.getZ(i);\n        if(!dentroPoligono(x,z,l.corners)) continue;\n        totalCeldas++;\n        if(Math.abs(heights[i]-l.cotaObjetivo)<=toleranciaNivel) totalOk++;\n      }\n    }\n  });\n  return totalCeldas>0 ? totalOk/totalCeldas : null;\n}\nfunction refrescarAyudasNivelacion(){\n  if(modo!=='nivelar') return;\n  generarMapaCalor();\n  const p = calcularProgresoNivelacion();\n  const wrap = document.getElementById('barra-progreso-wrap');\n  if(p===null){\n    document.getElementById('txt-progreso-nivel').textContent = 'fij\u00e1 un lote primero';\n    document.getElementById('barra-progreso-relleno').style.width='0%';\n  } else {\n    document.getElementById('txt-progreso-nivel').textContent = Math.round(p*100)+'%';\n    document.getElementById('barra-progreso-relleno').style.width = (p*100)+'%';\n  }\n}\nconst pincel = {radio:7, fuerza:0.45};\nlet acumCorte=0, acumRelleno=0;\nlet herramienta = 'aplanar';   // 'cavar' | 'rellenar' | 'aplanar'\nlet pasoMetros = 1;          // metros que mueve cada pasada de cavar/rellenar\n\n/* anillo que muestra el \u00e1rea que abarca el pincel */\nconst anilloPincel = new THREE.Mesh(\n  new THREE.RingGeometry(pincel.radio-0.25, pincel.radio, 48),\n  new THREE.MeshBasicMaterial({color:0xffe9c9, transparent:true, opacity:0.75, side:THREE.DoubleSide, depthTest:false})\n);\nanilloPincel.rotation.x = -Math.PI/2;\nanilloPincel.renderOrder = 999;\nanilloPincel.visible = false;\nscene.add(anilloPincel);\n\nconst discoPincel = new THREE.Mesh(\n  new THREE.CircleGeometry(pincel.radio, 48),\n  new THREE.MeshBasicMaterial({color:0xffe9c9, transparent:true, opacity:0.16, side:THREE.DoubleSide, depthTest:false})\n);\ndiscoPincel.rotation.x = -Math.PI/2;\ndiscoPincel.renderOrder = 998;\ndiscoPincel.visible = false;\nscene.add(discoPincel);\n\nfunction refrescarGeometriaAnillo(){\n  anilloPincel.geometry.dispose();\n  anilloPincel.geometry = new THREE.RingGeometry(pincel.radio-0.25, pincel.radio, 48);\n  discoPincel.geometry.dispose();\n  discoPincel.geometry = new THREE.CircleGeometry(pincel.radio, 48);\n}\nfunction colorAnilloSegunHerramienta(){\n  const c = herramienta==='cavar' ? 0x7fc4ff : (herramienta==='rellenar' ? 0xffb86b : 0x9be88a);\n  anilloPincel.material.color.setHex(c);\n  discoPincel.material.color.setHex(c);\n}\nfunction moverAnillo(x,z){\n  const y = alturaActual(x,z)+0.25;\n  anilloPincel.position.set(x,y,z);\n  discoPincel.position.set(x,y,z);\n  anilloPincel.visible = true;\n  discoPincel.visible = true;\n}\nfunction ocultarAnillo(){\n  anilloPincel.visible = false;\n  discoPincel.visible = false;\n}\n\nconst pasosPorCategoria = { gruesa:[2,5,10], fina:[0.1,0.25,0.5,1] };\nlet categoriaHerramienta = 'gruesa';\nfunction renderPasos(){\n  const cont = document.getElementById('fila-pasos');\n  const pasos = pasosPorCategoria[categoriaHerramienta];\n  cont.innerHTML = pasos.map((p,i)=>`<button class=\"btn-paso ${i===0?'activo':''}\" data-paso=\"${p}\">${p} m<\/button>`).join('');\n  pasoMetros = pasos[0];\n  cont.querySelectorAll('.btn-paso').forEach(b=>{\n    b.addEventListener('click', ()=>{\n      pasoMetros = parseFloat(b.dataset.paso);\n      cont.querySelectorAll('.btn-paso').forEach(x=>x.classList.remove('activo'));\n      b.classList.add('activo');\n    });\n  });\n}\ndocument.querySelectorAll('.btn-cat[data-cat]').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    categoriaHerramienta = b.dataset.cat;\n    document.querySelectorAll('#fila-categoria .btn-cat').forEach(x=>x.classList.remove('activo'));\n    b.classList.add('activo');\n    renderPasos();\n    const rango = document.getElementById('rango-pincel');\n    if(categoriaHerramienta==='gruesa'){\n      rango.min=6; rango.max=16;\n      if(pincel.radio<6){ pincel.radio=8; rango.value=8; }\n    } else {\n      rango.min=2; rango.max=8;\n      if(pincel.radio>8){ pincel.radio=5; rango.value=5; }\n    }\n    document.getElementById('d-radio').textContent = pincel.radio+' m';\n    refrescarGeometriaAnillo();\n    document.getElementById('nota-categoria').innerHTML = categoriaHerramienta==='gruesa'\n      ? 'La pala gruesa mueve mucho por pasada pero es <b>imprecisa<\/b> (\u00b115%) \u2014 ideal para el desbaste grueso. Pas\u00e1 a la afinadora para el ajuste fino y exacto.'\n      : 'La afinadora mueve poco por pasada pero es <b>exacta<\/b> \u2014 ideal para el terminado fino despu\u00e9s del desbaste grueso.';\n  });\n});\nrenderPasos();\ndocument.querySelectorAll('.btn-herr').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    herramienta = b.dataset.herr;\n    document.querySelectorAll('.btn-herr').forEach(x=>x.classList.remove('activo'));\n    document.getElementById('btn-herr-aplanar').classList.remove('activo');\n    b.classList.add('activo');\n    colorAnilloSegunHerramienta();\n    document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n  });\n});\ndocument.getElementById('btn-herr-aplanar').addEventListener('click', e=>{\n  herramienta = 'aplanar';\n  document.querySelectorAll('.btn-herr').forEach(x=>x.classList.remove('activo'));\n  e.target.classList.add('activo');\n  colorAnilloSegunHerramienta();\n  document.getElementById('banner-instrucciones').textContent = textosModo()[modo];\n});\n\ndocument.getElementById('input-cota-objetivo').addEventListener('input', e=>{\n  cotaObjetivo = parseFloat(e.target.value)||0;\n  actualizarCurvaObjetivo();\n  refrescarAyudasNivelacion();\n  sincronizarCotaConLoteSeleccionado();\n});\ndocument.getElementById('btn-subir-curva').addEventListener('click', ()=>{\n  cotaObjetivo += intervaloCurvas;\n  document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n  actualizarCurvaObjetivo();\n  refrescarAyudasNivelacion();\n  sincronizarCotaConLoteSeleccionado();\n});\ndocument.getElementById('btn-bajar-curva').addEventListener('click', ()=>{\n  cotaObjetivo -= intervaloCurvas;\n  document.getElementById('input-cota-objetivo').value = cotaObjetivo.toFixed(2);\n  actualizarCurvaObjetivo();\n  refrescarAyudasNivelacion();\n  sincronizarCotaConLoteSeleccionado();\n});\ndocument.getElementById('btn-toggle-curvas').addEventListener('click', e=>{\n  curvasVisibles = !curvasVisibles;\n  curvasGrupo.visible = curvasVisibles;\n  curvaObjetivoGrupo.visible = curvasVisibles;\n  e.target.textContent = curvasVisibles ? 'Ocultar curvas de nivel' : 'Mostrar curvas de nivel';\n});\ndocument.getElementById('rango-pincel').addEventListener('input', e=>{\n  pincel.radio = parseFloat(e.target.value);\n  document.getElementById('d-radio').textContent = pincel.radio+' m';\n  refrescarGeometriaAnillo();\n});\ndocument.getElementById('btn-reset-terreno').addEventListener('click', ()=>{\n  heights.set(heightsIniciales);\n  for(let i=0;i<pos.count;i++){\n    pos.setY(i, heights[i]);\n    const c = colorPorCota(heights[i]);\n    colores[i*3]=c.r; colores[i*3+1]=c.g; colores[i*3+2]=c.b;\n  }\n  pos.needsUpdate=true; geo.attributes.color.needsUpdate=true;\n  geo.computeVertexNormals(); geo.computeBoundingSphere();\n  acumCorte=0; acumRelleno=0;\n  document.getElementById('d-acorte').textContent='0.0 m\u00b3';\n  document.getElementById('d-arelleno').textContent='0.0 m\u00b3';\n  generarCurvasNivel();\n});\n\nfunction recolorearTerreno(){\n  for(let i=0;i<pos.count;i++){ const c=colorPorCota(heights[i]); colores[i*3]=c.r; colores[i*3+1]=c.g; colores[i*3+2]=c.b; }\n  geo.attributes.color.needsUpdate=true;\n}\nfunction pintarTerreno(cx,cz){\n  const [cgx,cgz] = coordAGrilla(cx,cz);\n  const radioCeldas = Math.ceil(pincel.radio/cellSize)+1;\n  let algunaAplicada = false, bloqueadas = 0;\n  for(let gz=Math.max(0,cgz-radioCeldas); gz<=Math.min(RES,cgz+radioCeldas); gz++){\n    for(let gx=Math.max(0,cgx-radioCeldas); gx<=Math.min(RES,cgx+radioCeldas); gx++){\n      const i = idxGrid[gz][gx];\n      const vx = pos.getX(i), vz = pos.getZ(i);\n      const loteDelPunto = lotesFijados.find(l=>dentroPoligono(vx,vz,l.corners));\n      if(!loteDelPunto) continue;\n      const d = Math.hypot(vx-cx, vz-cz);\n      if(d>pincel.radio) continue;\n      if(casaBloqueaVertice(vx,vz)){ bloqueadas++; continue; }\n      algunaAplicada = true;\n      const t = 1 - d/pincel.radio;\n      const falloff = 0.2 + 0.8*(t*t*(3-2*t));\n      let nuevo;\n      if(herramienta==='aplanar'){\n        const objetivoLocal = cotaEn(loteDelPunto,vx,vz);\n        const diff = objetivoLocal - heights[i];\n        nuevo = Math.abs(diff) < 0.04 ? objetivoLocal : heights[i] + diff*pincel.fuerza*falloff;\n      } else {\n        const signo = herramienta==='cavar' ? -1 : 1;\n        const ruido = categoriaHerramienta==='gruesa' ? (0.85 + Math.random()*0.3) : 1;\n        nuevo = heights[i] + signo*pasoMetros*falloff*ruido;\n      }\n      const real = nuevo - heights[i];\n      heights[i] = nuevo;\n      pos.setY(i, nuevo);\n      if(real<0) acumCorte += -real*areaCelda; else acumRelleno += real*areaCelda;\n    }\n  }\n  if(algunaAplicada){ talud(); recolorearTerreno(); if(casaObj) evaluarCasa(); }\n  pos.needsUpdate=true; geo.attributes.color.needsUpdate=true;\n  geo.computeVertexNormals(); geo.computeBoundingSphere();\n  document.getElementById('d-acorte').textContent = acumCorte.toFixed(1)+' m\u00b3';\n  document.getElementById('d-arelleno').textContent = acumRelleno.toFixed(1)+' m\u00b3';\n  if(!algunaAplicada){\n    document.getElementById('banner-instrucciones').textContent = bloqueadas>0 ? 'El terreno bajo la casa fijada est\u00e1 bloqueado. Us\u00e1 \"Quitar casa\" si necesit\u00e1s modificarlo.' : lotesFijados.length===0\n      ? 'Primero fij\u00e1 un lote \u2014 solo se puede nivelar dentro de un lote ya ubicado.'\n      : 'Ah\u00ed afuera no hay ning\u00fan lote fijado. Movete sobre la zona del lote para nivelar.';\n  }\n}\nfunction aplicarPincelDesdeEvento(e){\n  coordsNormalizadas(e);\n  raycaster.setFromCamera(puntero,camera);\n  const hit = raycaster.intersectObject(terreno)[0];\n  if(!hit) return;\n  if(dentroRestriccion(hit.point.x, hit.point.z)){\n    document.getElementById('banner-instrucciones').textContent = '\u26d4 No se puede mover suelo dentro de la servidumbre.';\n    return;\n  }\n  pintarTerreno(hit.point.x, hit.point.z);\n}\n\n\n/* ===== Cota recomendada: cumple cord\u00f3n y acceso con el m\u00ednimo movimiento de tierra ===== */\nfunction aplicarCotaRecomendada(){\n  const msg=document.getElementById('msg-cota-reco'), fail=t=>{ msg.textContent=t; msg.style.color='#b23a2e'; };\n  const enCurso=loteEnProgreso, l=enCurso?{corners:puntos}:lotesFijados[loteSeleccionadoIdx];\n  if(!l||!l.corners||l.corners.length<3) return fail('Primero ubic\\u00e1 o seleccion\\u00e1 un lote.');\n  const cor=cordonLote(l); if(cor===null) return fail('No pude medir el cord\\u00f3n frente a este lote.');\n  const cota=Math.ceil((cor+0.05)*100)/100;\n  cotaObjetivo=cota; document.getElementById('input-cota-objetivo').value=cota.toFixed(2); actualizarCurvaObjetivo();\n  const ip=document.getElementById('input-pend'), pv=parseFloat(ip.value);\n  if(enCurso){ if(!(pv>=1&&pv<=2.5)) ip.value=1.5; }\n  else { l.cotaObjetivo=cota; if(!(l.pend>=1&&l.pend<=2.5)) l.pend=1.5; ip.value=l.pend; refrescarAyudasNivelacion(); }\n  msg.textContent='\\u2713 Cota objetivo '+cota.toFixed(2)+' m (cord\\u00f3n '+cor.toFixed(2)+' m) y pendiente '+ip.value+' %. Ahora nivel\\u00e1 el lote con \"Aplanar\".';\n  msg.style.color='#2e7d32';\n}\ndocument.getElementById('btn-cota-reco').addEventListener('click', aplicarCotaRecomendada);\n\n/* ===== Nivelar franja frontal (automatico) ===== */\nconst PROF_FRANJA_FRENTE=5;\nfunction nivelarFranjaFrontal(){\n  const msg=document.getElementById('msg-frente');\n  const fail=t=>{ msg.textContent=t; msg.style.color='#b23a2e'; };\n  const l=lotesFijados[loteSeleccionadoIdx];\n  if(!l) return fail('Primero fij\\u00e1 y seleccion\\u00e1 un lote.');\n  if(!calleProy) return fail('Este nivel no tiene calle de referencia.');\n  const C=l.corners; let fi=0,best=1e9;\n  C.forEach((p,i)=>{ const q=C[(i+1)%C.length], d=Math.abs(((p.x+q.x)/2-calleProy.px)*calleProy.nx+((p.z+q.z)/2-calleProy.pz)*calleProy.nz); if(d<best){best=d;fi=i;} });\n  const p=C[fi], q=C[(fi+1)%C.length], Lf=Math.hypot(q.x-p.x,q.z-p.z);\n  const cx=C.reduce((s,a)=>s+a.x,0)/C.length, cz=C.reduce((s,a)=>s+a.z,0)/C.length;\n  const sg=Math.sign((q.x-p.x)*(cz-p.z)-(q.z-p.z)*(cx-p.x))||1;\n  let n=0;\n  for(let gz=0;gz<=RES;gz++) for(let gx=0;gx<=RES;gx++){\n    const i=idxGrid[gz][gx], vx=pos.getX(i), vz=pos.getZ(i);\n    if(!dentroPoligono(vx,vz,C) || dentroRestriccion(vx,vz) || casaBloqueaVertice(vx,vz)) continue;\n    const dist=sg*((q.x-p.x)*(vz-p.z)-(q.z-p.z)*(vx-p.x))/Lf;\n    if(dist>PROF_FRANJA_FRENTE) continue;\n    const nuevo=cotaEn(l,vx,vz), real=nuevo-heights[i];\n    if(Math.abs(real)<1e-6) continue;\n    heights[i]=nuevo; pos.setY(i,nuevo); n++;\n    if(real<0) acumCorte+=-real*areaCelda; else acumRelleno+=real*areaCelda;\n  }\n  talud(); recolorearTerreno();\n  pos.needsUpdate=true; geo.computeVertexNormals(); geo.computeBoundingSphere();\n  document.getElementById('d-acorte').textContent=acumCorte.toFixed(1)+' m\\u00b3';\n  document.getElementById('d-arelleno').textContent=acumRelleno.toFixed(1)+' m\\u00b3';\n  generarCurvasNivel(); refrescarAyudasNivelacion();\n  const mx=(p.x+q.x)/2, mz=(p.z+q.z)/2, cota=cotaEn(l,mx,mz), cor=cordonLote(l);\n  let t='\\u2713 Franja frontal ('+PROF_FRANJA_FRENTE+' m) nivelada a cota '+cota.toFixed(2)+' m';\n  let ok=true;\n  if(cor!==null){ t+=' \\u00b7 cord\\u00f3n '+cor.toFixed(2)+' m'; if(cota<cor-1e-6){ ok=false; t+=' \\u2192 la cota del lote queda por debajo del cord\\u00f3n: sub\\u00ed la cota objetivo y volv\\u00e9 a nivelar'; } }\n  if(n===0 && ok) t='\\u2713 La franja frontal ya estaba nivelada a cota '+cota.toFixed(2)+' m';\n  msg.textContent=t; msg.style.color=ok?'#2e7d32':'#b9770e';\n  if(casaObj) evaluarCasa();\n}\ndocument.getElementById('btn-nivelar-frente').addEventListener('click', nivelarFranjaFrontal);\n\n/* ===================== CALLE DE ACCESO ===================== */\nlet callePuntos = [];\nlet calleMarcadores = [];\nconst calleLineaGrupo = new THREE.Group(); scene.add(calleLineaGrupo);\nconst pendienteMaximaCalle = 10; // % m\u00e1ximo admitido por tramo\nlet calleOk = false;\ndocument.getElementById('d-pendiente-max-calle').textContent = pendienteMaximaCalle+'%';\n\nfunction redibujarCalle(){\n  calleLineaGrupo.clear();\n  if(callePuntos.length<2){ calleOk=false; document.getElementById('d-calle-estado').textContent='0/0'; return; }\n  const posiciones=[], colores2=[];\n  let tramosOk=0;\n  for(let i=0;i<callePuntos.length-1;i++){\n    const a=callePuntos[i], b=callePuntos[i+1];\n    const dist = distanciaHorizontal(a,b);\n    const pend = dist>0.01 ? (Math.abs(b.y-a.y)/dist)*100 : 0;\n    const ok = pend<=pendienteMaximaCalle;\n    if(ok) tramosOk++;\n    const c = ok ? [0.36,0.62,0.29] : [0.85,0.23,0.18];\n    posiciones.push(a.x,a.y+0.25,a.z, b.x,b.y+0.25,b.z);\n    colores2.push(...c, ...c);\n  }\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(posiciones,3));\n  g.setAttribute('color', new THREE.Float32BufferAttribute(colores2,3));\n  calleLineaGrupo.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({vertexColors:true})));\n  calleOk = tramosOk === (callePuntos.length-1);\n  document.getElementById('d-calle-estado').textContent = `${tramosOk}/${callePuntos.length-1}`;\n}\nfunction actualizarPanelCalle(){\n  const lista = document.getElementById('lista-calle');\n  lista.innerHTML = callePuntos.length===0\n    ? '<li style=\"color:#a99a6f\">\u2014 sin puntos trazados \u2014<\/li>'\n    : callePuntos.map((p,i)=>`<li>P${i+1}: x=${p.x.toFixed(1)} z=${p.z.toFixed(1)} cota=${p.y.toFixed(2)}<\/li>`).join('');\n  document.getElementById('btn-deshacer-calle').disabled = callePuntos.length===0;\n}\nfunction agregarPuntoCalle(p){\n  callePuntos.push(p);\n  const marc = new THREE.Mesh(new THREE.SphereGeometry(0.5,10,10), new THREE.MeshStandardMaterial({color:0x3f6f8f}));\n  marc.position.set(p.x, p.y+0.25, p.z);\n  scene.add(marc); calleMarcadores.push(marc);\n  redibujarCalle();\n  actualizarPanelCalle();\n}\nfunction deshacerCalle(){\n  if(callePuntos.length===0) return;\n  callePuntos.pop();\n  scene.remove(calleMarcadores.pop());\n  redibujarCalle();\n  actualizarPanelCalle();\n}\nfunction reiniciarCalle(){\n  callePuntos=[];\n  calleMarcadores.forEach(m=>scene.remove(m)); calleMarcadores=[];\n  calleLineaGrupo.clear();\n  calleOk=false;\n  actualizarPanelCalle();\n  document.getElementById('d-calle-estado').textContent='0/0';\n}\ndocument.getElementById('btn-deshacer-calle').addEventListener('click', deshacerCalle);\ndocument.getElementById('btn-reiniciar-calle').addEventListener('click', reiniciarCalle);\n\n/* ===================== PROGRESO DEL NIVEL ===================== */\nlet ultimoResultadoCompleto = false;\nfunction generarTextoInforme(){\n  const cfg = NIVELES[nivelActual];\n  let t = 'INFORME DE LEVANTAMIENTO TOPOGR\u00c1FICO\\n';\n  t += `Nivel ${nivelActual} \u2014 ${cfg.nombre}\\n`;\n  t += `Fecha: ${new Date().toLocaleDateString()}\\n`;\n  t += '='.repeat(50)+'\\n\\n';\n  if(lotesFijados.length===0) t += '(Todav\u00eda no se fij\u00f3 ning\u00fan lote.)\\n\\n';\n  lotesFijados.forEach((l,i)=>{\n    t += `LOTE ${i+1}\\n`;\n    l.corners.forEach((p,j)=> t += `  P${j+1}: x=${p.x.toFixed(2)}  z=${p.z.toFixed(2)}  cota=${p.y.toFixed(2)} m\\n`);\n    let per=0;\n    for(let k=0;k<l.corners.length;k++) per += distanciaHorizontal(l.corners[k], l.corners[(k+1)%l.corners.length]);\n    t += `  Per\u00edmetro: ${per.toFixed(2)} m\\n`;\n    t += `  \u00c1rea: ${l.area.toFixed(2)} m\u00b2\\n`;\n    t += `  Nivelado dentro de tolerancia: ${l.nivelado ? 'S\u00cd' : 'NO (o no verificado a\u00fan \u2014 us\u00e1 \"Verificar progreso\")'}\\n\\n`;\n  });\n  t += `Obst\u00e1culos que a\u00fan estorban dentro de los lotes: ${obstaculosDentroDeLotes()}\\n`;\n  t += `Tierra cortada acumulada: ${acumCorte.toFixed(1)} m\u00b3\\n`;\n  t += `Tierra rellenada acumulada: ${acumRelleno.toFixed(1)} m\u00b3\\n`;\n  if(cfg.compensar){\n    const total = acumCorte+acumRelleno;\n    const desb = total>0 ? Math.abs(acumCorte-acumRelleno)/total : 0;\n    t += `Desbalance corte/relleno: ${(desb*100).toFixed(1)}% (m\u00e1ximo admitido 12%)\\n`;\n  }\n  if(cfg.calleRequerida){\n    t += `Calle de acceso: ${callePuntos.length<2 ? 'no trazada' : (calleOk?'CUMPLE la pendiente m\u00e1xima':'NO CUMPLE la pendiente m\u00e1xima')}\\n`;\n  }\n  t += `\\nResultado del nivel: ${ultimoResultadoCompleto ? 'APROBADO \u2713' : 'A\u00daN NO APROBADO'}\\n`;\n  return t;\n}\ndocument.getElementById('btn-ver-informe').addEventListener('click', ()=>{\n  document.getElementById('texto-informe').textContent = generarTextoInforme();\n  document.getElementById('modal-informe').style.display='flex';\n});\ndocument.getElementById('btn-cerrar-informe').addEventListener('click', ()=>{\n  document.getElementById('modal-informe').style.display='none';\n});\ndocument.getElementById('btn-descargar-informe').addEventListener('click', ()=>{\n  const blob = new Blob([generarTextoInforme()], {type:'text/plain'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = `informe_nivel${nivelActual}.txt`;\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n});\nfunction verificarNivelacionLote(lote){\n  let n=0, ok=0;\n  for(let gx=0; gx<=RES; gx++){\n    for(let gz=0; gz<=RES; gz++){\n      const i = idxGrid[gz][gx];\n      const x = pos.getX(i), z = pos.getZ(i);\n      if(!dentroPoligono(x,z,lote.corners)) continue;\n      n++;\n      if(Math.abs(heights[i]-cotaEn(lote,x,z))<=toleranciaNivel) ok++;\n    }\n  }\n  return {nivelado: n>0 && ok===n};\n}\nfunction obstaculosDentroDeLotes(){\n  // s\u00f3lo importan los obst\u00e1culos que caen dentro de alguna parcela ya fijada\n  let dentro = 0;\n  obstaculosObjetos.forEach(o=>{\n    const x=o.position.x, z=o.position.z;\n    if(lotesFijados.some(l=>dentroPoligono(x,z,l.corners))) dentro++;\n  });\n  return dentro;\n}\nfunction verificarProgreso(){\n  const cfg = NIVELES[nivelActual];\n  const estorbando = obstaculosDentroDeLotes();\n  document.getElementById('chk-obst').textContent = estorbando===0 ? 'sin obst\u00e1culos \u2713' : `${estorbando} estorbando`;\n  document.getElementById('chk-lotes').textContent = `${lotesFijados.length}/${cfg.lotesRequeridos}`;\n  document.getElementById('chk-comp').parentElement.style.display = cfg.compensar ? '' : 'none';\n  document.getElementById('chk-casas').parentElement.style.display = cfg.casaRequerida ? '' : 'none';\n  let nivelados=0;\n  lotesFijados.forEach(l=>{ const r=verificarNivelacionLote(l); l.nivelado=r.nivelado; if(r.nivelado) nivelados++; });\n  document.getElementById('chk-nivel').textContent = `${nivelados}/${cfg.lotesRequeridos}`;\n\n  const casasInvalidas=[];\n  if(cfg.casaEstricta) lotesFijados.forEach((l,k)=>{ if(l.casaOk&&l.casaInfo){ const c=l.casaInfo; if(!requisitosCasa(l,c.tipo,c.rot,c.x,c.z,c.y).ok){ l.casaOk=false; casasInvalidas.push(k+1); } } });\n  const obstOk = estorbando===0;\n  const lotesOk = lotesFijados.length>=cfg.lotesRequeridos;\n  const nivelOk = lotesOk && nivelados===cfg.lotesRequeridos;\n\n  let compOk = true;\n  if(cfg.compensar){\n    const total = acumCorte + acumRelleno;\n    const desbalance = total>0 ? Math.abs(acumCorte-acumRelleno)/total : 0;\n    compOk = total>0 && desbalance<=toleranciaCompensacion;\n    document.getElementById('chk-comp').textContent = total>0\n      ? `desbalance ${(desbalance*100).toFixed(0)}% ${compOk?'\u2713':'(m\u00e1x 12%)'}`\n      : 'sin movimiento a\u00fan';\n  }\n\n  let calleCheckOk = true;\n  if(cfg.calleRequerida){\n    calleCheckOk = callePuntos.length>=2 && calleOk;\n  }\n\n  let casasOk=true, pendOk=true;\n  if(cfg.casaRequerida){ const nc=lotesFijados.filter(l=>l.casaOk).length; casasOk = nc>=cfg.lotesRequeridos; document.getElementById('chk-casas').textContent = nc+'/'+cfg.lotesRequeridos; }\n  if(cfg.pendiente){ pendOk = lotesFijados.length>0 && lotesFijados.every(l=>l.pend>=1&&l.pend<=2.5); }\n  const completo = obstOk && lotesOk && nivelOk && compOk && calleCheckOk && casasOk && pendOk;\n  ultimoResultadoCompleto = completo;\n  const msg = document.getElementById('msg-nivel');\n  const btnSig = document.getElementById('btn-siguiente-nivel');\n  if(completo){\n    try{parent.postMessage({tipo:'completo',nivel:nivelActual},'*');}catch(e){}\n    if(NIVELES[nivelActual+1]){\n      msg.textContent = '\u2705 \u00a1Nivel completo! Ya pod\u00e9s pasar de nivel.';\n      btnSig.style.display='block';\n      btnSig.textContent = `Ir al Nivel ${nivelActual+1} \u2192`;\n    } else {\n      msg.textContent = '\u2705 \u00a1Nivel 4 completo! Ya pod\u00e9s pasar al Nivel 5 (estaci\u00f3n total).';\n      btnSig.style.display='block'; btnSig.textContent='Ir al Nivel 5 \u2192';\n    }\n  } else {\n    const faltantes = [];\n    if(!lotesOk) faltantes.push('ubicar todos los lotes');\n    if(!obstOk) faltantes.push('despejar los obst\u00e1culos que caen dentro de los lotes');\n    if(!casasOk) faltantes.push(casasInvalidas.length ? 'revisar la casa del lote '+casasInvalidas.join(', ')+': ya no cumple los requisitos (quitala y volv\u00e9 a colocarla)' : 'implantar la casa en cada lote (retiros, cota sobre el cord\u00f3n, acceso y lote nivelado)');\n    if(!pendOk) faltantes.push('dar a cada lote una pendiente de desag\u00fce de 1 a 2,5 % hacia la calle');\n    if(!nivelOk) faltantes.push('nivelar los lotes dentro de la tolerancia');\n    if(!compOk) faltantes.push('compensar el suelo (corte \u2248 relleno)');\n    if(!calleCheckOk) faltantes.push('trazar la calle de acceso cumpliendo la pendiente m\u00e1xima');\n    msg.textContent = 'Todav\u00eda falta: ' + faltantes.join(' \u00b7 ');\n    btnSig.style.display='none';\n  }\n}\ndocument.getElementById('btn-verificar').addEventListener('click', verificarProgreso);\ndocument.getElementById('btn-siguiente-nivel').addEventListener('click', ()=>{\n  if(NIVELES[nivelActual+1]) cargarNivel(nivelActual+1);\n  else parent.postMessage({tipo:'siguiente',desde:nivelActual},'*');\n});\n\n/* ===================== ENTRADA UNIFICADA (mouse/touch) ===================== */\nlet estado = null;\n\ncanvas.addEventListener('pointerdown', e=>{\n  if(e.button!==0) return;\n  coordsNormalizadas(e);\n  if(modo==='orbitar'){\n    estado = {tipo:'camara', x:e.clientX, y:e.clientY, movio:false};\n    return;\n  }\n  if(modo==='levantar' && !cerrado){\n    raycaster.setFromCamera(puntero,camera);\n    const hitM = raycaster.intersectObjects(marcadores)[0];\n    if(hitM){ estado = {tipo:'vertice', idx: marcadores.indexOf(hitM.object)}; return; }\n    estado = {tipo:'click-terreno', x:e.clientX, y:e.clientY, movio:false};\n    return;\n  }\n  if(modo==='obstaculos'){\n    raycaster.setFromCamera(puntero,camera);\n    const hits = raycaster.intersectObjects(obstaculosObjetos, true);\n    if(hits.length){\n      let o = hits[0].object;\n      while(o && !o.userData.tipo) o = o.parent;\n      if(o) estado = {tipo:'obstaculo', grupo:o};\n    }\n    return;\n  }\n  if(modo==='lote'){\n    if(!loteMesh) return;\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(loteMesh)[0];\n    if(hit) estado = {tipo:'lote'};\n    return;\n  }\n  if(modo==='nivelar'){\n    estado = {tipo:'nivelar'};\n    aplicarPincelDesdeEvento(e);\n    if(herramienta!=='aplanar'){\n      // cavar/rellenar: una sola aplicaci\u00f3n por clic, para que el paso sea exacto\n      generarCurvasNivel();\n      refrescarAyudasNivelacion();\n      estado = {tipo:'nivelar-hecho'};\n    }\n    return;\n  }\n  if(modo==='calle'){\n    estado = {tipo:'click-calle', x:e.clientX, y:e.clientY, movio:false};\n    return;\n  }\n});\n\ncanvas.addEventListener('pointermove', e=>{\n  if(modo!=='nivelar'){ ocultarAnillo(); return; }\n  coordsNormalizadas(e);\n  raycaster.setFromCamera(puntero,camera);\n  const hit = raycaster.intersectObject(terreno)[0];\n  if(hit) moverAnillo(hit.point.x, hit.point.z); else ocultarAnillo();\n});\ncanvas.addEventListener('pointerleave', ocultarAnillo);\n\nwindow.addEventListener('pointermove', e=>{\n  if(!estado) return;\n  if(estado.tipo==='camara'){\n    const dx=e.clientX-estado.x, dy=e.clientY-estado.y;\n    if(Math.abs(dx)>3||Math.abs(dy)>3) estado.movio=true;\n    if(!estado.movio) return;\n    azimut -= dx*0.006;\n    polar = Math.min(1.45, Math.max(0.25, polar-dy*0.005));\n    estado.x=e.clientX; estado.y=e.clientY;\n    actualizarCamara();\n  } else if(estado.tipo==='click-terreno'){\n    const dx=e.clientX-estado.x, dy=e.clientY-estado.y;\n    if(Math.abs(dx)>3||Math.abs(dy)>3) estado.movio=true;\n  } else if(estado.tipo==='click-calle'){\n    const dx=e.clientX-estado.x, dy=e.clientY-estado.y;\n    if(Math.abs(dx)>3||Math.abs(dy)>3) estado.movio=true;\n  } else if(estado.tipo==='vertice'){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(planoArrastre)[0];\n    if(!hit) return;\n    const x=hit.point.x, z=hit.point.z, y=alturaActual(x,z);\n    puntos[estado.idx] = {x,y,z};\n    marcadores[estado.idx].position.set(x,y+0.15,z);\n    redibujarLineas(); actualizarPanel();\n  } else if(estado.tipo==='obstaculo'){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(planoArrastre)[0];\n    if(!hit) return;\n    estado.grupo.position.set(hit.point.x, hit.point.y, hit.point.z);\n  } else if(estado.tipo==='lote'){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(planoArrastre)[0];\n    if(!hit) return;\n    loteCentro.x = hit.point.x; loteCentro.z = hit.point.z;\n    actualizarGeometriaLote();\n  } else if(estado.tipo==='nivelar'){\n    aplicarPincelDesdeEvento(e);\n  }\n});\n\nwindow.addEventListener('pointerup', e=>{\n  if(!estado) return;\n  if(estado.tipo==='click-terreno' && !estado.movio){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(terreno)[0];\n    if(hit) agregarPunto({x:hit.point.x, y:hit.point.y, z:hit.point.z});\n  }\n  if(estado.tipo==='click-calle' && !estado.movio){\n    coordsNormalizadas(e);\n    raycaster.setFromCamera(puntero,camera);\n    const hit = raycaster.intersectObject(terreno)[0];\n    if(hit) agregarPuntoCalle({x:hit.point.x, y:hit.point.y, z:hit.point.z});\n  }\n  if(estado.tipo==='obstaculo'){\n    const g = estado.grupo;\n    if(Math.abs(g.position.x)>SIZE/2+2 || Math.abs(g.position.z)>SIZE/2+2){\n      scene.remove(g);\n      obstaculosObjetos = obstaculosObjetos.filter(o=>o!==g);\n      actualizarPanelObstaculos();\n    } else {\n      g.position.y = alturaActual(g.position.x, g.position.z);\n    }\n  }\n  if(estado.tipo==='nivelar'){\n    generarCurvasNivel();\n    refrescarAyudasNivelacion();\n  }\n  estado = null;\n});\n\n/* ===================== RESIZE + LOOP ===================== */\nfunction resize(){\n  const w = canvas.parentElement.clientWidth, h = canvas.parentElement.clientHeight;\n  renderer.setSize(w,h,false);\n  camera.aspect = w/h;\n  camera.updateProjectionMatrix();\n}\nwindow.addEventListener('resize', resize);\nresize();\nfunction animar(){ requestAnimationFrame(animar); renderer.render(scene, camera); }\nanimar();\n\n/* ===================== ARRANQUE ===================== */\n\ndocument.getElementById('btn-rot-izq').addEventListener('click',()=>{ loteRot-=Math.PI/12; if(loteMesh) actualizarGeometriaLote(); });\ndocument.getElementById('btn-rot-der').addEventListener('click',()=>{ loteRot+=Math.PI/12; if(loteMesh) actualizarGeometriaLote(); });\ndocument.getElementById('btn-casa-a').addEventListener('click',()=>ponerCasa('A'));\ndocument.getElementById('btn-casa-b').addEventListener('click',()=>ponerCasa('B'));\ndocument.getElementById('btn-casa-izq').addEventListener('click',()=>{ if(casaObj){ casaRot-=Math.PI/12; evaluarCasa(); } });\ndocument.getElementById('btn-casa-der').addEventListener('click',()=>{ if(casaObj){ casaRot+=Math.PI/12; evaluarCasa(); } });\ndocument.getElementById('btn-casa-quitar').addEventListener('click',()=>{\n  const e=document.getElementById('msg-casa');\n  if(casaObj){ scene.remove(casaObj); casaObj=null; e.textContent=''; return; }\n  const l=lotesFijados[loteSeleccionadoIdx];\n  if(l&&l.casaObjFija){ scene.remove(l.casaObjFija); casaFijas=casaFijas.filter(g=>g!==l.casaObjFija); l.casaObjFija=null; l.casaOk=false; l.casaInfo=null; e.textContent='Casa quitada: el terreno de ese lote qued\u00f3 libre.'; e.style.color='#2e7d32'; }\n});\ndocument.getElementById('btn-casa-fijar').addEventListener('click',()=>{ if(casaObj&&evaluarCasa()){ const lc=lotesFijados[casaLote]; lc.casaOk=true; lc.casaObjFija=casaObj; lc.casaInfo={tipo:casaTipo,rot:casaRot,x:casaObj.position.x,z:casaObj.position.z,y:casaObj.position.y}; casaFijas.push(casaObj); casaObj=null; const e=document.getElementById('msg-casa'); e.textContent='\u2705 Casa implantada en el lote.'+(retirosOkGlobal?'':' (con advertencia de retiros)')+' El terreno alrededor queda bloqueado; \"Quitar casa\" lo libera.'; e.style.color='#2e7d32'; } });\nwindow.addEventListener('message',e=>{const d=e.data; if(d&&d.tipo==='cargar'&&NIVELES[d.nivel]&&d.nivel!==nivelActual) cargarNivel(d.nivel);});\ncargarNivel(1);\n<\/script>\n<\/body>\n<\/html>\n", SRC_S="<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Simulador Topogr\u00e1fico - Levantamiento<\/title>\n<style>\n  :root{\n    --tierra-1:#f4ecd8; --tierra-2:#e3d5b3; --tinta:#2c2418; --linea:#8a7857;\n    --naranja:#e8590c; --verde-ok:#4a8a3a; --panel-borde:#c9b98c;\n    --lcd-bg:#829e71; --lcd-text:#1a2b13;\n    --hud-fondo:rgba(18,20,24,.88);\n    --mono: 'Courier New', ui-monospace, monospace; --sans: 'Segoe UI', Arial, sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;background:#101216;font-family:var(--sans);overflow:hidden;}\n  #app{position:relative;width:100vw;height:100vh;display:flex;}\n  \n  /* Lienzo 3D */\n  #visor-wrap{flex:1;position:relative;overflow:hidden;}\n  canvas{display:block;width:100%;height:100%;}\n  \n  /* M\u00e1scara del Ocular */\n  #mascara-lente{\n    position:absolute; top:0; left:0; width:100%; height:100%;\n    background: radial-gradient(circle at center, transparent 38%, #000 42%);\n    pointer-events:none; z-index:5; display:none;\n  }\n  \n  /* Ret\u00edcula */\n  #reticula{\n    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);\n    width:100px;height:100px;pointer-events:none;z-index:6;display:none;\n  }\n  .linea-r{position:absolute;background:rgba(255,30,30,0.9);box-shadow:0 0 2px rgba(0,0,0,0.8);}\n  #r-h{top:50%;left:0;width:100%;height:1.5px;transform:translateY(-50%);}\n  #r-v{left:50%;top:0;height:100%;width:1.5px;transform:translateX(-50%);}\n  .r-centro{position:absolute;top:50%;left:50%;width:10px;height:10px;border:1.5px solid rgba(255,30,30,0.9);border-radius:50%;transform:translate(-50%,-50%);}\n  #visor-wrap.fijado .linea-r, #visor-wrap.fijado .r-centro { background:#4a8a3a; border-color:#4a8a3a; }\n\n  /* Minimapa */\n  #minimapa{\n    position:absolute; top:20px; right:20px; width:180px; height:180px;\n    background: rgba(18,20,24,0.85); border: 2px solid var(--naranja);\n    border-radius: 50%; z-index: 15; display: none; overflow: hidden;\n    box-shadow: 0 0 15px rgba(0,0,0,0.8);\n  }\n  #canvas-mini { width: 100%; height: 100%; display: block; }\n\n  /* HUD Top */\n  #hud-top{\n    position:absolute;top:20px;left:50%;transform:translateX(-50%);\n    background:var(--hud-fondo);color:var(--tierra-1);padding:12px 20px;\n    font-family:var(--mono);font-size:13px;border-radius:4px;border:1px solid #333;\n    pointer-events:none; z-index:10; text-align:center; display:none;\n  }\n\n  /* Controles Fase */\n  #controles-fase{ display:none; }\n  .btn-fase{ width:100%; margin:4px 0; box-sizing:border-box;  background:#4a8a3a; color:#fff; border:none; padding:12px 24px; font-size:14px; font-weight:bold; cursor:pointer; border-radius:3px; border:2px solid #fff; }\n  .btn-fase:disabled{background:#555; border-color:#777; cursor:not-allowed; opacity:0.8;}\n\n  /* Panel Derecho */\n  #panel{width:360px;min-width:360px;background:var(--tierra-1);border-left:1px solid var(--panel-borde);display:flex;flex-direction:column;color:var(--tinta);z-index:20;}\n  #panel-scroll{overflow-y:auto;padding:20px;flex:1;}\n  h2{font-size:14px;margin:0 0 4px;font-weight:700;border-bottom:2px solid var(--tinta);padding-bottom:8px;}\n  .sub{font-size:11px;color:var(--linea);font-family:var(--mono);margin:0 0 16px;}\n\n  /* Elementos UI compartidos */\n  .btn{width:100%;padding:12px;margin-top:8px;border:none;background:var(--naranja);color:#fff;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;border-radius:3px;text-transform:uppercase;}\n  .btn:hover{background:#c94a08;}\n  .btn:disabled{background:#ccc; cursor:not-allowed; color:#666;}\n  .btn.guardar{background:var(--tinta);margin-bottom:20px;}\n  .btn.guardar:hover{background:#111;}\n  .seccion{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--panel-borde);}\n  .seccion h3{font-size:11px;font-weight:700;margin:0 0 8px;color:var(--verde-cota);}\n  .dato{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:13px;padding:4px 0;border-bottom:1px dotted var(--panel-borde);}\n  .dato span:first-child{color:var(--linea);font-size:11px;}\n  .dato span:last-child{font-weight:700;}\n\n  /* Modulo Relevamiento */\n  #pantalla-lcd{background:var(--lcd-bg);border:3px solid #4a5445;border-radius:4px;padding:12px;font-family:var(--mono);color:var(--lcd-text);box-shadow:inset 0 0 8px rgba(0,0,0,0.2);margin-bottom:16px;}\n  .lcd-fila{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px;font-weight:bold;}\n  .lcd-etiqueta{font-size:11px;opacity:0.8;}\n  .lcd-valor{font-size:16px;letter-spacing:1px;}\n  .lcd-valor.vacio{opacity:0.3;}\n  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;margin-top:10px;}\n  th,td{border:1px solid var(--panel-borde);padding:6px;text-align:right;}\n  th{background:var(--tierra-2);color:var(--tinta);text-align:center;}\n  td:first-child{text-align:center;font-weight:bold;}\n\n  /* Modulo Nivelaci\u00f3n */\n  .fila-pasos, .fila-herramientas{display:flex;gap:5px;margin-bottom:10px;}\n  .btn-paso, .btn-herr{flex:1;padding:8px 4px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;}\n  .btn-paso.activo, .btn-herr.activo{background:var(--naranja);border-color:var(--naranja);color:#fff;}\n  #panel input[type=range], #panel input[type=number]{width:100%;margin:4px 0 10px;padding:6px;font-family:var(--mono);border:1px solid var(--panel-borde);}\n<\/style>\n<\/head>\n<body>\n\n<div id=\"app\">\n  <div id=\"visor-wrap\">\n    <canvas id=\"c\"><\/canvas>\n    <div id=\"mascara-lente\"><\/div>\n    <div id=\"reticula\"><div class=\"linea-r\" id=\"r-h\"><\/div><div class=\"linea-r\" id=\"r-v\"><\/div><div class=\"r-centro\"><\/div><\/div>\n    <div id=\"minimapa\"><canvas id=\"canvas-mini\"><\/canvas><\/div>\n    <div id=\"hud-top\">Arrastra el mouse para orbitar. Us\u00e1 el bot\u00f3n \ud83d\udccd Colocar estaci\u00f3n y hac\u00e9 clic en el terreno. Con el mouse libre orbit\u00e1s la c\u00e1mara.<\/div>\n  <\/div>\n\n  <div id=\"panel\">\n    <div id=\"panel-scroll\">\n      <h2 id=\"h-nivel\"><\/h2>\n      <p class=\"sub\" id=\"subtitulo-fase\">Fase 1: Levantamiento Poligonal<\/p>\n<div class=\"seccion\"><h3>EQUIPO<\/h3><div id=\"controles-fase\">\n      <button class=\"btn-fase\" id=\"btn-colocar\" style=\"background:#e8590c;\">\ud83d\udccd Colocar estaci\u00f3n<\/button>\n      <button class=\"btn-fase\" id=\"btn-entrar-ocular\" disabled>\ud83d\udd2d Entrar al Ocular<\/button>\n      <button class=\"btn-fase\" id=\"btn-salir-ocular\" style=\"display:none; background:#b23a2e;\">Desarmar equipo<\/button>\n    <\/div><\/div>\n\n\n      <!-- PANEL DE RELEVAMIENTO -->\n      <div id=\"panel-relevamiento\">\n        <div id=\"pantalla-lcd\">\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">AZ<\/span><span class=\"lcd-valor\" id=\"lcd-az\">000\u00b0 00' 00\"<\/span><\/div>\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">V<\/span><span class=\"lcd-valor\" id=\"lcd-v\">090\u00b0 00' 00\"<\/span><\/div>\n          <div style=\"border-bottom:1px solid rgba(0,0,0,0.2);margin:8px 0;\"><\/div>\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">SD<\/span><span class=\"lcd-valor vacio\" id=\"lcd-sd\">----.--- m<\/span><\/div>\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">HD<\/span><span class=\"lcd-valor vacio\" id=\"lcd-hd\">----.--- m<\/span><\/div>\n          <div class=\"lcd-fila\"><span class=\"lcd-etiqueta\">VD<\/span><span class=\"lcd-valor vacio\" id=\"lcd-vd\">----.--- m<\/span><\/div>\n        <\/div>\n\n        <button class=\"btn\" id=\"btn-medir\" disabled>\ud83d\udce1 Disparar L\u00e1ser<\/button>\n        <button class=\"btn guardar\" id=\"btn-guardar\" style=\"display:none;\">Guardar V\u00e9rtice<\/button>\n\n        <div class=\"seccion\">\n          <h3>LIBRETA DE CAMPO (<span id=\"contador-libreta\">0<\/span>/<span id=\"tot-lib\"><\/span>)<\/h3>\n          <table id=\"tabla-libreta\">\n            <thead><tr><th>Pto<\/th><th>Azimut<\/th><th>DH(m)<\/th><\/tr><\/thead>\n            <tbody><tr><td colspan=\"3\" style=\"text-align:center;color:#8a7857;\">Sin mediciones<\/td><\/tr><\/tbody>\n          <\/table>\n        <\/div>\n      <div class=\"seccion\"><h3>SUPERFICIE Y PER\u00cdMETRO<\/h3><div class=\"dato\"><span>Per\u00edmetro<\/span><span class=\"g-per\">\u2014<\/span><\/div><div class=\"dato\"><span>Superficie<\/span><span class=\"g-area\">\u2014<\/span><\/div><div class=\"dato\"><span>Superficie (ha)<\/span><span class=\"g-ha\">\u2014<\/span><\/div><div class=\"dato\"><span>\u03a3 \u00e1ngulos interiores<\/span><span class=\"g-ang\">\u2014<\/span><\/div><div class=\"dato fila-edif\" style=\"display:none\"><span>Retiro frente 3 m \u00b7 edificable<\/span><span class=\"g-edif\">\u2014<\/span><\/div><\/div>\n      <\/div>\n\n      <!-- PANEL DE NIVELACI\u00d3N -->\n      <div id=\"panel-nivelacion\" style=\"display:none;\">\n<div class=\"seccion\"><h3>SUPERFICIE Y PER\u00cdMETRO<\/h3><div class=\"dato\"><span>Per\u00edmetro<\/span><span class=\"g-per\">\u2014<\/span><\/div><div class=\"dato\"><span>Superficie<\/span><span class=\"g-area\">\u2014<\/span><\/div><div class=\"dato\"><span>Superficie (ha)<\/span><span class=\"g-ha\">\u2014<\/span><\/div><div class=\"dato\"><span>\u03a3 \u00e1ngulos interiores<\/span><span class=\"g-ang\">\u2014<\/span><\/div><div class=\"dato fila-edif\" style=\"display:none\"><span>Retiro frente 3 m \u00b7 edificable<\/span><span class=\"g-edif\">\u2014<\/span><\/div><\/div>\n        <p class=\"nota-mini\" style=\"font-size:12px;margin-bottom:12px;\">\ud83e\ude93 Para despejar: arrastr\u00e1 un \u00e1rbol o una roca con el mouse y soltalo <b>fuera del pol\u00edgono<\/b>.<\/p>\n        \n        <div class=\"seccion\">\n          <h3>MAQUINARIA (CAVAR / RELLENAR)<\/h3>\n          <div class=\"fila-herramientas\" style=\"margin-bottom:8px;\">\n            <button class=\"btn-herr activo\" data-herr=\"orbitar\" id=\"btn-herr-orbitar\">\ud83e\udded Orbitar<\/button>\n          <\/div>\n          <div class=\"fila-pasos\">\n            <button class=\"btn-paso activo\" data-paso=\"1\">1 m<\/button>\n            <button class=\"btn-paso\" data-paso=\"2\">2 m<\/button>\n            <button class=\"btn-paso\" data-paso=\"5\">5 m<\/button>\n          <\/div>\n          <div class=\"fila-herramientas\">\n            <button class=\"btn-herr\" data-herr=\"cavar\">\u26cf\ufe0f Cavar<\/button>\n            <button class=\"btn-herr\" data-herr=\"rellenar\">\ud83e\uddf1 Relleno<\/button>\n          <\/div>\n          <button class=\"btn-herr\" id=\"btn-herr-aplanar\" data-herr=\"aplanar\" style=\"width:100%;margin-bottom:10px;\">\ud83e\ude9a Motoniveladora (Suavizar)<\/button>\n          \n          <div style=\"display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px;\">\n            <span>Radio de Pincel<\/span><span id=\"d-radio\">7 m<\/span>\n          <\/div>\n          <input type=\"range\" id=\"rango-pincel\" min=\"3\" max=\"15\" value=\"7\">\n          <p style=\"font-size:11px; color:var(--linea); margin-top:10px;\"><b>Tip:<\/b> Usa Click Izquierdo para nivelar. Usa Click Derecho para girar la c\u00e1mara en cualquier momento.<\/p>\n        <\/div>\n\n        <div class=\"seccion\" id=\"seccion-rampa\" style=\"display:none\">\n          <h3>ENTRADA VEHICULAR (RAMPA)<\/h3>\n          <p style=\"font-size:11px; color:var(--linea); margin:0 0 8px;\">Eleg\u00ed <b>\u25ad Rampa<\/b> y arrastr\u00e1 un rect\u00e1ngulo con el mouse desde la vereda hacia el interior del lote (ancho de 3 a 8 m). La rampa parte de la cota de la vereda con la pendiente que elijas y tiene que empalmar con la cota objetivo del lote (m\u00e1x. \u00b112 %).<\/p>\n          <button class=\"btn-herr\" data-herr=\"rampa\" id=\"btn-herr-rampa\" style=\"width:100%;margin-bottom:8px;\">\u25ad Rampa<\/button>\n          <label style=\"font-size:11px; font-family:var(--mono); color:var(--linea);\">Pendiente de la rampa (%) \u00b7 + sube hacia el lote, \u2212 baja<\/label>\n          <input type=\"number\" id=\"input-pend-rampa\" value=\"8\" step=\"0.5\" min=\"-12\" max=\"12\">\n          <div id=\"info-rampa\" style=\"font-family:var(--mono); font-size:11px; line-height:1.6; margin:4px 0;\"><\/div>\n          <p id=\"msg-rampa\" style=\"font-size:12px; font-weight:700; margin:6px 0; line-height:1.5;\"><\/p>\n          <button class=\"btn\" id=\"btn-quitar-rampa\" style=\"background:#555; font-size:12px;\">Quitar rampa<\/button>\n        <\/div>\n\n        <div class=\"seccion\">\n          <h3>CONTROL DE COTA Y VOL\u00daMENES<\/h3>\n          <label style=\"font-size:11px; font-family:var(--mono); color:var(--linea);\">Cota Objetivo (m)<\/label>\n          <input type=\"number\" id=\"input-cota-objetivo\" value=\"0\" step=\"0.5\">\n          <div class=\"dato\"><span>Tierra Extra\u00edda<\/span><span id=\"d-acorte\">0.0 m\u00b3<\/span><\/div>\n          <div class=\"dato\"><span>Tierra Aportada<\/span><span id=\"d-arelleno\">0.0 m\u00b3<\/span><\/div>\n          <div class=\"dato\" style=\"margin-top:10px; border-top:2px solid var(--tinta); padding-top:8px;\">\n            <span style=\"color:var(--tinta); font-weight:bold;\">PRESUPUESTO USADO<\/span><span id=\"d-presupuesto\" style=\"color:var(--naranja); font-weight:bold;\">$0<\/span>\n          <\/div>\n          <p style=\"font-size:10px; color:var(--linea); margin-top:4px;\">(Corte: $1000/m\u00b3 | Relleno: $3500/m\u00b3)<\/p>\n          \n          <button class=\"btn\" id=\"btn-reset-terreno\" style=\"background:#555; margin-top:15px; font-size:12px;\">\u21bb Reiniciar Nivelaci\u00f3n<\/button>\n          <button class=\"btn principal\" id=\"btn-verificar\" style=\"margin-top:10px;\">\u2705 Verificar nivelaci\u00f3n<\/button>\n          <p id=\"msg-nivel\" style=\"font-size:12px;font-weight:700;margin:6px 0;\"><\/p>\n          <button class=\"btn guardar\" id=\"btn-siguiente\" style=\"display:none;\"><\/button>\n        <\/div>\n      <\/div>\n\n    <\/div>\n  <\/div>\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n/* ===================== ESTADO GENERAL ===================== */\nconst NV = window.NIVEL||6;\nlet fase = 'ESTRATEGIA'; \ndocument.getElementById('h-nivel').textContent = NV===5 ? 'NIVEL 5: Levantamiento con Estaci\u00f3n Total' : 'NIVEL 6: Proyecto Integral';\n\n/* ===================== CONFIGURACI\u00d3N 3D Y TERRENO ===================== */\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true});\nrenderer.setPixelRatio(window.devicePixelRatio);\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(0x87CEEB);\n\nconst camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000); \nscene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));\nconst sol = new THREE.DirectionalLight(0xffffff, 0.8);\nsol.position.set(50, 100, 20); scene.add(sol);\n\nconst SIZE = 140, RES = 70;\nconst cellSize = SIZE/RES;\nconst areaCelda = cellSize*cellSize;\nconst geo = new THREE.PlaneGeometry(SIZE, SIZE, RES, RES);\ngeo.rotateX(-Math.PI/2);\nconst pos = geo.attributes.position;\n\nconst idxGrid = [];\nfor(let gz=0; gz<=RES; gz++) idxGrid.push(new Int32Array(RES+1));\nfunction coordAGrilla(x,z){ \n  return [Math.min(RES, Math.max(0,Math.round((x+SIZE/2)/cellSize))), Math.min(RES, Math.max(0,Math.round((z+SIZE/2)/cellSize)))]; \n}\n\nconst heights = new Float32Array(pos.count);\nconst heightsIniciales = new Float32Array(pos.count); \n/* ---- Nivel 6: calle con rasante suave (m\u00e1x. 1,5 %) y terreno adaptado a los costados ---- */\nconst CALLE6={nombre:'Calle Los Aromos',px:1.51,pz:44.43,ang:8.13}, CALLE_MEDIA=5.5;\nfunction base6(x,z){ return Math.sin(x*0.03)*3 + Math.cos(z*0.04)*2 + Math.sin((x+z)*0.02)*1.5; }\nlet _perfil6=null;\nfunction perfilCalle6(){\n  if(_perfil6) return _perfil6; const c=CALLE6, a=c.ang*Math.PI/180, dx=Math.cos(a), dz=Math.sin(a);\n  let St=0,Stt=0,Sh=0,Sth=0,N=0;\n  for(let t=-100;t<=100;t+=2){ const x=c.px+dx*t, z=c.pz+dz*t; if(Math.abs(x)>68||Math.abs(z)>68) continue; const h=base6(x,z); N++; St+=t; Stt+=t*t; Sh+=h; Sth+=t*h; }\n  let g=(N*Sth-St*Sh)/((N*Stt-St*St)||1); g=Math.max(-0.015,Math.min(0.015,g));\n  _perfil6={dx,dz,nx:-dz,nz:dx,g,h0:(Sh-g*St)/N}; return _perfil6;\n}\nfunction terreno6(x,z){\n  const c=CALLE6, p=perfilCalle6(), d=(x-c.px)*p.nx+(z-c.pz)*p.nz, t=(x-c.px)*p.dx+(z-c.pz)*p.dz, ad=Math.abs(d), hs=p.h0+p.g*t;\n  if(ad<=CALLE_MEDIA) return hs;\n  const PB=0.07, ZB=16, ZF=30, base=base6(x,z); if(ad>=ZF) return base;\n  const nd=base-hs, lim=PB*(Math.min(ad,ZB)-CALLE_MEDIA), cl=Math.max(-lim,Math.min(lim,nd));\n  if(ad<=ZB) return hs+cl;\n  const w=(ad-ZB)/(ZF-ZB), s=w*w*(3-2*w); return hs+cl*(1-s)+nd*s;\n}\nfunction getAlturaInicial(x,z){ return NV===5 ? Math.sin(x*0.025)*2 + Math.cos(z*0.03)*1.5 : terreno6(x,z); }\n\nfor(let i=0; i<pos.count; i++){ \n  const x = pos.getX(i), z = pos.getZ(i);\n  heights[i] = getAlturaInicial(x,z);\n  heightsIniciales[i] = heights[i];\n  pos.setY(i, heights[i]);\n  const [gx,gz] = coordAGrilla(x,z);\n  idxGrid[gz][gx] = i;\n}\ngeo.computeVertexNormals();\n\nconst colores = new Float32Array(pos.count*3);\ngeo.setAttribute('color', new THREE.BufferAttribute(colores,3));\nconst rampa = [{t:0.0, c:new THREE.Color(0x24391a)},{t:0.3, c:new THREE.Color(0x4b6b2c)},{t:0.6, c:new THREE.Color(0x8a7a2e)},{t:1.0, c:new THREE.Color(0xcbb98a)}];\nlet hMin = -4, hMax = 6;\nfunction colorPorCota(h){\n  const t = Math.min(1,Math.max(0,(h-hMin)/(hMax-hMin)));\n  for(let i=0;i<rampa.length-1;i++){ \n    if(t>=rampa[i].t && t<=rampa[i+1].t) return rampa[i].c.clone().lerp(rampa[i+1].c, (t-rampa[i].t)/(rampa[i+1].t-rampa[i].t || 1)); \n  }\n  return rampa[rampa.length-1].c;\n}\nfunction actualizarColores(){\n  for(let i=0;i<pos.count;i++){ const c = colorPorCota(heights[i]); colores[i*3]=c.r; colores[i*3+1]=c.g; colores[i*3+2]=c.b; }\n  geo.attributes.color.needsUpdate = true;\n}\nactualizarColores();\nconst terreno = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.9, flatShading:true}));\nscene.add(terreno);\n\nfunction alturaActual(x,z){ const [gx,gz] = coordAGrilla(x,z); return heights[idxGrid[gz][gx]]; }\n\n/* ===================== \u00c1RBOLES Y PRISMAS ===================== */\nconst obstaculosVisuales = [];\nconst arbolesGrupos = [];\nconst posicionesArboles = NV===5 ? [{x:0,z:3},{x:-2,z:-6},{x:13,z:-4}] : [{x:-15, z:-15}, {x:20, z:5}, {x:5, z:25}, {x:30, z:-20}, {x:0, z:-35}, {x:-25, z:15}, {x:10, z:-10}];\n\nfunction crearArbol(x, z){\n  const y = alturaActual(x,z);\n  const g = new THREE.Group(); g.position.set(x,y,z);\n  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,2.5,6), new THREE.MeshStandardMaterial({color:0x5a4128})); tronco.position.y=1.25;\n  const copa = new THREE.Mesh(new THREE.SphereGeometry(2.5,7,7), new THREE.MeshStandardMaterial({color:0x3f6b2e})); copa.position.y=4;\n  tronco.userData = { tipo: 'obstaculo' }; copa.userData = { tipo: 'obstaculo' };\n  g.add(tronco, copa); scene.add(g);\n  obstaculosVisuales.push(tronco, copa);\n  arbolesGrupos.push(g);\n}\nposicionesArboles.forEach(p => crearArbol(p.x, p.z));\nconst posicionesRocas = NV===5 ? [{x:-3,z:9,s:1.1},{x:9,z:6,s:0.9},{x:3,z:-9,s:1.0}] : [{x:8,z:-18,s:1.4},{x:-20,z:20,s:1.2},{x:25,z:25,s:1.0},{x:0,z:0,s:1.1},{x:-10,z:-25,s:1.0}];\nfunction crearRoca(x,z,s){\n  const g=new THREE.Group(); g.position.set(x,alturaActual(x,z),z);\n  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),new THREE.MeshStandardMaterial({color:0x7d7466,flatShading:true})); m.position.y=s*0.5; m.rotation.set(1,2,3); m.userData={tipo:'obstaculo'};\n  g.add(m); scene.add(g); obstaculosVisuales.push(m); arbolesGrupos.push(g);\n}\nposicionesRocas.forEach(r=>crearRoca(r.x,r.z,r.s));\n\nconst altJalon = 1.5;\nconst prismasHitboxes = [];\nconst PRISMAS_6 = [\n  {id: \"P1\", x: -25, z: -35}, {id: \"P2\", x: 15, z: -40}, {id: \"P3\", x: 40, z: -15}, {id: \"P4\", x: 45, z: 15},\n  {id: \"P5\", x: 20, z: 40},   {id: \"P6\", x: -15, z: 35}, {id: \"P7\", x: -40, z: 10}, {id: \"P8\", x: -35, z: -15}\n];\nconst PRISMAS_5 = [{id:\"P1\",x:-5,z:-15},{id:\"P2\",x:5,z:-15},{id:\"P3\",x:5,z:15},{id:\"P4\",x:-5,z:15}];\nconst posicionesPrismas = NV===5 ? PRISMAS_5 : PRISMAS_6;\ndocument.getElementById('tot-lib').textContent = posicionesPrismas.length;\nconst prismasGrupos = [];\nconst MN=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c},o||{}));\nfunction crearPrisma(id, x, z){\n  const y = alturaActual(x,z);\n  const g = new THREE.Group(); g.position.set(x,y,z);\n  const hJ = altJalon-0.23;\n  const jalon = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,hJ,8), MN(0xcc0000)); jalon.position.y = hJ/2; g.add(jalon);\n  const v = new THREE.Group(); v.position.y = altJalon; v.scale.setScalar(2.5); g.add(v);\n  const sh = new THREE.Shape(); [[-.1,.08],[.1,.08],[.1,-.02],[.05,-.08],[-.05,-.08],[-.1,-.02]].forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));\n  v.add(new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.006,bevelEnabled:false}), MN(0xe8400c,{roughness:.5})));\n  const tri=(pts,c,z)=>{ const s=new THREE.Shape(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); const m=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide})); m.position.z=z; v.add(m); };\n  [-1,1].forEach(k=>{ tri([[k*.095,.065],[k*.095,-.03],[k*.052,.017]],0xf3e3e3,.0075); tri([[k*.088,.045],[k*.088,-.012],[k*.062,.017]],0x111111,.0085); });\n  const cil = new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.03,24), MN(0xe8400c,{roughness:.4})); cil.rotation.x=Math.PI/2; cil.position.set(0,.005,.021); v.add(cil);\n  const aro =
