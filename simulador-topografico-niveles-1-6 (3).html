aci\u00f3n.\"); return; }\n  \n  const data = objetivoEnMira.userData;\n  const dx = data.realX - estX, dy = data.realY - (estY + altInstrumento), dz = data.realZ - estZ;\n  const hd = Math.sqrt(dx*dx + dz*dz), sd = Math.sqrt(dx*dx + dy*dy + dz*dz), vd = dy;\n  \n  document.getElementById('lcd-sd').textContent = sd.toFixed(3) + ' m'; document.getElementById('lcd-hd').textContent = hd.toFixed(3) + ' m'; document.getElementById('lcd-vd').textContent = vd.toFixed(3) + ' m';\n  document.querySelectorAll('.lcd-valor.vacio').forEach(el => el.classList.remove('vacio'));\n  \n  ultimaMedicion = { id: data.id, az: document.getElementById('lcd-az').textContent, hd: hd.toFixed(3), dx, dz };\n  document.getElementById('btn-guardar').style.display = 'block';\n});\n\ndocument.getElementById('btn-guardar').addEventListener('click', () => {\n  if(!ultimaMedicion) return;\n  if(libreta.find(m => m.id === ultimaMedicion.id)){ alert(\"Ya registraste este v\u00e9rtice.\"); return; }\n  \n  libreta.push(ultimaMedicion);\n  const tbody = document.querySelector('#tabla-libreta tbody');\n  if(libreta.length === 1) tbody.innerHTML = '';\n  \n  const tr = document.createElement('tr'); tr.innerHTML = `<td>${ultimaMedicion.id}<\/td><td>${ultimaMedicion.az}<\/td><td>${ultimaMedicion.hd}<\/td>`; tbody.appendChild(tr);\n  document.getElementById('contador-libreta').textContent = libreta.length; mostrarGeom();\n  \n  ultimaMedicion = null; document.getElementById('btn-guardar').style.display = 'none';\n  document.getElementById('lcd-sd').textContent = '----.--- m'; document.getElementById('lcd-hd').textContent = '----.--- m'; document.getElementById('lcd-vd').textContent = '----.--- m';\n  document.querySelectorAll('#lcd-sd, #lcd-hd, #lcd-vd').forEach(el => el.classList.add('vacio'));\n\n  if(libreta.length === posicionesPrismas.length){\n    dibujarMinimapa(); \n    setTimeout(()=>{\n      alert(\"\u00a1Levantamiento completado!\\nEl pol\u00edgono se ha cerrado. Procedemos a la fase de nivelaci\u00f3n de suelos.\");\n      activarNivelacion();\n    }, 500);\n  }\n});\n\n/* ===================== HERRAMIENTAS DE NIVELACI\u00d3N ===================== */\nlet herramienta = 'orbitar', pasoMetros = 1;\nlet cotaObj = 0, acumCorte = 0, acumRelleno = 0;\nconst pincel = {radio:7, fuerza:0.45};\n\nconst anilloPincel = new THREE.Mesh(new THREE.RingGeometry(pincel.radio-0.2, pincel.radio, 32), new THREE.MeshBasicMaterial({color:0x9be88a, side:THREE.DoubleSide, depthTest:false})); anilloPincel.rotation.x = -Math.PI/2; anilloPincel.visible = false; scene.add(anilloPincel);\nfunction moverAnillo(x,z){ anilloPincel.position.set(x, alturaActual(x,z)+0.3, z); anilloPincel.visible = true; }\n\ndocument.querySelectorAll('.btn-paso').forEach(b=>{ b.addEventListener('click', ()=>{ pasoMetros = parseFloat(b.dataset.paso); document.querySelectorAll('.btn-paso').forEach(x=>x.classList.remove('activo')); b.classList.add('activo'); }); });\n\ndocument.querySelectorAll('.btn-herr, #btn-herr-aplanar').forEach(b=>{ \n  b.addEventListener('click', e=>{ \n    herramienta = b.dataset.herr || 'aplanar'; \n    document.querySelectorAll('.btn-herr, #btn-herr-aplanar').forEach(x=>x.classList.remove('activo')); \n    e.target.classList.add('activo'); \n    anilloPincel.material.color.setHex(herramienta==='cavar'?0x7fc4ff:(herramienta==='rellenar'?0xffb86b:0x9be88a)); \n  }); \n});\n\ndocument.getElementById('rango-pincel').addEventListener('input', e=>{ pincel.radio = parseFloat(e.target.value); document.getElementById('d-radio').textContent = pincel.radio+' m'; anilloPincel.geometry.dispose(); anilloPincel.geometry = new THREE.RingGeometry(pincel.radio-0.2, pincel.radio, 32); });\ndocument.getElementById('input-cota-objetivo').addEventListener('input', e=>{ cotaObj = parseFloat(e.target.value)||0; });\n\n/* Despejar \u00e1rboles dentro del lote */\n\n/* Resetear terreno */\ndocument.getElementById('btn-reset-terreno').addEventListener('click', () => {\n  if(typeof quitarRampa==='function') quitarRampa(true);\n  heights.set(heightsIniciales);\n  for(let i=0; i<pos.count; i++) pos.setY(i, heights[i]);\n  pos.needsUpdate = true;\n  geo.computeVertexNormals();\n  actualizarColores();\n  \n  acumCorte = 0; acumRelleno = 0;\n  document.getElementById('d-acorte').textContent = '0.0 m\u00b3';\n  document.getElementById('d-arelleno').textContent = '0.0 m\u00b3';\n  document.getElementById('d-presupuesto').textContent = '$0';\n});\n\nfunction dentroPoligono(x,z){\n  let dentro=false; const poly = posicionesPrismas;\n  for(let i=0,j=poly.length-1;i<poly.length;j=i++){\n    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;\n    if(((zi>z)!==(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) dentro=!dentro;\n  } return dentro;\n}\n\nfunction pintarTerreno(cx,cz){\n  const [cgx,cgz] = coordAGrilla(cx,cz); const rC = Math.ceil(pincel.radio/cellSize)+1; let aplicada = false;\n  for(let gz=Math.max(0,cgz-rC); gz<=Math.min(RES,cgz+rC); gz++){\n    for(let gx=Math.max(0,cgx-rC); gx<=Math.min(RES,cgx+rC); gx++){\n      const i = idxGrid[gz][gx]; const vx = pos.getX(i), vz = pos.getZ(i);\n      if(!dentroPoligono(vx,vz) || rampaBloquea(vx,vz)) continue; \n      const d = Math.hypot(vx-cx, vz-cz); if(d>pincel.radio) continue;\n      \n      const t = 1-d/pincel.radio, falloff = 0.2 + 0.8*(t*t*(3-2*t)); let nuevo;\n      if(herramienta==='aplanar'){ const dif = cotaObj - heights[i]; nuevo = Math.abs(dif)<0.04 ? cotaObj : heights[i] + dif*pincel.fuerza*falloff; }\n      else { nuevo = heights[i] + (herramienta==='cavar'?-1:1)*pasoMetros*falloff; }\n      \n      const real = nuevo - heights[i]; heights[i] = nuevo; pos.setY(i, nuevo);\n      if(real<0) acumCorte += -real*areaCelda; else acumRelleno += real*areaCelda;\n      aplicada = true;\n    }\n  }\n  if(aplicada){\n    pos.needsUpdate=true; geo.computeVertexNormals(); actualizarColores();\n    document.getElementById('d-acorte').textContent = acumCorte.toFixed(1)+' m\u00b3';\n    document.getElementById('d-arelleno').textContent = acumRelleno.toFixed(1)+' m\u00b3';\n    const presupuesto = (acumCorte * 1000) + (acumRelleno * 3500);\n    document.getElementById('d-presupuesto').textContent = '$'+Math.round(presupuesto).toLocaleString();\n  }\n}\n\n/* ===================== EXTRAS\n/* ===== Estaci\u00f3n: bot\u00f3n propio ===== */\nlet colocando = false;\nfunction actualizarBtnColocar(){\n  const b = document.getElementById('btn-colocar');\n  b.textContent = colocando ? '\u274c Cancelar colocaci\u00f3n' : '\ud83d\udccd Colocar estaci\u00f3n';\n  b.style.background = colocando ? '#b23a2e' : '#e8590c';\n  visorWrap.style.cursor = colocando ? 'crosshair' : 'default';\n  if(fase==='ESTRATEGIA') document.getElementById('hud-top').textContent = colocando ? 'Hac\u00e9 clic en el terreno para plantar la estaci\u00f3n.' : 'Arrastr\u00e1 para orbitar. Us\u00e1 \ud83d\udccd Colocar estaci\u00f3n para ubicar o mover el equipo.';\n}\ndocument.getElementById('btn-colocar').addEventListener('click', ()=>{ if(fase!=='ESTRATEGIA') return; colocando = !colocando; actualizarBtnColocar(); });\n\n/* ===== Superficie y per\u00edmetro (con los datos medidos) ===== */\nlet lineaEdif=null;\nfunction mostrarGeom(){\n  const n=posicionesPrismas.length, pts = posicionesPrismas.map(p=>libreta.find(m=>m.id===p.id)).filter(Boolean);\n  const ok = pts.length>=3, full = pts.length===n; let a=0, per=0, ang=0;\n  if(ok) pts.forEach((p,i)=>{ const q=pts[(i+1)%pts.length], r=pts[(i+pts.length-1)%pts.length];\n    a += p.dx*q.dz - q.dx*p.dz; per += Math.hypot(q.dx-p.dx, q.dz-p.dz);\n    const u=[r.dx-p.dx,r.dz-p.dz], w=[q.dx-p.dx,q.dz-p.dz];\n    ang += Math.acos((u[0]*w[0]+u[1]*w[1])/(Math.hypot(u[0],u[1])*Math.hypot(w[0],w[1])))*180/Math.PI; });\n  a = Math.abs(a)/2;\n  document.querySelectorAll('.g-per').forEach(e=>e.textContent = ok ? per.toFixed(2)+' m' : '\u2014');\n  document.querySelectorAll('.g-area').forEach(e=>e.textContent = ok ? a.toFixed(2)+' m\u00b2' : '\u2014');\n  document.querySelectorAll('.g-ha').forEach(e=>e.textContent = ok ? (a/10000).toFixed(4)+' ha' : '\u2014');\n  document.querySelectorAll('.g-ang').forEach(e=>e.textContent = full ? ang.toFixed(2)+'\u00b0 (te\u00f3rico '+((n-2)*180)+'\u00b0)' : '\u2014');\n  if(lineaEdif){ scene.remove(lineaEdif); lineaEdif=null; }\n  document.querySelectorAll('.fila-edif').forEach(e=>e.style.display='none');\n  if(NV===5 && full){\n    const [p1,p2,p3,p4]=pts, fo=Math.hypot(p4.dx-p1.dx,p4.dz-p1.dz), fr=Math.hypot(p2.dx-p1.dx,p2.dz-p1.dz);\n    const ux=(p4.dx-p1.dx)/fo, uz=(p4.dz-p1.dz)/fo, R=3, ps=[];\n    for(let t=0;t<=1.0001;t+=0.05){ const x=estX+p1.dx+R*ux+(p2.dx-p1.dx)*t, z=estZ+p1.dz+R*uz+(p2.dz-p1.dz)*t; ps.push(new THREE.Vector3(x,alturaActual(x,z)+0.25,z)); }\n    lineaEdif = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ps), new THREE.LineBasicMaterial({color:0xff2222})); scene.add(lineaEdif);\n    document.querySelectorAll('.g-edif').forEach(e=>e.textContent=(fr*(fo-R)).toFixed(1)+' m\u00b2');\n    document.querySelectorAll('.fila-edif').forEach(e=>e.style.display='flex');\n  }\n}\n\n/* ===== Cota sugerida y verificaci\u00f3n ===== */\nfunction cotaAuto(){\n  let s=0,n=0; for(let i=0;i<pos.count;i++){ if(dentroPoligono(pos.getX(i),pos.getZ(i)) && !rampaBloquea(pos.getX(i),pos.getZ(i))){ s+=heights[i]; n++; } }\n  if(n){ cotaObj = Math.round(s/n*2)/2; document.getElementById('input-cota-objetivo').value = cotaObj; }\n}\ndocument.getElementById('btn-verificar').addEventListener('click', ()=>{\n  let mx=0,n=0; for(let i=0;i<pos.count;i++){ if(dentroPoligono(pos.getX(i),pos.getZ(i)) && !rampaBloquea(pos.getX(i),pos.getZ(i))){ mx=Math.max(mx,Math.abs(heights[i]-cotaObj)); n++; } }\n  const arb = arbolesGrupos.filter(g=>g.parent && dentroPoligono(g.position.x,g.position.z)).length;\n  const msg = document.getElementById('msg-nivel'), btn = document.getElementById('btn-siguiente');\n  const rv = NV===6 ? evaluarRampa() : {ok:true,falta:[]};\n  if(n>0 && mx<=0.35 && arb===0 && rv.ok){\n    msg.textContent = '\u2705 Terreno nivelado a cota '+cotaObj+' m (desv\u00edo m\u00e1x. '+mx.toFixed(2)+' m).';\n    try{ parent.postMessage({tipo:'completo',nivel:NV},'*'); }catch(e){}\n    if(NV===5){ btn.style.display='block'; btn.textContent='Ir al Nivel 6 \u2192'; btn.onclick=()=>parent.postMessage({tipo:'siguiente',desde:5},'*'); }\n    else { msg.textContent += ' \ud83c\udfc1 \u00a1Completaste los 6 niveles!'; btn.style.display='none'; }\n  } else {\n    const f=[]; if(arb) f.push('despejar '+arb+' \u00e1rbol(es)/roca(s) del pol\u00edgono'); if(mx>0.35) f.push('nivelar (desv\u00edo m\u00e1x. '+mx.toFixed(2)+' m, tolerancia 0.35 m)');\n    rv.falta.forEach(t=>f.push(t)); msg.textContent = 'Falta: '+f.join(' \u00b7 '); btn.style.display='none';\n  }\n});\n\n\n/* ===== Arrastrar \u00e1rboles / rocas fuera del pol\u00edgono ===== */\nlet arrastrado=null;\nfunction punteroACoord(e){ const r=canvas.getBoundingClientRect(); puntero.x=((e.clientX-r.left)/r.width)*2-1; puntero.y=-((e.clientY-r.top)/r.height)*2+1; raycaster.setFromCamera(puntero,camera); }\nvisorWrap.addEventListener('pointerdown', e=>{\n  if(e.button!==0||colocando||(fase!=='ESTRATEGIA'&&fase!=='NIVELAR')) return;\n  if(e.target.closest&&e.target.closest('#controles-fase')) return;\n  punteroACoord(e);\n  const vivos=arbolesGrupos.filter(g=>g.parent), h=raycaster.intersectObjects(vivos,true)[0]; if(!h) return;\n  let g=h.object; while(g&&!vivos.includes(g)) g=g.parent;\n  if(g){ arrastrado=g; e.stopPropagation(); }\n},true);\nwindow.addEventListener('pointermove', e=>{ if(!arrastrado) return; punteroACoord(e); const h=raycaster.intersectObject(terreno)[0]; if(h) arrastrado.position.set(h.point.x,h.point.y,h.point.z); });\nwindow.addEventListener('pointerup', ()=>{ if(!arrastrado) return; const g=arrastrado; arrastrado=null;\n  if(!dentroPoligono(g.position.x,g.position.z)){ scene.remove(g); g.traverse(o=>{ const i=obstaculosVisuales.indexOf(o); if(i>=0) obstaculosVisuales.splice(i,1); }); } });\n\n\n/* ===================== NIVEL 6: CALLE Y RAMPA DE ENTRADA ===================== */\nfunction coordsCalle(x,z){ const c=CALLE6,p=perfilCalle6(); return {t:(x-c.px)*p.dx+(z-c.pz)*p.dz, d:(x-c.px)*p.nx+(z-c.pz)*p.nz}; }\nfunction mundoCalle(t,d){ const c=CALLE6,p=perfilCalle6(); return {x:c.px+p.dx*t+p.nx*d, z:c.pz+p.dz*t+p.nz*d}; }\nfunction cotaVereda(t){ const p=perfilCalle6(); return p.h0+p.g*t+0.16; }\nfunction pendienteRampa(){ return (parseFloat(document.getElementById('input-pend-rampa').value)||0)/100; }\nfunction actualizarCostos(){\n  document.getElementById('d-acorte').textContent = acumCorte.toFixed(1)+' m\\u00b3';\n  document.getElementById('d-arelleno').textContent = acumRelleno.toFixed(1)+' m\\u00b3';\n  document.getElementById('d-presupuesto').textContent = '$'+Math.round(acumCorte*1000+acumRelleno*3500).toLocaleString();\n}\nfunction refrescarTerreno6(){ pos.needsUpdate=true; geo.computeVertexNormals(); actualizarColores(); actualizarCostos(); }\n\nfunction dibujarCalle6(){\n  const c=CALLE6, p=perfilCalle6(), grp=new THREE.Group(), LIM=69.9;\n  let t0=-1e9,t1=1e9;\n  [[c.px,p.dx],[c.pz,p.dz]].forEach(([q,d])=>{ if(Math.abs(d)>1e-6){ const u=(-LIM-q)/d, v=(LIM-q)/d; t0=Math.max(t0,Math.min(u,v)); t1=Math.min(t1,Math.max(u,v)); } });\n  const yC=(x,z)=>p.h0+p.g*((x-c.px)*p.dx+(z-c.pz)*p.dz);\n  const banda=(o0,o1,dy,color,ta,tb)=>{\n    const N=Math.max(1,Math.ceil((tb-ta)/1.5)), P=[], I=[];\n    for(let i=0;i<=N;i++){ const t=ta+(tb-ta)*i/N; [o0,o1].forEach(o=>{ const x=Math.max(-LIM,Math.min(LIM,c.px+p.dx*t+p.nx*o)), z=Math.max(-LIM,Math.min(LIM,c.pz+p.dz*t+p.nz*o)); P.push(x,yC(x,z)+dy,z); }); }\n    for(let i=0;i<N;i++){ const k=i*2; I.push(k,k+1,k+2,k+1,k+3,k+2); }\n    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.setIndex(I); g.computeVertexNormals();\n    return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.95,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));\n  };\n  grp.add(banda(-3.5,3.5,0.10,0x2e2f33,t0,t1));\n  grp.add(banda(3.5,3.8,0.22,0xc9c6bd,t0,t1)); grp.add(banda(-3.8,-3.5,0.22,0xc9c6bd,t0,t1));\n  grp.add(banda(3.8,5.5,0.16,0x9d9a90,t0,t1)); grp.add(banda(-5.5,-3.8,0.16,0x9d9a90,t0,t1));\n  for(let t=t0+2;t<t1-3;t+=6) grp.add(banda(-0.1,0.1,0.14,0xf2c230,t,t+3));\n  scene.add(grp);\n}\nif(NV===6) dibujarCalle6();\n\nlet entrada6=null, rampaDrag=null, rampaPrev=null;\nconst RAMPA_MIN_ANCHO=3, RAMPA_MAX_ANCHO=8, RAMPA_MAX_PEND=12;\nfunction rampaBloquea(x,z){\n  if(!entrada6) return false; const q=coordsCalle(x,z), s=Math.abs(q.d);\n  return Math.sign(q.d)===entrada6.lado && s>=CALLE_MEDIA && s<=entrada6.s1+3 && q.t>=entrada6.t0-3 && q.t<=entrada6.t1+3;\n}\nfunction rectDesdeArrastre(a,b){ const qa=coordsCalle(a.x,a.z), qb=coordsCalle(b.x,b.z); return {t0:Math.min(qa.t,qb.t), t1:Math.max(qa.t,qb.t), da:qa.d, db:qb.d}; }\nfunction limpiarPrevia(){ if(rampaPrev){ scene.remove(rampaPrev); rampaPrev.geometry.dispose(); rampaPrev=null; } }\nfunction dibujarPrevia(){\n  limpiarPrevia(); if(!rampaDrag) return; const r=rectDesdeArrastre(rampaDrag.a,rampaDrag.b);\n  const pts=[[r.t0,r.da],[r.t1,r.da],[r.t1,r.db],[r.t0,r.db],[r.t0,r.da]].map(([t,d])=>{ const w=mundoCalle(t,d); return new THREE.Vector3(w.x,alturaActual(w.x,w.z)+0.5,w.z); });\n  rampaPrev=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0xffd54a, depthTest:false})); rampaPrev.renderOrder=10; scene.add(rampaPrev);\n}\nfunction iniciarRampa(e){ punteroACoord(e); const h=raycaster.intersectObject(terreno)[0]; if(!h) return; rampaDrag={a:h.point.clone(), b:h.point.clone()}; dibujarPrevia(); }\nfunction moverRampa(pt){ if(!rampaDrag) return; rampaDrag.b.copy(pt); dibujarPrevia(); }\nwindow.addEventListener('pointerup',()=>{\n  if(!rampaDrag) return; const r=rectDesdeArrastre(rampaDrag.a,rampaDrag.b), mov=Math.hypot(rampaDrag.b.x-rampaDrag.a.x,rampaDrag.b.z-rampaDrag.a.z); rampaDrag=null; limpiarPrevia();\n  if(mov>1) crearRampa(r);\n});\nfunction crearRampa(r){\n  const msg=document.getElementById('msg-rampa'), fail=t=>{ msg.textContent=t; msg.style.color='#b23a2e'; };\n  if(Math.sign(r.da)!==Math.sign(r.db)) return fail('El rect\\u00e1ngulo cruza la calle. Dibujalo del lado del lote.');\n  const lado=Math.sign(r.da)||-1, sa=Math.abs(r.da), sb=Math.abs(r.db), sNear=Math.min(sa,sb), sFar=Math.max(sa,sb);\n  if(sNear>CALLE_MEDIA+3) return fail('La entrada6 tiene que nacer en la vereda: empez\\u00e1 a arrastrar sobre la vereda (franja gris claro junto a la calle).');\n  if(sFar-CALLE_MEDIA<2) return fail('La entrada6 qued\\u00f3 muy corta. Arrastr\\u00e1 m\\u00e1s hacia adentro del lote.');\n  if(r.t1-r.t0<1.5) return fail('La entrada6 qued\\u00f3 muy angosta (m\\u00ednimo 3 m).');\n  quitarRampa(true);\n  entrada6={t0:r.t0,t1:r.t1,s1:sFar,lado,snap:new Map(),corte:0,relleno:0,mesh:null};\n  aplicarRampa();\n}\nfunction restaurarRampaTerreno(){\n  if(!entrada6) return;\n  entrada6.snap.forEach((h,i)=>{ heights[i]=h; pos.setY(i,h); });\n  acumCorte=Math.max(0,acumCorte-rampa.corte); acumRelleno=Math.max(0,acumRelleno-rampa.relleno);\n  entrada6.corte=0; entrada6.relleno=0; entrada6.snap.clear();\n}\nfunction aplicarRampa(){\n  if(!entrada6) return; restaurarRampaTerreno();\n  const r=entrada6, pend=pendienteRampa();\n  for(let i=0;i<pos.count;i++){\n    const q=coordsCalle(pos.getX(i),pos.getZ(i)); if(Math.sign(q.d)!==r.lado) continue;\n    const s=Math.abs(q.d); if(s<CALLE_MEDIA) continue;\n    const dt=Math.max(r.t0-1-q.t, q.t-(r.t1+1), 0), ds=Math.max(s-(r.s1+1),0), dout=Math.hypot(dt,ds);\n    if(dout>=2) continue;\n    const w=dout<=0?1:(u=>u*u*(3-2*u))(1-dout/2);\n    const plano=cotaVereda(q.t)+pend*(Math.min(s,r.s1)-CALLE_MEDIA), nuevo=heights[i]*(1-w)+plano*w, real=nuevo-heights[i];\n    if(!r.snap.has(i)) r.snap.set(i,heights[i]);\n    heights[i]=nuevo; pos.setY(i,nuevo);\n    if(real<0) r.corte+=-real*areaCelda; else r.relleno+=real*areaCelda;\n  }\n  acumCorte+=r.corte; acumRelleno+=r.relleno;\n  if(r.mesh){ scene.remove(r.mesh); r.mesh.geometry.dispose(); r.mesh=null; }\n  const cs=[[r.t0,CALLE_MEDIA],[r.t1,CALLE_MEDIA],[r.t1,r.s1],[r.t0,r.s1]].map(([t,s])=>{ const w=mundoCalle(t,r.lado*s); return [w.x, cotaVereda(t)+pend*(s-CALLE_MEDIA)+0.07, w.z]; });\n  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute([...cs[0],...cs[1],...cs[2],...cs[0],...cs[2],...cs[3]],3)); g.computeVertexNormals();\n  r.mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xb9b5aa,roughness:.9,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3})); scene.add(r.mesh);\n  refrescarTerreno6(); actualizarInfoRampa();\n}\nfunction quitarRampa(silencioso){\n  if(entrada6){ restaurarRampaTerreno(); if(entrada6.mesh){ scene.remove(entrada6.mesh); entrada6.mesh.geometry.dispose(); } entrada6=null; refrescarTerreno6(); }\n  if(!silencioso) actualizarInfoRampa();\n}\nfunction evaluarRampa(){\n  if(!entrada6) return {ok:false, L:['\\u2717 Todav\\u00eda no trazaste la entrada6 de entrada.'], falta:['trazar la entrada6 de entrada desde la vereda hasta el lote']};\n  const r=entrada6, pendPct=pendienteRampa()*100, ancho=r.t1-r.t0, largo=r.s1-CALLE_MEDIA, tc=(r.t0+r.t1)/2;\n  const anchoOk=ancho>=RAMPA_MIN_ANCHO-1e-6 && ancho<=RAMPA_MAX_ANCHO+1e-6, pendOk=Math.abs(pendPct)<=RAMPA_MAX_PEND+1e-6;\n  const wf=mundoCalle(tc,r.lado*r.s1), dentro=dentroPoligono(wf.x,wf.z);\n  const cIni=cotaVereda(tc), cFin=cIni+pendienteRampa()*largo, dif=cFin-cotaObj, empalme=Math.abs(dif)<=0.35;\n  const L=[], falta=[];\n  L.push((anchoOk?'\\u2713':'\\u2717')+' Ancho '+ancho.toFixed(1)+' m (3 a 8 m)'); if(!anchoOk) falta.push('ajustar el ancho de la entrada6 (3 a 8 m)');\n  L.push((pendOk?'\\u2713':'\\u2717')+' Pendiente '+pendPct.toFixed(1)+' % (m\\u00e1x. 12 %)'); if(!pendOk) falta.push('bajar la pendiente de la entrada6 (m\\u00e1x. 12 %)');\n  L.push((dentro?'\\u2713':'\\u2717')+' La entrada6 llega hasta el interior del lote'); if(!dentro) falta.push('llevar la entrada6 hasta el interior del lote');\n  L.push((empalme?'\\u2713':'\\u2717')+' Empalme: la entrada6 termina en cota '+cFin.toFixed(2)+' m, el lote est\\u00e1 a '+cotaObj.toFixed(2)+' m'+(empalme?'':(dif>0?' \\u2192 queda alta: baj\\u00e1 la pendiente o acortala':' \\u2192 queda baja: sub\\u00ed la pendiente o alargala')));\n  if(!empalme) falta.push('hacer coincidir el final de la entrada6 con la cota del lote ('+cotaObj.toFixed(2)+' m)');\n  return {ok:anchoOk&&pendOk&&dentro&&empalme, L, falta};\n}\nfunction actualizarInfoRampa(){\n  const info=document.getElementById('info-rampa'), msg=document.getElementById('msg-rampa'); if(!info) return;\n  const tF=entrada6?(entrada6.t0+entrada6.t1)/2:coordsCalle(2.5,37.5).t, cv=cotaVereda(tF), desn=cotaObj-cv;\n  info.innerHTML='Cota de vereda frente al lote: <b>'+cv.toFixed(2)+' m<\/b><br>Cota objetivo del lote: <b>'+cotaObj.toFixed(2)+' m<\/b><br>Desnivel a salvar: <b>'+desn.toFixed(2)+' m<\/b>'+(Math.abs(desn)>0.01?' (con 12 % necesit\\u00e1s al menos '+(Math.abs(desn)/0.12).toFixed(1)+' m de largo)':'');\n  const ev=evaluarRampa(); msg.innerHTML=ev.L.join('<br>'); msg.style.color=ev.ok?'#2e7d32':'#b23a2e';\n}\ndocument.getElementById('input-pend-rampa').addEventListener('input',()=>{ if(entrada6) aplicarRampa(); else actualizarInfoRampa(); });\ndocument.getElementById('input-cota-objetivo').addEventListener('input',()=>{ if(NV===6) actualizarInfoRampa(); });\ndocument.getElementById('btn-quitar-rampa').addEventListener('click',()=>quitarRampa(false));\n\n/* ===================== RESIZE ===================== */\nfunction resize(){\n  const w = visorWrap.clientWidth, h = visorWrap.clientHeight;\n  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();\n}\nwindow.addEventListener('resize', resize); resize(); animar();\n<\/script>\n<\/body>\n<\/html>";
const HASH=location.hash.slice(1), MODO_PRUEBA=/^(todos|nivel[1-6])$/.test(HASH), NIVEL_INI=(MODO_PRUEBA&&/^nivel/.test(HASH))?+HASH.slice(5):1;
let unl = MODO_PRUEBA ? 6 : 1, cur=1, n14=0;

f14.srcdoc=SRC_A;

  for(let n=1;n<=6;n++){ const b=document.createElement('button'); b.className='tab'+(n===cur?' act':''); b.textContent=(n>unl?'🔒 ':'')+'Nivel '+n; b.disabled=n>unl; b.onclick=()=>ir(n); t.appendChild(b); } }

  else { const f=n===5?f5:f6; if(!f.srcdoc) f.srcdoc=SRC_S.replace('<head>','<head><script>window.NIVEL='+n+'<\/script>'); f.classList.add('vis'); } }

if(NIVEL_INI>=2&&NIVEL_INI<=4) f14.addEventListener('load',()=>f14.contentWindow.postMessage({tipo:'cargar',nivel:NIVEL_INI},'*'),{once:true});
