<style>html,body{margin:0;height:100%;background:#101216;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}
#barra{height:42px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#2c2418;color:#f4ecd8;box-sizing:border-box}
#barra b{margin-right:10px;font-size:13px;letter-spacing:.05em}

.tab.act{background:#e8590c;border-color:#fff;color:#fff;font-weight:700}.tab:disabled{opacity:.4;cursor:not-allowed}

<script>
const SRC_A="<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Simulador Topogr\u00e1fico \u2014 Por Niveles<\/title>\n<style>\n  :root{\n    --tierra-1:#f4ecd8;\n    --tierra-2:#e3d5b3;\n    --tinta:#2c2418;\n    --linea:#8a7857;\n    --naranja:#e8590c;\n    --verde-cota:#5c7a3f;\n    --verde-ok:#4a8a3a;\n    --rojo-aviso:#b23a2e;\n    --panel-borde:#c9b98c;\n    --hud-fondo:rgba(18,20,24,.82);\n    --mono: 'Courier New', ui-monospace, monospace;\n    --sans: 'Segoe UI', Arial, sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;background:#101216;font-family:var(--sans);overflow:hidden;}\n  #app{position:relative;width:100vw;height:100vh;display:flex;}\n  #canvas-wrap{flex:1;position:relative;}\n  canvas{display:block;width:100%;height:100%;}\n  canvas.modo-orbitar{cursor:grab;}\n  canvas.modo-levantar{cursor:crosshair;}\n  canvas.modo-obstaculos{cursor:pointer;}\n  canvas.modo-nivelar{cursor:cell;}\n  canvas.modo-lote{cursor:grab;}\n\n  #hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;pointer-events:none;}\n  #titulo h1{margin:0;font-size:15px;letter-spacing:.02em;font-weight:600;color:var(--tierra-1);}\n  #titulo p{margin:2px 0 0;font-size:12px;color:#a9a08a;font-family:var(--mono);}\n  #badge-nivel{background:var(--naranja);color:#fff;font-family:var(--mono);font-size:12px;padding:5px 10px;letter-spacing:.03em;pointer-events:none;}\n\n  #columna-izquierda{position:absolute;top:64px;left:18px;width:196px;display:flex;flex-direction:column;gap:10px;}\n  #barra-modos{display:flex;flex-direction:column;gap:5px;background:var(--hud-fondo);padding:8px;border-radius:3px;}\n  .btn-modo{padding:9px 10px;font-family:var(--sans);font-size:12.5px;font-weight:600;background:transparent;color:#dcd3bd;border:1px solid transparent;cursor:pointer;text-align:left;border-radius:2px;}\n  .btn-modo:hover{background:rgba(227,213,179,.12);}\n  .btn-modo.activo{background:var(--naranja);color:#fff;}\n\n  #banner-instrucciones{background:var(--hud-fondo);color:var(--tierra-1);padding:10px 12px;font-size:12px;font-family:var(--mono);line-height:1.45;border-radius:3px;}\n  #barra-progreso-wrap{background:var(--hud-fondo);padding:9px 12px;border-radius:3px;font-family:var(--mono);}\n  #barra-progreso-fondo{width:100%;height:8px;background:rgba(255,255,255,.15);margin-top:5px;border-radius:4px;overflow:hidden;}\n  #barra-progreso-relleno{height:100%;width:0%;background:var(--verde-ok);transition:width .25s;}\n\n  #panel{width:340px;min-width:340px;background:var(--tierra-1);border-left:1px solid var(--panel-borde);display:flex;flex-direction:column;color:var(--tinta);}\n  #panel-scroll{overflow-y:auto;padding:20px 20px 12px;flex:1;}\n  #panel h2{font-size:13px;margin:0 0 4px;font-weight:700;border-bottom:2px solid var(--tinta);padding-bottom:8px;}\n  #panel .sub{font-size:11px;color:var(--linea);font-family:var(--mono);margin:0 0 16px;}\n\n  .seccion{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--panel-borde);}\n  .seccion:last-child{border-bottom:none;}\n  .seccion h3{font-size:11px;font-weight:700;margin:0 0 8px;color:var(--verde-cota);display:flex;justify-content:space-between;align-items:center;}\n\n  .dato{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:13px;padding:4px 0;border-bottom:1px dotted var(--panel-borde);}\n  .dato span:first-child{color:var(--linea);font-size:11px;}\n  .dato span:last-child{font-weight:700;}\n\n  #lista-puntos, #lista-lados, #lista-calle{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12px;max-height:140px;overflow-y:auto;}\n  #lista-calle li{padding:3px 0;border-bottom:1px dotted #ddd0ac;}\n  #lista-puntos li{padding:3px 0;border-bottom:1px dotted #ddd0ac;}\n  #lista-puntos li b{color:var(--naranja);}\n  #lista-lados li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dotted #ddd0ac;}\n  #lista-lados li span:first-child{flex:1;color:var(--tinta);}\n  .valor-lado{min-width:64px;text-align:right;font-weight:700;}\n\n  .btn{width:100%;padding:9px 10px;margin-top:6px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;}\n  .btn:hover{background:var(--tinta);color:var(--tierra-1);}\n  .btn.principal{background:var(--naranja);border-color:var(--naranja);color:#fff;}\n  .btn.principal:hover{background:#c94a08;border-color:#c94a08;}\n  .btn.exito{background:var(--verde-ok);border-color:var(--verde-ok);color:#fff;}\n  .btn.exito:hover{background:#3d7530;border-color:#3d7530;}\n  .btn:disabled{opacity:.35;cursor:not-allowed;}\n  .btn:disabled:hover{background:transparent;color:var(--tinta);}\n  .btn-medir{padding:4px 9px;border:1px solid var(--tinta);background:transparent;font-family:var(--sans);font-size:11px;font-weight:700;cursor:pointer;}\n  .btn-medir:hover{background:var(--tinta);color:#fff;}\n  .btn-medir:disabled{background:var(--verde-cota);border-color:var(--verde-cota);color:#fff;opacity:1;cursor:default;}\n\n  .fila-pasos{display:flex;gap:5px;}\n  .btn-paso{flex:1;padding:8px 4px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;}\n  .btn-paso:hover{background:rgba(44,36,24,.12);}\n  .btn-paso.activo{background:var(--tinta);color:var(--tierra-1);}\n  .fila-herramientas{display:flex;gap:5px;}\n  .btn-herr{flex:1;padding:9px 4px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;}\n  .btn-herr:hover{background:rgba(44,36,24,.12);}\n  .btn-herr.activo{background:var(--naranja);border-color:var(--naranja);color:#fff;}\n  #btn-herr-aplanar.activo{background:var(--verde-cota);border-color:var(--verde-cota);color:#fff;}\n  .fila-categoria{display:flex;gap:5px;margin-bottom:8px;}\n  .btn-cat{flex:1;padding:9px 4px;border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;}\n  .btn-cat:hover{background:rgba(44,36,24,.12);}\n  .btn-cat.activo{background:var(--tinta);color:var(--tierra-1);}\n\n  .modal-overlay{position:fixed;inset:0;background:rgba(10,10,12,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}\n  .modal-card{background:var(--tierra-1);max-width:560px;width:100%;max-height:82vh;overflow-y:auto;padding:20px 22px;border:1px solid var(--panel-borde);color:var(--tinta);}\n  .modal-card pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:#fff;border:1px solid var(--panel-borde);padding:12px;max-height:50vh;overflow-y:auto;}\n\n  .fila-medidas{display:flex;gap:8px;margin-bottom:8px;}\n  .fila-medidas div{flex:1;}\n  .fila-medidas label{font-size:10.5px;color:var(--linea);display:block;margin-bottom:3px;}\n  .fila-medidas input{width:100%;padding:7px;font-family:var(--mono);font-size:13px;border:1px solid var(--panel-borde);background:#fff;}\n\n  #panel input[type=range],#panel input[type=number]{width:100%;margin:4px 0 10px;}\n  #panel input[type=number]{padding:6px;font-family:var(--mono);border:1px solid var(--panel-borde);background:#fff;}\n  .etiqueta-rango{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--linea);}\n\n  #instrucciones-fijas{font-size:12px;line-height:1.5;color:var(--linea);background:var(--tierra-2);border:1px solid var(--panel-borde);padding:10px 12px;margin-bottom:16px;}\n  #instrucciones-fijas b{color:var(--tinta);}\n  .nota-mini{font-size:11.5px;color:var(--linea);margin:8px 0;}\n  .aviso{font-size:12px;color:#fff;background:var(--rojo-aviso);padding:8px 10px;margin:8px 0;display:none;}\n\n  #footer-panel{padding:12px 20px;border-top:1px solid var(--panel-borde);font-size:10.5px;color:var(--linea);font-family:var(--mono);}\n\n  #leyenda{position:absolute;bottom:18px;left:18px;display:flex;align-items:center;gap:8px;background:var(--hud-fondo);padding:8px 12px;color:var(--tierra-1);font-size:11px;font-family:var(--mono);pointer-events:none;}\n  #barra-cota{width:130px;height:10px;background:linear-gradient(90deg,#24391a,#4b6b2c,#8a7a2e,#6b4423,#cbb98a);}\n\n  @media (max-width:760px){\n    #app{flex-direction:column;}\n    #panel{width:100%;min-width:0;max-height:50vh;order:2;border-left:none;border-top:1px solid var(--panel-borde);}\n    #canvas-wrap{order:1;height:50vh;}\n    #columna-izquierda{top:56px;left:8px;width:150px;}\n    .btn-modo{font-size:11px;padding:7px 8px;}\n    #banner-instrucciones{font-size:10.5px;padding:8px 9px;}\n    #leyenda{display:none;}\n  }\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n  <div id=\"canvas-wrap\">\n    <canvas id=\"c\" class=\"modo-orbitar\"><\/canvas>\n    <div id=\"hud-top\">\n      <div id=\"titulo\">\n        <h1 id=\"titulo-nivel\">SIMULADOR TOPOGR\u00c1FICO \u2014 NIVEL 1<\/h1>\n        <p id=\"subtitulo-nivel\">Terreno \"El Bajo\" \u00b7 relevamiento de campo<\/p>\n      <\/div>\n      <div id=\"badge-nivel\">N.1<\/div>\n    <\/div>\n    <div id=\"columna-izquierda\">\n      <div id=\"barra-modos\">\n        <button class=\"btn-modo activo\" data-modo=\"orbitar\">\ud83e\udded Orbitar<\/button>\n        <button class=\"btn-modo\" data-modo=\"levantar\">\ud83d\udccd Levantar<\/button>\n        <button class=\"btn-modo\" data-modo=\"obstaculos\">\ud83c\udf32 Quitar obst\u00e1culos<\/button>\n        <button class=\"btn-modo\" data-modo=\"lote\">\ud83d\udcd0 Ubicar lote<\/button>\n        <button class=\"btn-modo\" data-modo=\"nivelar\">\u26cf\ufe0f Nivelar terreno<\/button>\n        <button class=\"btn-modo\" data-modo=\"calle\" id=\"btn-modo-calle\" style=\"display:none\">\ud83d\udee3\ufe0f Trazar calle<\/button>\n      <\/div>\n      <div id=\"banner-instrucciones\">Arrastr\u00e1 para rotar la vista \u00b7 rueda para acercar/alejar.<\/div>\n      <div id=\"barra-progreso-wrap\" style=\"display:none\">\n        <div class=\"etiqueta-rango\" style=\"color:var(--tierra-1);opacity:.85\"><span>Nivelaci\u00f3n de lotes<\/span><span id=\"txt-progreso-nivel\">0%<\/span><\/div>\n        <div id=\"barra-progreso-fondo\"><div id=\"barra-progreso-relleno\"><\/div><\/div>\n      <\/div>\n    <\/div>\n    <div id=\"leyenda\"><span>cota baja<\/span><div id=\"barra-cota\"><\/div><span>cota alta<\/span><\/div>\n  <\/div>\n\n  <div id=\"panel\">\n    <div id=\"panel-scroll\">\n      <h2>Libreta de c\u00e1lculo<\/h2>\n      <p class=\"sub\">poligonal levantada por v\u00e9rtices<\/p>\n\n      <div id=\"instrucciones-fijas\">\n        <b>Consigna:<\/b> despej\u00e1 los obst\u00e1culos que estorben, ubic\u00e1 el/los lote(s) en la mejor parte del terreno, med\u00ed cada lado a mano y nivel\u00e1 moviendo el m\u00ednimo volumen de tierra posible.\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>1 \u00b7 V\u00c9RTICES<\/h3>\n        <ol id=\"lista-puntos\"><li style=\"color:#a99a6f\">\u2014 sin estacas clavadas \u2014<\/li><\/ol>\n        <div class=\"dato\" id=\"fila-area-parcial\" style=\"display:none\"><span>\u00c1rea parcial (aprox.)<\/span><span id=\"d-area-parcial\">\u2014<\/span><\/div>\n        <button class=\"btn\" id=\"btn-deshacer\" disabled>Deshacer \u00faltima estaca<\/button>\n        <button class=\"btn\" id=\"btn-cerrar\" disabled>Cerrar poligonal<\/button>\n        <button class=\"btn\" id=\"btn-reiniciar\">Reiniciar levantamiento actual<\/button>\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>LOTE A UBICAR <span id=\"d-lote-contador\" style=\"font-family:var(--mono);color:var(--linea)\">0/1<\/span><\/h3>\n        <div id=\"lista-lotes-guardados\"><\/div>\n        <div class=\"fila-categoria\" id=\"fila-modo-lote\" style=\"display:none\">\n          <button class=\"btn-cat activo\" data-modolote=\"medidas\">\ud83d\udccf Medidas fijas<\/button>\n          <button class=\"btn-cat\" data-modolote=\"area\">\ud83c\udfaf \u00c1rea objetivo<\/button>\n        <\/div>\n        <div id=\"lote-medidas-fijas\">\n          <div class=\"fila-medidas\">\n            <div><label>Ancho (m)<\/label><input type=\"number\" id=\"input-ancho-lote\" value=\"10\" min=\"1\"><\/div>\n            <div><label>Largo (m)<\/label><input type=\"number\" id=\"input-largo-lote\" value=\"30\" min=\"1\"><\/div>\n          <\/div>\n          <button class=\"btn principal\" id=\"btn-crear-lote\">Crear lote<\/button>\n          <p class=\"nota-mini\">Cambi\u00e1 a modo \"\ud83d\udcd0 Ubicar lote\" arriba y arrastr\u00e1 el rect\u00e1ngulo naranja hasta la mejor posici\u00f3n. El lote debe dar frente (m\u00edn. 8 m) a la calle proyectada gris, sin invadirla. Us\u00e1 \u27f2 \u27f3 para girarlo.<\/p>\n          <div style=\"display:flex;gap:6px;margin:6px 0;\"><button class=\"btn\" id=\"btn-rot-izq\">\u27f2 Girar 15\u00b0<\/button><button class=\"btn\" id=\"btn-rot-der\">Girar 15\u00b0 \u27f3<\/button><\/div>\n        <button class=\"btn\" id=\"btn-fijar-lote\" disabled>Fijar posici\u00f3n y levantar poligonal<\/button>\n          <button class=\"btn\" id=\"btn-quitar-lote\" disabled>Quitar lote<\/button>\n        <\/div>\n        <div id=\"lote-area-objetivo\" style=\"display:none\">\n          <label style=\"font-size:10.5px;color:var(--linea);display:block;margin-bottom:4px\">\u00c1rea objetivo (m\u00b2)<\/label>\n          <input type=\"number\" id=\"input-area-objetivo\" value=\"250\" min=\"1\">\n          <p class=\"nota-mini\">No hay rect\u00e1ngulo prearmado: cambi\u00e1 a modo \"\ud83d\udccd Levantar\" y clav\u00e1 vos las estacas hasta formar un pol\u00edgono cuya \u00e1rea quede dentro del \u00b18% del objetivo.<\/p>\n          <button class=\"btn principal\" id=\"btn-empezar-area\">Fijar objetivo y empezar a levantar<\/button>\n        <\/div>\n        <div class=\"aviso\" id=\"aviso-lote\"><\/div>\n      <\/div>\n\n      <div class=\"seccion\" id=\"seccion-casa\" style=\"display:none\">\n        <h3>CASA<\/h3>\n        <p class=\"nota-mini\">Con el lote nivelado y seleccionado, eleg\u00ed un modelo y arrastralo sobre el lote. Retiros: frente 3 m, resto 1,5 m <span id=\"nota-retiros\">(si no se cumplen es solo una advertencia: igual pod\u00e9s fijar la casa)<\/span>. Al fijar la casa, el terreno de su entorno queda bloqueado; \"Quitar casa\" lo libera.<\/p>\n        <div style=\"display:flex;gap:6px;\"><button class=\"btn\" id=\"btn-casa-a\">Casa A \u00b7 7\u00d711 m<\/button><button class=\"btn\" id=\"btn-casa-b\">Casa B \u00b7 9\u00d712 m<\/button><\/div>\n        <div style=\"display:flex;gap:6px;margin-top:6px;\"><button class=\"btn\" id=\"btn-casa-izq\">\u27f2 Girar<\/button><button class=\"btn\" id=\"btn-casa-der\">Girar \u27f3<\/button><\/div>\n        <button class=\"btn\" id=\"btn-casa-fijar\" style=\"margin-top:6px;\">Fijar casa<\/button>\n        <button class=\"btn\" id=\"btn-casa-quitar\">Quitar casa<\/button>\n        <p id=\"msg-casa\" style=\"font-size:12px;font-weight:700;margin:6px 0;\"><\/p>\n      <\/div>\n      <div class=\"seccion\" id=\"seccion-calle\" style=\"display:none\">\n        <h3>CALLE DE ACCESO<\/h3>\n        <p class=\"nota-mini\">Traz\u00e1 el recorrido con clics sobre el terreno, uniendo los lotes. Pendiente m\u00e1xima admitida: <b id=\"d-pendiente-max-calle\">10%<\/b> por tramo.<\/p>\n        <ol id=\"lista-calle\"><li style=\"color:#a99a6f\">\u2014 sin puntos trazados \u2014<\/li><\/ol>\n        <button class=\"btn\" id=\"btn-deshacer-calle\" disabled>Deshacer \u00faltimo punto<\/button>\n        <button class=\"btn\" id=\"btn-reiniciar-calle\">Reiniciar calle<\/button>\n        <div class=\"dato\"><span>Tramos dentro de norma<\/span><span id=\"d-calle-estado\">0/0<\/span><\/div>\n      <\/div>\n\n      <div class=\"seccion\" id=\"seccion-lados\" style=\"display:none\">\n        <h3>2 \u00b7 MEDIR LADOS (en el terreno)<\/h3>\n        <ol id=\"lista-lados\"><\/ol>\n        <div class=\"dato\"><span>Per\u00edmetro<\/span><span id=\"d-perim\">0/0 lados medidos<\/span><\/div>\n      <\/div>\n\n      <div class=\"seccion\" id=\"seccion-area\" style=\"display:none\">\n        <h3>3 \u00b7 \u00c1REA Y PENDIENTES<\/h3>\n        <button class=\"btn principal\" id=\"btn-calc-area\" disabled>Calcular \u00e1rea (f\u00f3rmula de Gauss)<\/button>\n        <div class=\"dato\"><span>\u00c1rea encerrada<\/span><span id=\"d-area\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Cota m\u00ednima<\/span><span id=\"d-cotamin\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Cota m\u00e1xima<\/span><span id=\"d-cotamax\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Desnivel total<\/span><span id=\"d-desnivel\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Pendiente media<\/span><span id=\"d-pend\">\u2014<\/span><\/div>\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>OBST\u00c1CULOS <span id=\"d-obst-contador\" style=\"font-family:var(--mono);color:var(--linea)\">\u2014<\/span><\/h3>\n        <p class=\"nota-mini\">En modo \"Quitar obst\u00e1culos\", arrastr\u00e1 un \u00e1rbol o roca fuera del l\u00edmite del terreno para retirarlo.<\/p>\n        <button class=\"btn\" id=\"btn-restaurar-obst\">Restaurar obst\u00e1culos originales<\/button>\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>MOVIMIENTO DE SUELO<\/h3>\n        <div id=\"controles-pasos\">\n          <div class=\"fila-categoria\" id=\"fila-categoria\">\n            <button class=\"btn-cat activo\" data-cat=\"gruesa\">\u26cf\ufe0f Pala gruesa<\/button>\n            <button class=\"btn-cat\" data-cat=\"fina\">\ud83e\ude9b Afinadora fina<\/button>\n          <\/div>\n          <p class=\"nota-mini\" id=\"nota-categoria\">La pala gruesa mueve mucho por pasada pero es <b>imprecisa<\/b> (\u00b115%) \u2014 ideal para el desbaste grueso. Pas\u00e1 a la afinadora para el ajuste fino y exacto.<\/p>\n          <label style=\"font-size:10.5px;color:var(--linea);display:block;margin-bottom:4px\">Profundidad / altura por pasada<\/label>\n          <div class=\"fila-pasos\" id=\"fila-pasos\"><\/div>\n          <label style=\"font-size:10.5px;color:var(--linea);display:block;margin:10px 0 4px\">Herramienta<\/label>\n          <div class=\"fila-herramientas\">\n            <button class=\"btn-herr\" data-herr=\"cavar\">\u26cf\ufe0f Cavar<\/button>\n            <button class=\"btn-herr\" data-herr=\"rellenar\">\ud83e\uddf1 Rellenar<\/button>\n          <\/div>\n        <\/div>\n        <p class=\"nota-mini\" id=\"nota-nivel1-simple\" style=\"display:none\">En este nivel trabaj\u00e1s solo con \"Aplanar\" \u2014 es la forma m\u00e1s f\u00e1cil de emparejar sin cavar pozos ni apilar de m\u00e1s. Las herramientas de cavar/rellenar por pasos se habilitan desde el Nivel 2.<\/p>\n        <button class=\"btn activo\" id=\"btn-herr-aplanar\">\ud83e\ude9a Aplanar hacia cota objetivo (terminado fino)<\/button>\n        <p class=\"nota-mini\">El aplanado se usa manteniendo presionado y arrastrando: empareja suave hacia la cota objetivo, ideal para el acabado final.<\/p>\n        <div class=\"etiqueta-rango\" style=\"margin-top:8px\"><span>Radio de pincel<\/span><span id=\"d-radio\">7 m<\/span><\/div>\n        <input type=\"range\" id=\"rango-pincel\" min=\"3\" max=\"16\" value=\"7\">\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>NIVELACI\u00d3N (cota objetivo)<\/h3>\n        <button class=\"btn\" id=\"btn-toggle-curvas\">Ocultar curvas de nivel<\/button>\n        <p class=\"nota-mini\"><b>Cada lote tiene su propia cota objetivo.<\/b> Eleg\u00ed a cu\u00e1l le est\u00e1s editando la cota antes de tocar los botones de abajo:<\/p>\n        <div class=\"fila-categoria\" id=\"selector-lotes\"><\/div>\n        <button class=\"btn\" id=\"btn-nivelar-frente\">\ud83d\udee3\ufe0f Nivelar franja frontal<\/button>\n        <p class=\"nota-mini\" id=\"msg-frente\" style=\"font-weight:700\"><\/p>\n        <label style=\"font-size:10.5px;color:var(--linea);display:block;margin:8px 0 3px\">Cota objetivo del lote seleccionado (m) \u2014 la curva naranja marca ese nivel<\/label>\n        <input type=\"number\" id=\"input-cota-objetivo\" value=\"0\" step=\"0.1\">\n        <div id=\"fila-pend\" style=\"display:none\"><p class=\"nota-mini\">Desag\u00fce: el lote sube con esta pendiente desde la calle hacia el fondo (1 a 2,5 %). El pincel Aplanar sigue ese plano inclinado.<\/p><label>Pendiente hacia la calle (%)<\/label> <input type=\"number\" id=\"input-pend\" value=\"1.5\" step=\"0.5\" min=\"0\" max=\"5\" style=\"width:70px;\"><\/div>\n        <div style=\"display:flex;gap:6px;margin:0 0 8px\">\n          <button class=\"btn\" id=\"btn-bajar-curva\" style=\"margin-top:0\">\u25bc Bajar 1 curva<\/button>\n          <button class=\"btn\" id=\"btn-subir-curva\" style=\"margin-top:0\">\u25b2 Subir 1 curva<\/button>\n        <\/div>\n        <div id=\"fila-cota-reco\" style=\"display:none\"><button class=\"btn\" id=\"btn-cota-reco\">\ud83c\udfaf Cota recomendada para el lote<\/button><p class=\"nota-mini\" id=\"msg-cota-reco\" style=\"font-weight:700\"><\/p><\/div>\n        <button class=\"btn\" id=\"btn-usar-cota-proyecto\">Usar cota de proyecto calculada<\/button>\n        <div class=\"dato\"><span>Tierra cortada (acum.)<\/span><span id=\"d-acorte\">0.0 m\u00b3<\/span><\/div>\n        <div class=\"dato\"><span>Tierra rellenada (acum.)<\/span><span id=\"d-arelleno\">0.0 m\u00b3<\/span><\/div>\n        <button class=\"btn\" id=\"btn-calc-objetivo\" disabled>Calcular corte/relleno objetivo<\/button>\n        <div class=\"dato\"><span>Cota de proyecto<\/span><span id=\"d-cotaproy\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Corte requerido<\/span><span id=\"d-corte\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Relleno requerido<\/span><span id=\"d-relleno\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Balance de tierra<\/span><span id=\"d-balance\">\u2014<\/span><\/div>\n        <button class=\"btn\" id=\"btn-reset-terreno\">Reiniciar terreno (deshacer nivelaci\u00f3n)<\/button>\n      <\/div>\n\n      <div class=\"seccion\">\n        <h3>PROGRESO DEL NIVEL<\/h3>\n        <div class=\"aviso\" id=\"aviso-restriccion\"><\/div>\n        <div class=\"dato\"><span>Obst\u00e1culos en los lotes<\/span><span id=\"chk-obst\">\u2014<\/span><\/div>\n        <div class=\"dato\" id=\"fila-compensacion\" style=\"display:none\"><span>Suelo compensado (corte\u2248relleno)<\/span><span id=\"chk-comp\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Lotes ubicados<\/span><span id=\"chk-lotes\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Lotes nivelados<\/span><span id=\"chk-nivel\">\u2014<\/span><\/div>\n        <div class=\"dato\"><span>Casas implantadas<\/span><span id=\"chk-casas\">0/0<\/span><\/div>\n        <button class=\"btn principal\" id=\"btn-verificar\">Verificar progreso del nivel<\/button>\n        <p class=\"nota-mini\" id=\"msg-nivel\" style=\"font-weight:700\"><\/p>\n        <button class=\"btn exito\" id=\"btn-siguiente-nivel\" style=\"display:none\">Ir al Nivel 2 \u2192<\/button>\n        <button class=\"btn\" id=\"btn-ver-informe\">\ud83d\udccb Ver informe final<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"footer-panel\">coordenadas locales (x,z) en metros \u00b7 cota \"y\" en metros<\/div>\n  <\/div>\n\n  <div id=\"modal-informe\" class=\"modal-overlay\" style=\"display:none\">\n    <div class=\"modal-card\">\n      <h3 style=\"margin-top:0\">Informe de levantamiento<\/h3>\n      <pre id=\"texto-informe\"><\/pre>\n      <div style=\"display:flex;gap:8px;margin-top:10px\">\n        <button class=\"btn\" id=\"btn-cerrar-informe\">Cerrar<\/button>\n        <button class=\"btn principal\" id=\"btn-descargar-informe\">Descargar (.txt)<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n/* ===================== ESCENA BASE (fondo neutro oscuro) ===================== */\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio,2));\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(0x14161b);\nscene.fog = new THREE.Fog(0x14161b, 100, 270);\nconst camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);\n\nscene.add(new THREE.HemisphereLight(0xdfe6ef, 0x101216, 0.7));\nconst sol = new THREE.DirectionalLight(0xfff2d9, 1.2);\nsol.position.set(60,90,40);\nscene.add(sol);\n\n/* ===================== GRILLA DE TERRENO (topolog\u00eda fija, altura variable por nivel) ===================== */\nconst SIZE = 90, RES = 70;\nconst cellSize = SIZE/RES;\nconst areaCelda = cellSize*cellSize;\n\nconst geo = new THREE.PlaneGeometry(SIZE, SIZE, RES, RES);\ngeo.rotateX(-Math.PI/2);\nconst pos = geo.attributes.position;\n\nfunction alturaNivel1(x,z){\n  const bultos = [\n    {x:-18, z:-10, h: 6.5, r:14},\n    {x: 14, z: 16, h: 5.0, r:11},\n    {x:  0, z: -26,h:-4.2, r:10},\n    {x: 24, z: -14,h: 3.0, r:6},\n  ];\n  let h = Math.sin(x*0.045)*1.4 + Math.cos(z*0.05)*1.1 + Math.sin((x+z)*0.03)*0.8;\n  for(const b of bultos) h += b.h * Math.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  return h;\n}\nfunction alturaNivel2(x,z){\n  const bultos = [\n    {x:-22, z:-14, h: 8.0, r:12},\n    {x: 20, z: 12, h: 6.5, r:10},\n    {x: -6, z: 18, h: 5.0, r:9},\n    {x:  8, z:-22, h:-5.5, r:11},\n    {x: 26, z: -6, h: 4.0, r:7},\n  ];\n  let h = Math.sin(x*0.06)*2.2 + Math.cos(z*0.07)*1.8 + Math.sin((x+z)*0.04)*1.3;\n  for(const b of bultos) h += b.h * Math.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  return h;\n}\n\nfunction alturaNivel3(x,z){\n  const bultos = [\n    {x:-26, z:-18, h: 9.0, r:12},\n    {x:-20, z: 16, h: 7.0, r:10},\n    {x: 24, z: 14, h: 8.0, r:11},\n    {x: 28, z:-16, h: 6.0, r:9},\n    {x: 16, z: -2, h: 4.5, r:8},\n  ];\n  let h = Math.sin(x*0.07)*2.4 + Math.cos(z*0.08)*2.0 + Math.sin((x+z)*0.05)*1.5;\n  for(const b of bultos) h += b.h * Math.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  // vaguada del arroyo: depresi\u00f3n longitudinal en la franja central\n  h -= 5.5 * Math.exp(-(x*x)/(2*7*7));\n  return h;\n}\n\nconst idxGrid = [];\nfor(let gz=0; gz<=RES; gz++) idxGrid.push(new Int32Array(RES+1));\nfunction coordAGrilla(x,z){\n  let gx = Math.round((x+SIZE/2)/cellSize);\n  let gz = Math.round((z+SIZE/2)/cellSize);\n  gx = Math.min(RES, Math.max(0,gx));\n  gz = Math.min(RES, Math.max(0,gz));\n  return [gx,gz];\n}\n\nconst heights = new Float32Array(pos.count);\nfor(let i=0;i<pos.count;i++){\n  const x = pos.getX(i), z = pos.getZ(i);\n  heights[i] = alturaNivel1(x,z);\n  pos.setY(i, heights[i]);\n  const [gx,gz] = coordAGrilla(x,z);\n  idxGrid[gz][gx] = i;\n}\nconst heightsIniciales = heights.slice();\ngeo.computeVertexNormals();\n\nfunction alturaActual(x,z){\n  const [gx,gz] = coordAGrilla(x,z);\n  return heights[idxGrid[gz][gx]];\n}\nfunction rangoAlturaActual(){\n  let mn=Infinity,mx=-Infinity;\n  for(let i=0;i<heights.length;i++){ if(heights[i]<mn)mn=heights[i]; if(heights[i]>mx)mx=heights[i]; }\n  return [mn,mx];\n}\n\nlet hMin=0, hMax=1;\nconst rampa = [\n  {t:0.00, c:new THREE.Color(0x24391a)},\n  {t:0.32, c:new THREE.Color(0x4b6b2c)},\n  {t:0.58, c:new THREE.Color(0x8a7a2e)},\n  {t:0.80, c:new THREE.Color(0x6b4423)},\n  {t:1.00, c:new THREE.Color(0xcbb98a)},\n];\nfunction colorPorCota(h){\n  const t = Math.min(1,Math.max(0,(h-hMin)/(hMax-hMin)));\n  for(let i=0;i<rampa.length-1;i++){\n    if(t>=rampa[i].t && t<=rampa[i+1].t){\n      const local = (t-rampa[i].t)/(rampa[i+1].t-rampa[i].t || 1);\n      return rampa[i].c.clone().lerp(rampa[i+1].c, local);\n    }\n  }\n  return rampa[rampa.length-1].c;\n}\nconst colores = new Float32Array(pos.count*3);\ngeo.setAttribute('color', new THREE.BufferAttribute(colores,3));\n\nconst mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.95, metalness:0, flatShading:false});\nconst terreno = new THREE.Mesh(geo, mat);\nscene.add(terreno);\n\n/* ---- curvas de nivel (marching squares sobre grilla m\u00e1s gruesa) ---- */\nconst RES_C = 36;\nconst cellC = SIZE/RES_C;\nconst intervaloCurvas = 1.5;\nconst curvasGrupo = new THREE.Group(); scene.add(curvasGrupo);\nconst curvaObjetivoGrupo = new THREE.Group(); scene.add(curvaObjetivoGrupo);\nlet muestraActual = null;\nlet curvasVisibles = true;\nlet cotaObjetivo = 0;\n\nfunction calcularMuestra(){\n  const m=[];\n  for(let gz=0; gz<=RES_C; gz++){\n    const fila=[];\n    for(let gx=0; gx<=RES_C; gx++) fila.push(alturaActual(-SIZE/2+cellC*gx, -SIZE/2+cellC*gz));\n    m.push(fila);\n  }\n  return m;\n}\nfunction segmentosParaNivel(nivel, muestra){\n  const posiciones=[];\n  for(let gz=0; gz<RES_C; gz++){\n    for(let gx=0; gx<RES_C; gx++){\n      const x0=-SIZE/2+cellC*gx, x1=x0+cellC, z0=-SIZE/2+cellC*gz, z1=z0+cellC;\n      const h00=muestra[gz][gx], h10=muestra[gz][gx+1], h01=muestra[gz+1][gx], h11=muestra[gz+1][gx+1];\n      const pts=[];\n      const cruce=(ha,hb,pa,pb)=>{ if((ha<nivel)!==(hb<nivel)){ const t=(nivel-ha)/(hb-ha); pts.push([pa[0]+(pb[0]-pa[0])*t, pa[1]+(pb[1]-pa[1])*t]); } };\n      cruce(h00,h10,[x0,z0],[x1,z0]);\n      cruce(h10,h11,[x1,z0],[x1,z1]);\n      cruce(h11,h01,[x1,z1],[x0,z1]);\n      cruce(h01,h00,[x0,z1],[x0,z0]);\n      if(pts.length>=2) posiciones.push(pts[0][0], nivel+0.08, pts[0][1], pts[1][0], nivel+0.08, pts[1][1]);\n    }\n  }\n  return posiciones;\n}\nfunction generarCurvasNivel(){\n  muestraActual = calcularMuestra();\n  curvasGrupo.clear();\n  const [mn,mx] = rangoAlturaActual();\n  const nivelIni = Math.ceil(mn/intervaloCurvas)*intervaloCurvas;\n  let posiciones = [];\n  for(let nivel=nivelIni; nivel<mx; nivel+=intervaloCurvas) posiciones = posiciones.concat(segmentosParaNivel(nivel, muestraActual));\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(posiciones,3));\n  curvasGrupo.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0xe8e2cf, transparent:true, opacity:0.4})));\n  actualizarCurvaObjetivo();\n}\nfunction actualizarCurvaObjetivo(){\n  curvaObjetivoGrupo.clear();\n  if(!muestraActual) return;\n  const nivel = Math.round(cotaObjetivo/intervaloCurvas)*intervaloCurvas;\n  const posiciones = segmentosParaNivel(nivel, muestraActual);\n  if(posiciones.length){\n    const g = new THREE.BufferGeometry();\n    g.setAttribute('position', new THREE.Float32BufferAttribute(posiciones,3));\n    curvaObjetivoGrupo.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0xe8590c})));\n  }\n}\n\n// plano invisible auxiliar para arrastres\nconst planoArrastre = new THREE.Mesh(new THREE.PlaneGeometry(700,700), new THREE.MeshBasicMaterial({visible:false}));\nplanoArrastre.rotation.x = -Math.PI/2;\nscene.add(planoArrastre);\n\n/* ---- obst\u00e1culos interactivos (\u00e1rboles / rocas) ---- */\nconst obstaculosArbolesNivel1 = [\n  {tipo:'arbol', x:-20, z:-12},{tipo:'arbol', x:-16, z:-6},{tipo:'arbol', x:-24, z:-14},\n  {tipo:'arbol', x:12, z:18},{tipo:'arbol', x:16, z:14},{tipo:'arbol', x:10, z:22},\n  {tipo:'arbol', x:-8, z:20},{tipo:'arbol', x:26, z:-16},{tipo:'arbol', x:22, z:-10},\n  {tipo:'roca', x:24, z:-14, s:1.4},{tipo:'roca', x:26, z:-12, s:0.9},\n  {tipo:'roca', x:-2, z:-25, s:1.1},{tipo:'roca', x:2, z:-27, s:0.7},\n];\nconst obstaculosArbolesNivel2 = [\n  {tipo:'arbol', x:-22,z:-16},{tipo:'arbol', x:-18,z:-8},{tipo:'arbol', x:-26,z:-18},\n  {tipo:'arbol', x:-10,z:20},{tipo:'arbol', x:-4,z:16},{tipo:'arbol', x:2,z:22},\n  {tipo:'arbol', x:20,z:14},{tipo:'arbol', x:24,z:10},{tipo:'arbol', x:18,z:18},\n  {tipo:'arbol', x:10,z:-24},{tipo:'arbol', x:4,z:-20},\n  {tipo:'roca', x:26,z:-8,s:1.5},{tipo:'roca', x:24,z:-4,s:1.0},\n  {tipo:'roca', x:-8,z:-22,s:1.2},{tipo:'roca', x:-2,z:-24,s:0.8},\n h.exp(-((x-b.x)**2+(z-b.z)**2)/(2*b.r*b.r));\n  h -= 5.0 * Math.exp(-(x*x)/(2*6*6)); // vaguada de arroyo, como en el nivel 3\n  return h;\n}\nconst obstaculosArbolesNivel5 = [\n  {tipo:'arbol', x:-30,z:-22},{tipo:'arbol', x:-26,z:-16},{tipo:'arbol', x:-32,z:-18},{tipo:'arbol', x:-28,z:-24},\n  {tipo:'arbol', x:-24,z:16},{tipo:'arbol', x:-20,z:22},{tipo:'arbol', x:-26,z:20},\n  {tipo:'arbol', x:24,z:14},{tipo:'arbol', x:28,z:10},{tipo:'arbol', x:22,z:20},{tipo:'arbol', x:30,z:14},\n  {tipo:'arbol', x:32,z:-16},{tipo:'arbol', x:28,z:-20},{tipo:'arbol', x:34,z:-14},\n  {tipo:'arbol', x:16,z:-4},{tipo:'arbol', x:20,z:0},\n  {tipo:'roca', x:-26,z:-14,s:1.6},{tipo:'roca', x:-22,z:-10,s:1.1},\n  {tipo:'roca', x:28,z:6,s:1.4},{tipo:'roca', x:32,z:2,s:1.0},\n];\nlet obstaculosDefIniciales = obstaculosArbolesNivel1;\nlet obstaculosObjetos = [];\nfunction crearArbol(){\n  const g = new THREE.Group();\n  const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.32,2.4,6), new THREE.MeshStandardMaterial({color:0x5a4128}));\n  tronco.position.y = 1.2;\n  const copa = new THREE.Mesh(new THREE.ConeGeometry(1.6,3.2,7), new THREE.MeshStandardMaterial({color:0x3f6b2e}));\n  copa.position.y = 3.6;\n  g.add(tronco,copa); g.userData.tipo='arbol'; return g;\n}\nfunction crearRoca(s){\n  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s,0), new THREE.MeshStandardMaterial({color:0x7d7466, flatShading:true}));\n  m.position.y = s*0.5; m.rotation.set(Math.random(),Math.random(),Math.random());\n  const g = new THREE.Group(); g.add(m); g.userData.tipo='roca'; return g;\n}\nfunction generarObstaculos(){\n  obstaculosObjetos.forEach(g=>scene.remove(g));\n  obstaculosObjetos = [];\n  obstaculosDefIniciales.forEach(def=>{\n    const g = def.tipo==='arbol' ? crearArbol() : crearRoca(def.s);\n    g.position.set(def.x, alturaActual(def.x,def.z), def.z);\n    scene.add(g); obstaculosObjetos.push(g);\n  });\n  actualizarPanelObstaculos();\n}\n\nconst estanque = new THREE.Mesh(new THREE.Ci r(let z=r.minZ; z<=r.maxZ; z+=paso){\n    for(const x of [r.minX, r.maxX]){\n      const xa = Math.max(-SIZE/2, Math.min(SIZE/2, x));\n      const za = Math.max(-SIZE/2, Math.min(SIZE/2, z));\n      puntosFranja.push(new THREE.Vector3(xa, alturaActual(xa,za)+0.3, za));\n    }\n  }\n  // dos l\u00edneas rojas de borde\n  for(const x of [r.minX, r.maxX]){\n    const pts=[];\n    for(let z=Math.max(-SIZE/2,r.minZ); z<=Math.min(SIZE/2,r.maxZ); z+=paso){\n      pts.push(new THREE.Vector3(x, alturaActual(x,z)+0.3, z));\n    }\n    if(pts.length>1){\n      const g = new THREE.BufferGeometry().setFromPoints(pts);\n      restriccionGrupo.add(new THREE.Line(g, new THREE.LineBasicMaterial({color:0xff4b3a})));\n    }\n  }\n  // relleno transl\u00facido rojo\n  const ancho = r.maxX-r.minX;\n  const largo = Math.min(SIZE, r.maxZ-r.minZ);\n  const planoR = new THREE.Mesh(\n    new THREE.PlaneGeometry(ancho, largo),\n    new THREE.MeshBasicMaterial({color:0xff4b3a, transparent:true, opacity:0.18, side:THREE.DoubleSide, depthWrite:false})\n  );\n  planoR.rotation.x = -Math.PI/2;\n  const cx=(r.minX+r.maxX)/2, cz=Math.max(-SIZE/2,Math.min(SIZE/2,(r.minZ+r.maxZ)/2));\n  planoR.position.set(cx, alturaActual(cx,cz)+0.2, cz);\n  restriccionGrupo.add(planoR);\n}\nfunction dentroRestriccion(x,z){\n  const r = NIVELES[nivelActual].restriccion;\n  if(!r) return false;\n  return x>=r.minX && x<=r.maxX && z>=r.minZ && z<=r.maxZ;\n}\nfunction bboxTocaRestriccion(bbox){\n  const r = NIVELES[nivelActual].restriccion;\n  if(!r) return false;\n  return bbox.minX < r.maxX && bbox.maxX > r.minX && bbox.minZ < r.maxZ && bbox.maxZ > r.minZ;\n}\n\nfunction cargarNivel(n){\n  nivelActual = n;\n  const cfg = NIVELES[n];\n  for(let i=0;i<pos.count;i++){\n    const x=pos.getX(i), z=pos.getZ(i);\n    const h = cfg.terrenoFn(x,z);\n    heights[i]=h; pos.setY(i,h);\n  }\n  heightsIniciales.set(heights);\n  let mn=Infinity, mx=-Infinity;\n  for(let i=0;i<heights.length;i++){ if(heights[i]<mn)mn=heights[i]; if(heights[i]>mx)mx=heights[i]; }\n  hMin = mn-6; hMax = mx+6;\n  for(let i=0;i<pos.count;i++){\n    const c = colorPorCota(heights[i]);\n    colores[i*3]=c.r; colores[i*3+1]=c.g; colores[i*3+2]=c.b;\n  }\n  pos.needsUpdate=true; geo.attributes.color.needsUpdate=true;\n  geo.computeVertexNormals(); geo.computeBoundingSphere();\n\n  obstaculosDefIniciales = cfg.obstaculosDef.filter(o=>!enCalle(o.x,o.z,n));\n  generarObstaculos();\n  estanque.position.set(0, alturaActual(0,-26)+0.05, -26);\n  hOrigTalud.clear(); limpiarCasas(); dibujarCalleProyectada(n);\n  document.getElementById('seccion-casa').style.display = n>=3 ? 'block' : 'none';\n  document.getElementById('fila-pend').style.display = NIVELES[n].pendiente ? 'block' : 'none';\n  document.getElementById('fila-cota-reco').style.display = NIVELES[n].acceso ? 'block' : 'none';\n  document.getElementById('msg-cota-reco').textContent='';\n  document.getElementById('nota-retiros').textContent = NIVELES[n].casaEstricta ? '(en este nivel los retiros son obligatorios para fijar la casa)' : '(si no se cumplen es solo una advertencia: igual pod\u00e9s fijar la casa)';\n\n  lotesFijados.forEach(l=>scene.remove(l.grupoVisual));\n  lotesFijados = [];\n  loteSeleccionadoIdx = -1;\n  document.getElementById('lista-lotes-guardados').innerHTML = '';\n  document.getElementById('selector-lotes').innerHTML = '';\n  reiniciarLevantamiento();\n  if(loteMesh){ scene.remove(loteMesh); scene.remove(loteBorde); loteMesh=null; loteBorde=null; }\n  document.getElementById('btn-fijar-lote').disabled=true;\n  document.getElementById('btn-quitar-lote').disabled=true;\n\n  acumCorte=0; acumRelleno=0;\n  document.getElementById('d-acorte').textContent='0.0 m\u00b3';\n  document.getElementById('d-arelleno').textContent='0.0 m\u00b3';\n  cotaObjetivo = 0;\n  document.getElementById('input-cota-objetivo').value = '0';\n\n  document.getElementById('controles-pasos').style.display = cfg.soloAplanar ? 'none' : 'block';\n  document.getElementById('nota-nivel1-simple').style.display = cfg.soloAplanar ? 'block' : 'none';\n  herramienta = 'aplanar';\n  document.querySelectorAll('.btn-herr').forEach(x=>x.classList.remove('activo'));\n  document.getElementById('btn-herr-aplanar').classList.add('activo');\n  categoriaHerramienta = 'gruesa';\n  document.querySelectorAll('#fila-categoria .btn-cat').forEach(x=>x.classList.remove('activo'));\n  document.querySelector('#fila-categoria .btn-cat[data-cat=\"gruesa\"]').classList.add('activo');\n  renderPasos();\n  colorAnilloSegunHerramienta();\n  mapaCalorGrupo.clear();\n  document.getElementById('barra-progreso-wrap').style.display='none';\n\n  modoLote = cfg.modoLoteForzado;\n  areaObjetivoActiva = false;\n  document.getElementById('lote-medidas-fijas').style.display = modoLote==='medidas' ? 'block' : 'none';\n  document.getElementById('lote-area-objetivo').style.display = modoLote==='area' ? 'block' : 'none';\n\n  reiniciarCalle();\n  document.getElementById('btn-modo-calle').style.display = cfg.calleRequerida ? 'block' : 'none';\n  document.getElementById('seccion-calle').style.display = cfg.calleRequerida ? 'block' : 'none';\n\n  generarCurvasNivel();\n  dibujarRestriccion(cfg.restriccion);\n  actualizarContadorLotes();\n\n  const avisoR = document.getElementById('aviso-restriccion');\n  if(cfg.restriccion){\n    avisoR.textContent = '\u26a0 ' + cfg.restriccion.etiqueta;\n    avisoR.style.display='block';\n  } else {\n    avisoR.style.display='none';\n  }\n  document.getElementById('fila-compensacion').style.display = cfg.compensar ? 'flex' : 'none';\n\n  document.getElementById('titulo-nivel').textContent = `SIMULADOR TOPOGR\u00c1FICO \u2014 NIVEL ${n}`;\n  document.getElementById('subtitulo-nivel').textContent = cfg.nombre;\n  document.getElementById('badge-nivel').textContent = `N.${n}`;\n  try{parent.postMessage({tipo:'nivelActual',n},'*');}catch(e){}\n\n  document.getElementById('chk-obst').textContent = '\u2014';\n  document.getElementById('chk-lotes').textContent = `0/ ;i++){ const k=i*2; I.push(k,k+1,k+2,k+1,k+3,k+2); }\n    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.setIndex(I); g.computeVertexNormals();\n    return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.95,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));\n  };\n  grp.add(banda(-3.5,3.5,0.10,0x2e2f33,t0,t1));\n  grp.add(banda(3.5,3.8,0.22,0xc9c6bd,t0,t1)); grp.add(banda(-3.8,-3.5,0.22,0xc9c6bd,t0,t1));\n  grp.add(banda(3.8,5.5,0.16,0x9d9a90,t0,t1)); grp.add(banda(-5.5,-3.8,0.16,0x9d9a90,t0,t1));\n  for(let t=t0+2;t<t1-3;t+=6) grp.add(banda(-0.1,0.1,0.14,0xf2c230,t,t+3));\n  if(c.puente){\n    const pa=c.puente.a, pb=c.puente.b, L=pb-pa, xm=(pa+pb)/2, bm=new THREE.MeshStandardMaterial({color:0xb8b5ad,roughness:.9});\n    const ya=yCalle(pa+0.01,c.pz), yb=yCalle(pb-0.01,c.pz), yd=Math.min(ya,yb);\n    const slab=new THREE.Mesh(new THREE.BoxGeometry(L,0.7,11.4),bm); slab.position.set(xm,yd-0.28,c.pz); grp.add(slab);\n    [-5.6,5.6].forEach(o=>{ const r=new THREE.Mesh(new THREE.BoxGeometry(L,0.9,0.14),new THREE.MeshStandardMaterial({color:0xe0ddd5,roughness:.8})); r.position.set(xm,yd+0.7,c.pz+o); grp.add(r); });\n    [pa+3,xm,pb-3].forEach(x=>[-3.5,3.5].forEach(o=>{ const gy=alturaExacta(x,c.pz+o)-0.5, top=yd-0.6, h=top-gy; if(h>0.2){ const p=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.5,h,12),bm); p.position.set(x,gy+h/2,c.pz+o); grp.add(p); } }));\n  }\n  calleGrupoVis=grp; scene.add(grp);\n}\nfunction chequearCalle(esq){\n  if(!calleProy) return null; const c=calleProy;\n  const d=esq.map(p=>(p.x-c.px)*c.nx+(p.z-c.pz)*c.nz);\n  if((Math.min(...d)<0&&Math.max(...d)>0)||d.some(v=>Math.abs(v)<CALLE_MEDIA-0.01)) return 'Ese lote invade la calle ('+c.nombre+') o su vereda. El espacio p\u00fablico no se puede ocupar.';\n  const o=esq.map((p,i)=>({p,a:Math.abs(d[i])})).sort((u,v)=>u.a-v.a);\n  const gap=o[1].a-CALLE_MEDIA;\n  if(gap>1.5) return 'El lote debe dar frente a la calle ('+c.nombre+'): un lado tiene que quedar paralelo y pegado a la l\u00ednea municipal (hoy a '+gap.toFixed(1)+' m). Acercalo o giralo.';\n  const fr=Math.hypot(o[0].p.x-o[1].p.x,o[0].p.z-o[1].p.z);\n  if(fr<8) return 'El frente sobre la calle es de '+fr.toFixed(1)+' m; el m\u00ednimo es 8 m.';\n  return null;\n}\n\n\n/* ===== Talud suave en el borde de los lotes ===== */\nconst hOrigTalud=new Map(), ANCHO_TALUD=3.5;\nfunction enCalle(x,z,n){ const c=CALLES_PROY[n]; if(!c) return false; const a=c.ang*Math.PI/180; return Math.abs((x-c.px)*(-Math.sin(a))+(z-c.pz)*Math.cos(a))<CALLE_MEDIA+2; }\nfunction cotaEn(l,x,z){ if(!l.pend||!calleProy) return l.cotaObjetivo; const d=Math.abs((x-calleProy.px)*calleProy.nx+(z-calleProy.pz)*calleProy.nz)-CALLE_MEDIA; return l.cotaObjetivo+l.pend/100*Math.max(0,d); }\nfunction distPoli(x,z,C){ let m=1e9; C.forEach((p,i)=>{ const q=C[(i+1)%C.length], dx=q.x-p.x, dz=q.z-p.z; let t=((x-p.x)*dx+(z-p.z)*dz)/(dx*dx+dz*dz); t=Math.max(0,Math.min(1,t)); m=Math.min(m,Math.hypot(x-p.x-t*dx,z-p.z-t*dz)); }); return m; }\nfunction talud(){\n  for(let gz=0;gz<=RES;gz++) for(let gx=0;gx<=RES;gx++){\n    const i=idxGrid[gz][gx], vx=pos.getX(i), vz=pos.getZ(i);\n    if(lotesFijados.some(l=>dentroPoligono(vx,vz,l.corners))) continue;\n    if(calleProy && Math.abs((vx-calleProy.px)*calleProy.nx+(vz-calleProy.pz)*calleProy.nz)<CALLE_MEDIA+1.5) continue;\n    let best=null, bd=ANCHO_TALUD; lotesFijados.forEach(l=>{ const d=distPoli(vx,vz,l.corners); if(d<bd){ bd=d; best=l; } });\n    if(!best) continue;\n    if(!hOrigTalud.has(i)) hOrigTalud.set(i,heights[i]);\n    const t=1-bd/ANCHO_TALUD, w=t*t*(3-2*t), nuevo=hOrigTalud.get(i)*(1-w)+cotaEn(best,vx,vz)*w, real=nuevo-heights[i];\n    if(Math.abs(real)<1e-4) continue;\n    heights[i]=nuevo; pos.setY(i,nuevo);\n    if(real<0) acumCorte+=-real*areaCelda; else acumRelleno+=real*areaCelda;\n  }\n}\nfunction cordonLote(l){\n  if(!calleProy||!calleGrupoVis) return null; const c=calleProy; let best=null,bd=1e9;\n  l.corners.forEach((p,i)=>{ const q=l.corners[(i+1)%l.corners.length], d=((p.x+q.x)/2-c.px)*c.nx+((p.z+q.z)/2-c.pz)*c.nz; if(Math.abs(d)<bd){ bd=Math.abs(d); best={p,q}; } });\n  let mx=-1e9;\n  [best.p,best.q,{x:(best.p.x+best.q.x)/2,z:(best.p.z+best.q.z)/2}].forEach(pt=>{\n    const d=(pt.x-c.px)*c.nx+(pt.z-c.pz)*c.nz, s=Math.sign(d)||1, k=Math.abs(d)-3.8, x=pt.x-s*k*c.nx, z=pt.z-s*k*c.nz;\n    rcCalle.set(new THREE.Vector3(x,300,z),new THREE.Vector3(0,-1,0));\n    const h=rcCalle.intersectObjects(calleGrupoVis.children,false)[0]; if(h) mx=Math.max(mx,h.point.y); });\n  return mx>-1e8?mx:null;\n}\n\n\n/* ===== Perfil de calle: rasante suave (m\u00e1x. 1,5%) y terreno adaptado a ambos lados ===== */\nfunction conCalle(fn,n){\n  const c=CALLES_PROY[n]; if(!c) return fn;\n  const a=c.ang*Math.PI/180, dx=Math.cos(a), dz=Math.sin(a), nx=-dz, nz=dx;\n  let St=0,Stt=0,Sh=0,Sth=0,N=0;\n  for(let t=-65;t<=65;t+=2){ const x=c.px+dx*t, z=c.pz+dz*t; if(Math.abs(x)>44||Math.abs(z)>44) continue; const h=fn(x,z); N++; St+=t; Stt+=t*t; Sh+=h; Sth+=t*h; }\n  let g=(N*Sth-St*Sh)/((N*Stt-St*St)||1); g=Math.max(-0.015,Math.min(0.015,g)); const h0=(Sh-g*St)/N;\n  // rasante suave (m\u00e1x. 1,5 %) + franja junto a la calle con pendiente suave (m\u00e1x. 7 %) + mezcla gradual con el terreno natural\n  const PB=0.07, ZB=24, ZF=44, MEDIA=5.5;\n  return (x,z)=>{ const d=(x-c.px)*nx+(z-c.pz)*nz, t=(x-c.px)*dx+(z-c.pz)*dz, ad=Math.abs(d), hs=h0+g*t;\n    if(ad<=MEDIA) return hs;\n    const base=fn(x,z); if(ad>=ZF) return base;\n    const nd=base-hs, lim=PB*(Math.min(ad,ZB)-MEDIA), cl=Math.max(-lim,Math.min(lim,nd));\n    if(ad<=ZB) return hs+cl;\n    const w=(ad-ZB)/(ZF-ZB), s=w*w*(3-2*w); return hs+cl*(1-s)+nd*s; };\n}\nlet _terrenoN4=null;\nfunction terrenoNivel4(x,z){ if(!_terrenoN4) _terrenoN4=conCalle(alturaNivel4,4); return _terrenoN4(x,z); }\n\n/* ===================== CASA ===================== */\nconst CASAS={A:{w:7,l:11,pared:0xe9dcc3,techo:0x9c3d2e},B:{w:9,l:12,pared:0xcfd8dc,techo:0x45403c}};\nlet casaObj=null, casaTipo='A', casaRot=0, casaLote=-1, casaArr=false, casaFijas=[];\nfunction crearCasa(t){\n  const d=CASAS[t], g=new THREE.Group(), M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});\n  const add=(geo,c,x,y,z)=>{ const m=new THREE.Mesh(geo,M(c)); m.position.set(x,y,z); g.add(m); return m; };\n  add(new THREE.BoxGeometry(d.w+.4,.3,d.l+.4),0x8d8d8d,0,.15,0);\n  add(new THREE.BoxGeometry(d.w,2.8,d.l),d.pared,0,1.7,0);\n  const sh=new THREE.Shape(); sh.moveTo(-d.w/2-.4,0); sh.lineTo(d.w/2+.4,0); sh.lineTo(0,1.8); sh.closePath();\n  add(new THREE.ExtrudeGeometry(sh,{depth:d.l+.8,bevelEnabled:false}),d.techo,0,3.1,-(d.l+.8)/2);\n  const f=d.l/2+.03;\n  add(new THREE.BoxGeometry(.9,2.1,.08),0x5a3a22,0,1.35,f);\n  [-1,1].forEach(k=>add(new THREE.BoxGeometry(1.1,1.1,.08),0x7fb2d6,k*d.w*.28,1.9,f));\n  [-1,1].forEach(k=>add(new THREE.BoxGeometry(.08,1.1,1.1),0x7fb2d6,k*(d.w/2+.03),1.9,0));\n  return g;\n}\nfunction esquinasCasaDe(tipo,rot,px,pz){ const d=CASAS[tipo], co=Math.cos(rot), si=Math.sin(rot);\n  return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>{ const u=a*d.w/2, v=b*d.l/2; return {x:px+u*co+v*si, z:pz-u*si+v*co}; }); }\nfunction esquinasCasa(){ return esquinasCasaDe(casaTipo,casaRot,casaObj.position.x,casaObj.position.z); }\nlet retirosOkGlobal=true;\nfunction requisitosCasa(l,tipo,rot,px,pz,yFija){\n  const C=l.corners, H=esquinasCasaDe(tipo,rot,px,pz), cfgN=NIVELES[nivelActual], estricto=!!cfgN.casaEstricta;\n  const yLote=cotaEn(l,px,pz), y=(yFija===undefined?yLote:yFija);\n  let ar=0; C.forEach((p,i)=>{ const q=C[(i+1)%C.length]; ar+=p.x*q.z-q.x*p.z; }); const sg=ar>=0?1:-1;\n  let fi=-1, best=1e9;\n  if(calleProy) C.forEach((p,i)=>{ const q=C[(i+1)%C.length], mx=(p.x+q.x)/2, mz=(p.z+q.z)/2, dd=Math.abs((mx-calleProy.px)*calleProy.nx+(mz-calleProy.pz)*calleProy.nz); if(dd<best){best=dd;fi=i;} });\n  let rOk=true, msg='', fuera=false;\n  C.forEach((p,i)=>{ const q=C[(i+1)%C.length], Lg=Math.hypot(q.x-p.x,q.z-p.z), req=i===fi?3:1.5;\n    const m=Math.min(...H.map(h=>sg*((q.x-p.x)*(h.z-p.z)-(q.z-p.z)*(h.x-p.x))/Lg));\n    if(m<req){ rOk=false; if(m<0) fuera=true; msg = m<0 ? 'La casa se sale del lote.' : (i===fi?'Retiro de frente insuficiente (m\u00edn. 3 m).':'Retiro lateral/fondo insuficiente (m\u00edn. 1,5 m).'); } });\n  const d=CASAS[tipo], oc=d.w*d.l/l.area*100, retirosOk=rOk;\n  const cor=cordonLote(l), piso=y+0.3; let cotaOk=true, accOk=true, nivOk=true, pendOk=true, altOk=true; const T=[];\n  T.push((retirosOk?'\u2713':(estricto?'\u2717':'\u26a0'))+' Retiros (frente 3 m, resto 1,5 m)'+(retirosOk?'':': '+msg+((fuera||estricto)?'':' (advertencia: igual se puede fijar)')));\n  if(cor!==null){ cotaOk = piso>=cor+0.3-1e-6;\n    T.push((cotaOk?'\u2713':'\u2717')+' Cota: piso '+piso.toFixed(2)+' m \u00b7 cord\u00f3n '+cor.toFixed(2)+' m (m\u00edn. '+(cor+0.3).toFixed(2)+' m)'+(cotaOk?'':' \u2192 us\u00e1 \"Cota recomendada\" o sub\u00ed la cota objetivo y volv\u00e9 a nivelar'));\n    if(cfgN.acceso){ const run=Math.min(...H.map(h=>Math.abs((h.x-calleProy.px)*calleProy.nx+(h.z-calleProy.pz)*calleProy.nz)))-3.8; const pa=run>0.1?(piso-cor)/run*100:99; accOk=pa<=12; T.push((accOk?'\u2713':'\u2717')+' Acceso vehicular: pendiente '+pa.toFixed(1)+' % (m\u00e1x. 12 %)'+(accOk?'':' \u2192 baj\u00e1 la cota del lote o alej\u00e1 la casa de la calle')); } }\n  if(estricto){\n    nivOk=verificarNivelacionLote(l).nivelado; T.push((nivOk?'\u2713':'\u2717')+' Lote nivelado'+(nivOk?'':' \u2192 termin\u00e1 de nivelar con \"Aplanar\" (la tierra no puede tapar la casa)'));\n    pendOk=l.pend>=1&&l.pend<=2.5; T.push((pendOk?'\u2713':'\u2717')+' Pendiente de desag\u00fce: '+(l.pend||0)+' % (1 a 2,5 %)');\n    altOk=Math.abs(y-yLote)<=0.05; if(!altOk) T.push('\u2717 La casa qued\u00f3 a otra altura que el lote \u2192 quitala y coloc\u00e1la de nuevo');\n  }\n  const ok=(estricto?retirosOk:!fuera)&&cotaOk&&accOk&&nivOk&&pendOk&&altOk;\n  return {ok,retirosOk,L:T,oc};\n}\nfunction evaluarCasa(){\n  if(!casaObj) return false; casaObj.rotation.y=casaRot;\n  const l=lotesFijados[casaLote], el=document.getElementById('msg-casa');\n  casaObj.position.y=cotaEn(l,casaObj.position.x,casaObj.position.z);\n  const r=requisitosCasa(l,casaTipo,casaRot,casaObj.position.x,casaObj.position.z);\n  retirosOkGlobal=r.retirosOk;\n  el.innerHTML=r.L.join('<br>')+'<br>Ocupaci\u00f3n del lote: '+r.oc.toFixed(0)+' %'; el.style.color=r.ok?(r.retirosOk?'#2e7d32':'#b9770e'):'#b23a2e';\n  return r.ok;\n}\n/* terreno bloqueado alrededor de las casas ya fijadas */\nfunction casaBloqueaVertice(x,z){\n  for(const l of lotesFijados){ const c=l.casaInfo; if(!c||!l.casaOk) continue;\n    const d=CASAS[c.tipo], co=Math.cos(c.rot), si=Math.sin(c.rot), dx=x-c.x, dz=z-c.z, u=dx*co-dz*si, v=dx*si+dz*co;\n    if(Math.abs(u)<=d.w/2+1 && Math.abs(v)<=d.l/2+1) return true; }\n  return false;\n}\nfunction limpiarCasas(){ if(casaObj){ scene.remove(casaObj); casaObj=null; } casaFijas.forEach(g=>scene.remove(g)); casaFijas=[]; const e=document.getElementById('msg-casa'); if(e) e.textContent=''; }\nfunction ponerCasa(t){\n  const l=lotesFijados[loteSeleccionadoIdx], el=document.getElementById('msg-casa');\n  if(!l){ el.textContent='Primero fij\u00e1 y seleccion\u00e1 un lote.'; el.style.color='#b23a2e'; return; }\n  if(!verificarNivelacionLote(l).nivelado){ el.textContent='Primero nivel\u00e1 el lote seleccionado.'; el.style.color='#b23a2e'; return; }\n  if(casaObj){ if(casaLote===loteSeleccionadoIdx) scene.remove(casaObj); else casaFijas.push(casaObj); }\n  casaTipo=t; casaLote=loteSeleccionadoIdx; casaObj=crearCasa(t);\n  const cx=l.corners.reduce((s,p)=>s+p.x,0)/l.corners.length, cz=l.corners.reduce((s,p)=>s+p.z,0)/l.corners.length;\n  casaObj.position.set(cx,cotaEn(l,cx,cz),cz);\n  if(l.casaObjFija){ scene.remove(l.casaObjFija); casaFijas=casaFijas.filter(g=>g!==l.casaObjFija); l.casaObjFija=null; } l.casaOk=false; l.casaInfo=null;\n  casaRot=0; if(calleProy){ const s=Math.
